<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  这是 public/images/og-default.png 的来源，不是被服务的页面。
  重新生成：
    1. cd apps/marketing && pnpm build && pnpm start   （默认 3001 端口）
    2. 从首页 <head> 里找到含 IBM Plex @font-face 的那个 CSS chunk，把它的 URL
       填进下面的 <link>（chunk 名带构建哈希，每次构建都会变）
    3. 用 Playwright 以 1200x630、deviceScaleFactor 1 截这个文件，
       等 document.fonts.ready 之后再截，否则字体会落到系统回退
    4. 覆盖 public/images/og-default.png
  取值全部来自 globals.css 的 Signal Console token；改配色时这里要一起改，
  它是分享链接时唯一露出的品牌表面。
-->
<link rel="stylesheet" href="http://localhost:3001/_next/static/chunks/REPLACE_WITH_CURRENT_FONT_CHUNK.css">
<style>
  html,body{margin:0;padding:0;}
  body{width:1200px;height:630px;overflow:hidden;}
  .card{
    position:relative;width:1200px;height:630px;background:#0B0F14;
    font-family:"IBM Plex Sans","IBM Plex Sans Fallback",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .grid{
    position:absolute;inset:0;opacity:0.45;
    background-image:
      linear-gradient(rgba(76,195,250,0.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(76,195,250,0.05) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 78%);
  }
  .glow{
    position:absolute;top:-170px;left:8%;width:640px;height:420px;
    background:radial-gradient(ellipse,rgba(61,220,151,0.16),transparent 65%);
    filter:blur(12px);
  }
  .glow2{
    position:absolute;top:-130px;right:4%;width:520px;height:380px;
    background:radial-gradient(ellipse,rgba(76,195,250,0.12),transparent 65%);
    filter:blur(12px);
  }
  .rule{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#3DDC97,#4CC3FA);}
  .inner{position:relative;padding:88px 80px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:12px;align-self:flex-start;
    font-family:"IBM Plex Mono","IBM Plex Mono Fallback",monospace;
    font-size:17px;letter-spacing:0.14em;color:#3DDC97;text-transform:uppercase;
    border:1px solid rgba(61,220,151,0.25);background:rgba(61,220,151,0.06);
    border-radius:8px;padding:11px 20px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#3DDC97;box-shadow:0 0 10px rgba(61,220,151,0.9);}
  h1{
    margin:44px 0 0;font-size:72px;line-height:1.06;letter-spacing:-0.03em;
    font-weight:600;color:#E8EDF2;max-width:940px;
  }
  h1 .hl{background:linear-gradient(90deg,#3DDC97,#4CC3FA);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{margin:30px 0 0;max-width:820px;font-size:25px;line-height:1.55;color:#8B96A5;}
  .foot{
    margin-top:auto;display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(27,36,48,0.9);padding-top:26px;
    font-family:"IBM Plex Mono","IBM Plex Mono Fallback",monospace;
    font-size:18px;letter-spacing:0.08em;text-transform:uppercase;
  }
  .brand{display:flex;align-items:center;gap:13px;color:#E8EDF2;font-family:"IBM Plex Sans","IBM Plex Sans Fallback",sans-serif;font-size:26px;font-weight:600;letter-spacing:-0.01em;text-transform:none;}
  .mark{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#3DDC97,#4CC3FA);}
  .domain{color:#4CC3FA;}
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="rule"></div>
  <div class="inner">
    <div class="eyebrow"><span class="dot"></span>Evidence-led SEO growth system</div>
    <h1>Know what to fix.<br><span class="hl">Know what comes next.</span></h1>
    <p class="sub">Diagnosis, keywords, structure, links and authority in one sequence, where every recommendation carries the evidence behind it.</p>
    <div class="foot">
      <div class="brand"><span class="mark"></span>GenGrowth</div>
      <div class="domain">gengrowth.ai</div>
    </div>
  </div>
</div>
</body>
</html>
