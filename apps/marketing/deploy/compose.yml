# @input  -- image gengrowth-marketing:<sha> built by deploy.sh; the runtime and task-database env files outside the repo
# @output -- one container, gengrowth-marketing, on pick's drama network; port 3001 is not published
# @pos    -- gengrowth.ai's runtime on pick's Tencent VM; pick's Caddy reaches it by container name
# 一旦本文件被更新，务必更新开头注释及所属文件夹的 _DIR.md
#
# Run it through deploy.sh, which sets MARKETING_SHA. drama is the external
# network pick's server-setup.sh creates and its Caddy and cloudflared sit on.
# pick's state/networks.yml is regenerated by provision.sh, so nothing of ours
# goes there. Being on drama also puts pick's web, litellm and caddy within
# reach of this container.
name: gengrowth-marketing

services:
  marketing:
    image: gengrowth-marketing:${MARKETING_SHA:?run through deploy.sh}
    # The upstream name in gengrowth-marketing.caddy.
    container_name: gengrowth-marketing
    env_file:
      - ${MARKETING_ENV_FILE:-/srv/gengrowth-marketing/marketing.env}
      # Only TASKS_DATABASE_URL. It is its own file so the migration container
      # deploy.sh starts reads this and never the rest of marketing.env.
      - ${TASKS_ENV_FILE:-/srv/gengrowth-marketing/tasks-db.env}
    restart: unless-stopped
    mem_limit: 2g
    networks: [drama]

networks:
  drama:
    external: true
