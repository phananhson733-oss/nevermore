          description: Canonical Growth Map Topic workspace after the edit.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicModelWorkspaceHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/topic-model/draft/confirm:
    post:
      tags: [Diagnosis]
      summary: Confirm the exact Growth Map Topic draft
      description: |
        Confirms one coherent, rooted Topic Map at the exact model and edit revisions. The
        resulting content hash, confirmation actor and timestamp are server-owned. The previous
        confirmed model remains immutable and historical Keyword evidence is not re-attributed.
      operationId: confirmProjectAuditTopicModelDraft
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmTopicModelRequest' }
      responses:
