openapi: 3.1.0
info:
  title: SignalFrame Service Delivery MVP API
  version: 0.3.0
  summary: Same-origin internal API for the ICP-to-enterprise-export MVP.
  description: |
    Implementation contract for SignalFrame MVP 0.3. All authenticated operators have
    full product access inside one internal workspace. Project scoping, evidence lineage,
    unavailable-not-zero semantics, optimistic revisions, and asynchronous status URLs
    are mandatory. This is an internal contract, not a public API commitment.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/mvp
    description: Same-origin web application API
security:
  - supabaseSessionCookie: []
tags:
  - name: Projects
    description: Client projects, sites, context versions, and screen projections.
  - name: Sources
    description: Source authorization, import, collection, and immutable snapshots.
  - name: Runs
    description: Unified asynchronous job lifecycle and polling.
  - name: Diagnosis
    description: Frozen diagnostic runs, evidence, findings, and human review.
  - name: Actions
    description: Deterministic action templates and the 30/60/90 plan.
  - name: Artifacts
    description: Generated and manually revised execution deliverables.
  - name: Reports
    description: Canonical browser-facing client report projection.
  - name: Exports
    description: Versioned enterprise and client JSON ZIP bundles.

paths:
  /projects:
    get:
      tags: [Projects]
      summary: List client projects in the internal workspace
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Project page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Projects]
      summary: Create a client project, primary site, and default crawl source
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Project created.
          headers:
            Location:
              required: true
              schema: { type: string, pattern: '^/p/[0-9a-f-]+/overview$' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Read the current project aggregate
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Current project aggregate.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/context:
    get:
      tags: [Projects]
      summary: Read the current immutable ICP profile version, or null before the first save
      operationId: getProjectContext
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Current ICP profile or null for a new project.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentIcpProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Save an immutable draft or complete ICP profile version
      operationId: updateProjectContext
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DraftContextRequest'
                - $ref: '#/components/schemas/CompleteContextRequest'
              discriminator:
                propertyName: mode
                mapping:
                  draft: '#/components/schemas/DraftContextRequest'
                  complete: '#/components/schemas/CompleteContextRequest'
      responses:
        '200':
          description: Current profile; semantic no-op may return the existing version.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IcpProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/product-profile:
    get:
      tags: [Projects]
      summary: Read the current, confirmed, and actively synthesizing Product Profile versions
      operationId: getProjectProductProfile
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Product Profile review workspace backed by append-only profile versions.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductProfileWorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Append a customer-edited Product Profile draft version
      operationId: updateProductProfileDraft
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductProfileDraftRequest' }
      responses:
        '200':
          description: Current Product Profile version; a semantic no-op may return the existing row.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductProfileRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/product-profile/synthesis-runs:
    post:
      tags: [Projects, Runs]
      summary: Queue Product Profile synthesis from a frozen Site snapshot manifest
      operationId: createProductProfileSynthesisRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductProfileSynthesisRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/product-profile/competitors/{candidateId}:
    patch:
      tags: [Projects]
      summary: Review or correct one Product Profile competitor candidate
      operationId: reviewProductProfileCompetitor
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ProductProfileCandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewProductProfileCompetitorRequest' }
      responses:
        '200':
          description: Current Product Profile version after the reviewed candidate is appended.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductProfileRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/product-profile/competitors:
    post:
      tags: [Projects]
      summary: Add one customer-declared competitor to the Product Profile
      operationId: addProductProfileCompetitor
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddProductProfileCompetitorRequest' }
      responses:
        '200':
          description: Current Product Profile version with the server-identified approved competitor.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductProfileRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/product-profile/confirm:
    post:
      tags: [Projects]
      summary: Confirm one reviewed Product Profile version without starting an Audit
      operationId: confirmProductProfile
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmProductProfileRequest' }
      responses:
        '200':
          description: Confirmed Product Profile row. No diagnostic or Audit run is created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmedProductProfileRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/workspace:
    get:
      tags: [Projects]
      summary: Read a screen-oriented projection backed by canonical repositories
      operationId: getProjectWorkspaceView
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [overview, plan, studio, report]
        - name: outputLocale
          in: query
          schema: { $ref: '#/components/schemas/LocaleCode' }
      responses:
        '200':
          description: Requested projection. The data.view discriminator identifies its shape.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceViewResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/sources:
    get:
      tags: [Sources]
      summary: List source cards, capabilities, and latest snapshots
      operationId: listProjectSources
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: All five MVP source capabilities, including disabled or absent sources.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/sources/{provider}/connect:
    post:
      tags: [Sources]
      summary: Begin Google authorization, read candidate properties, or select one property
      operationId: connectProjectSource
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/GoogleProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizeSourceRequest'
                - $ref: '#/components/schemas/GetPropertySelectionRequest'
                - $ref: '#/components/schemas/SelectPropertyRequest'
              discriminator:
                propertyName: phase
                mapping:
                  authorize: '#/components/schemas/AuthorizeSourceRequest'
                  property_selection: '#/components/schemas/GetPropertySelectionRequest'
                  select_property: '#/components/schemas/SelectPropertyRequest'
      responses:
        '200':
          description: Authorization URL or connected source; response is discriminated by phase.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectSourceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /oauth/google/callback:
    get:
      tags: [Sources]
      summary: Consume one Google OAuth callback and return to the project Sources screen
      operationId: handleGoogleOAuthCallback
      parameters:
        - name: code
          in: query
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          schema: { type: string, minLength: 20 }
        - name: error
          in: query
          schema: { type: string }
        - name: error_description
          in: query
          schema: { type: string }
      responses:
        '303':
          description: Redirect to the project Sources page with oauthIntentId or a stable error code.
          headers:
            Location:
              required: true
              schema: { type: string, pattern: '^/p/[0-9a-f-]+/sources' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/sources/{provider}/import:
    post:
      tags: [Sources]
      summary: Preview or confirm a keyword-gap CSV import
      description: |
        multipart/form-data with mode=preview returns 200 and does not write canonical observations.
        application/json with mode=confirm returns 202 and a statusUrl.
      operationId: importProjectSourceFile
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsvProvider'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImportPreviewRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/ImportConfirmRequest' }
      responses:
        '200':
          description: Safe preview only; no canonical observations were written.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreviewResponse' }
        '202':
          $ref: '#/components/responses/AsyncAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/sources/{sourceConnectionId}:
    delete:
      tags: [Sources]
      summary: Disconnect a source and remove its credential while preserving snapshots
      operationId: disconnectProjectSource
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SourceConnectionId'
      responses:
        '204':
          description: Source disconnected. Historical snapshots remain.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/collection-runs:
    post:
      tags: [Runs, Sources]
      summary: Queue one provider collection
      operationId: createCollectionRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCollectionRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/snapshots:
    get:
      tags: [Sources]
      summary: List immutable data snapshots
      operationId: listProjectSnapshots
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: provider
          in: query
          schema: { $ref: '#/components/schemas/Provider' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Snapshot page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/runs/{runId}:
    get:
      tags: [Runs]
      summary: Poll any collection, Product Profile synthesis, diagnostic, artifact, or export run
      operationId: getProjectRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current run projection.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 10 }
              description: Present for queued or running responses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncRunResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/diagnostic-runs:
    post:
      tags: [Runs, Diagnosis]
      summary: Queue a frozen-input diagnostic run
      operationId: createDiagnosticRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDiagnosticRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/audit-runs:
    post:
      tags: [Runs, Diagnosis]
      summary: Queue a versioned full Growth Audit over frozen URL/ICP/snapshot inputs
      operationId: createGrowthAuditRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGrowthAuditRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/actions/{actionId}/recheck:
    post:
      tags: [Runs, Diagnosis]
      summary: Recheck one confirmed Action's technical condition with fresh data
      description: |
        Queues a targeted recheck of one confirmed Action. The recheck re-runs the frozen
        diagnostic pipeline over the latest eligible crawl snapshot and creates a brand-new
        immutable audit run under an isolated recheck projection version. The prior run is
        never mutated and no performance checkpoint is written.
      operationId: createActionRecheck
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActionRecheckRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/urls:
    get:
      tags: [Diagnosis]
      summary: List the latest readable Growth Map URL portfolio
      description: |
        Returns one bounded page of canonical Site Pages proven by the latest completed or
        partial DiagnosticRun's frozen Crawl/GSC/GA4 inputs. The response deliberately has no
        project-wide total. Missing observations remain unavailable with explicit limitations;
        unresolved or definition-only Finding targets are never assigned to URL rows.
      operationId: listProjectAuditUrls
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: search
          in: query
          description: Trimmed, non-empty literal substring matched against canonical URL. Repeated scalar query parameters are rejected.
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: '\S'
      responses:
        '200':
          description: Current traceable URL portfolio page without a synthetic total.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapUrlPortfolioHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/urls/{sitePageId}:
    get:
      tags: [Diagnosis]
      summary: Read one URL from the latest readable Growth Map portfolio
      description: |
        Resolves the selected canonical Site Page only inside the latest completed or partial
        DiagnosticRun. Finding membership comes exclusively from resolved FindingTarget rows
        for that exact run; mutable subject_refs are never used as URL membership.
      operationId: getProjectAuditUrl
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SitePageId'
      responses:
        '200':
          description: Selected URL projection with exact source, Finding, Action, and Artifact identifiers.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapUrlDetailHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/keywords:
    get:
      tags: [Diagnosis]
      summary: List the project Keyword Library
      description: |
        Returns one bounded cursor page of stable Keyword identities with exact source
        occurrences, canonical Observation metric pointers, governed mapped targets, and
        explicit coverage and limitations. This read surface exposes no filters, synthetic
        totals, Finding confirmation, Action state, or mutation controls.
      operationId: listProjectAuditKeywords
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current traceable Keyword Library cursor page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapKeywordLibraryHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/keywords/{keywordId}:
    get:
      tags: [Diagnosis]
      summary: Read one project Keyword Library entry
      description: |
        Resolves one stable Keyword identity inside the selected project and returns the same
        strict source, metric, mapping, coverage, and limitation contract as the cursor page.
      operationId: getProjectAuditKeyword
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/KeywordId'
      responses:
        '200':
          description: Selected traceable Keyword Library entry.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapKeywordDetailHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/competitors:
    get:
      tags: [Diagnosis]
      summary: List the project Competitor Library
      description: |
        Returns one bounded cursor page of stable project Competitor identities with strict
        typed origin occurrences, reviewed analysis scope, canonical Observation-backed
        insights, and explicit coverage. This slice exposes no filters, synthetic totals,
        manual-entry controls, review controls, or mutation methods.
      operationId: listProjectAuditCompetitors
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current traceable Competitor Library cursor page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapCompetitorLibraryHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/competitors/{competitorId}:
    get:
      tags: [Diagnosis]
      summary: Read one project Competitor Library entry
      description: |
        Resolves one stable Competitor identity inside the selected project and returns the
        same strict origin, insight, review, coverage, and limitation contract as the page.
      operationId: getProjectAuditCompetitor
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CompetitorId'
      responses:
        '200':
          description: Selected traceable Competitor Library entry.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapCompetitorDetailHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/findings:
    get:
      tags: [Diagnosis]
      summary: List findings with evidence summaries
      operationId: listProjectFindings
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: domain
          in: query
          schema: { $ref: '#/components/schemas/DiagnosticDomain' }
        - name: reviewState
          in: query
          schema: { $ref: '#/components/schemas/FindingReviewState' }
        - name: active
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Finding page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/findings/{findingId}:
    patch:
      tags: [Diagnosis, Actions]
      summary: Confirm, ignore, or request more data for a finding
      operationId: reviewProjectFinding
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewFindingRequest' }
      responses:
        '200':
          description: Updated finding and the idempotently created/merged action when confirmed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewFindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/actions:
    get:
      tags: [Actions]
      summary: List the 30/60/90 action plan
      operationId: listProjectActions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: lane
          in: query
          schema: { $ref: '#/components/schemas/RoadmapLane' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ActionStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Action page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/actions/{actionId}:
    patch:
      tags: [Actions]
      summary: Update action status or override priority/lane with an audit reason
      operationId: updateProjectAction
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActionRequest' }
      responses:
        '200':
          description: Updated action.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/artifacts:
    get:
      tags: [Artifacts]
      summary: List execution artifacts and current revision metadata
      operationId: listProjectArtifacts
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ArtifactType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ArtifactStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Artifact page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/actions/{actionId}/artifacts:
    post:
      tags: [Actions, Artifacts, Runs]
      summary: Queue creation or regeneration of an execution artifact
      operationId: createActionArtifact
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateArtifactRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/artifacts/{artifactId}:
    get:
      tags: [Artifacts]
      summary: Read an artifact and its current or requested revision
      operationId: getProjectArtifact
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ArtifactId'
        - name: revision
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Artifact with revision content.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Artifacts]
      summary: Create an immutable manual revision or change validated status
      operationId: updateProjectArtifact
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ArtifactId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateArtifactRequest' }
      responses:
        '200':
          description: Updated artifact and current revision.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/report:
    get:
      tags: [Reports]
      summary: Read the canonical client-facing report projection
      operationId: getProjectReport
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: outputLocale
          in: query
          schema: { $ref: '#/components/schemas/LocaleCode' }
      responses:
        '200':
          description: Client report projection.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/exports:
    post:
      tags: [Exports, Runs]
      summary: Queue a versioned service or client JSON ZIP bundle
      operationId: createProjectExport
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExportRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/exports/{exportId}:
    get:
      tags: [Exports]
      summary: Read export metadata and a short-lived signed download URL
      operationId: getProjectExport
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Export projection; downloadUrl is null until completed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/audit:
    get:
      tags: [Diagnosis]
      summary: Read the latest Growth Audit projection
      description: |
        Returns the latest Growth Audit for the project as a strictly read-only projection.
        Status is projected from the canonical async run; every response carries all eight
        customer-facing audit modules and all three frontstage lenses, including modules and
        lenses whose honest state is no_data. This surface writes nothing.
      operationId: getProjectGrowthAudit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The latest complete Growth Audit projection.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthAuditHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/modules/{moduleId}:
    get:
      tags: [Diagnosis]
      summary: Read one Growth Audit module summary
      description: |
        Resolves one audit module's read-only coverage summary from the latest Growth Audit.
        Empty modules report no_data with an explicit limitation, never a zero score.
      operationId: getProjectAuditModule
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuditModuleId'
      responses:
        '200':
          description: Selected audit module coverage summary.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditModuleHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/opportunities:
    get:
      tags: [Diagnosis]
      summary: List traceable Growth Opportunities
      description: |
        Returns one bounded cursor page of traceable Growth Opportunities projected from the
        latest readable diagnostic run. Read-only: confirmation flows through the existing
        Finding review mutation, never a confirm endpoint here.
      operationId: listProjectOpportunities
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current traceable Growth Opportunity cursor page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOpportunityListHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/opportunities/{opportunityId}:
    get:
      tags: [Diagnosis]
      summary: Read one traceable Growth Opportunity
      description: |
        Resolves one Growth Opportunity keyed by its primary Finding id inside the latest
        readable diagnostic run. Read-only.
      operationId: getProjectOpportunity
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/OpportunityId'
      responses:
        '200':
          description: Selected traceable Growth Opportunity projection.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOpportunityDetailHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/results:
    get:
      tags: [Diagnosis]
      summary: Read the latest recheck comparison of two immutable runs
      description: |
        Returns the latest recheck's read-only comparison for one confirmed Action. It
        compares the prior and current immutable runs strictly on the technical rule
        condition and reports one of three technical states (verified, observed,
        insufficient_data). It never claims traffic, rank, revenue, or AI-citation movement.
      operationId: getProjectResults
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The latest recheck comparison of the prior and current run.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRecheckResultsHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

components:
  securitySchemes:
    supabaseSessionCookie:
      type: apiKey
      in: cookie
      name: sb-auth-token
      description: Logical same-origin Supabase SSR session cookie; deployed cookie name may include the project reference.

  headers:
    RequestId:
      description: Stable request correlation identifier.
      schema: { type: string, minLength: 8, maxLength: 128 }

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SitePageId:
      name: sitePageId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    KeywordId:
      name: keywordId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CompetitorId:
      name: competitorId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AuditModuleId:
      name: moduleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AuditModuleId' }
    OpportunityId:
      name: opportunityId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProductProfileCandidateId:
      name: candidateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SourceConnectionId:
      name: sourceConnectionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    FindingId:
      name: findingId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ActionId:
      name: actionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    GoogleProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [gsc, ga4]
    CsvProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        const: csv
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque base64url cursor returned by the previous page.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[ -~]+$'
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required when mode=confirm; ignored for preview.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[ -~]+$'

  responses:
    AsyncAccepted:
      description: Canonical run and job were atomically accepted.
      headers:
        Location:
          required: true
          schema: { type: string, pattern: '^/api/mvp/projects/[0-9a-f-]+/runs/[0-9a-f-]+$' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          schema: { type: integer, minimum: 1, maximum: 10, default: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AsyncAcceptedResponse' }
    BadRequest:
      description: Malformed request.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Missing or invalid session.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource absent or outside the current workspace/project.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Optimistic version, idempotency, or active-run conflict.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Semantically invalid input or unmet domain precondition.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DependencyUnavailable:
      description: Required upstream provider is temporarily unavailable.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Upload exceeds the 20 MB or 200,000-row import budget.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Application or upstream request rate limit reached.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Uuid:
      type: string
      format: uuid
