    PropertySelectionPhase:
      type: object
      additionalProperties: false
      required: [phase, oauthIntentId, provider, properties, expiresAt]
      properties:
        phase: { const: property_selection }
        oauthIntentId: { $ref: '#/components/schemas/Uuid' }
        provider: { type: string, enum: [gsc, ga4] }
        properties:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, displayName]
            properties:
              id: { type: string }
              displayName: { type: string }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    ConnectedPhase:
      type: object
      additionalProperties: false
      required: [phase, source]
      properties:
