        data:
          oneOf:
            - $ref: '#/components/schemas/IcpProfile'
            - type: 'null'

    SourceConnection:
      type: object
      additionalProperties: false
      required: [id, projectId, provider, connectionType, state, externalRef, scopes, connectedAt, latestSnapshot, latestMetricSummary, activeRun, limitation, featureEnabled, updatedAt]
      properties:
        id: { type: [string, 'null'], format: uuid }
        projectId: { $ref: '#/components/schemas/Uuid' }
        provider: { $ref: '#/components/schemas/Provider' }
        connectionType: { type: string, enum: [public, oauth, file_import, api_key_stub] }
        state: { $ref: '#/components/schemas/SourceState' }
        externalRef: { type: [string, 'null'] }
        scopes: { type: array, items: { type: string } }
        connectedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        latestSnapshot:
          oneOf:
            - $ref: '#/components/schemas/DataSnapshot'
            - type: 'null'
        latestMetricSummary:
          description: Normalized business metrics for the exact latest snapshot. Null means no usable GSC/GA4 observations, never a measured zero.
          oneOf:
            - $ref: '#/components/schemas/GscSourceMetricSummary'
            - $ref: '#/components/schemas/Ga4SourceMetricSummary'
            - type: 'null'
        activeRun:
          oneOf:
            - $ref: '#/components/schemas/AsyncRun'
