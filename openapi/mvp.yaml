      additionalProperties: false
      required: [event, replayed]
      properties:
        event: { $ref: '#/components/schemas/ActionExecutionStateEvent' }
        replayed: { type: boolean }

    ActionExecutionBlocker:
      type: object
      additionalProperties: false
      required: [code, summary, unlockCondition, ownerId, sourceKind, sourceRef, observedAt, freshness]
