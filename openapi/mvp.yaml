      required: [actionId, artifactId, current, history]
      properties:
        actionId: { $ref: '#/components/schemas/Uuid' }
        artifactId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        current:
          oneOf:
            - $ref: '#/components/schemas/ActionExecutionStateEvent'
            - type: 'null'
        history:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/ActionExecutionStateEvent' }
      x-signalframe-runtime-refinement: completeAscendingHistoryWithCurrentLatest

    ActionExecutionStateTimelineHttpResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ActionExecutionStateTimeline' }

    ActionExecutionStateBatchItem:
      type: object
      additionalProperties: false
      description: Exact current execution fact for one Artifact queue card.
      required: [actionId, artifactId, current]
      properties:
        actionId: { $ref: '#/components/schemas/Uuid' }
        artifactId: { $ref: '#/components/schemas/Uuid' }
        current:
          oneOf:
            - $ref: '#/components/schemas/ActionExecutionStateEvent'
