            currentUrl: { type: [string, 'null'] }
            currentRank: { type: [string, 'null'] }
            competitorDomain: { type: [string, 'null'] }
            competitorRank: { type: [string, 'null'] }
            marketCode: { type: string }
            languageCode: { type: string }
    ImportPreviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [importToken, expiresAt, rowCount, previewRows, detectedColumns, suggestedMapping, errors, warnings]
          properties:
            importToken: { type: string, minLength: 32 }
            expiresAt: { $ref: '#/components/schemas/Timestamp' }
