      type: object
      additionalProperties: false
      maxProperties: 0
      description: Empty strict object. The server owns and freezes the complete Analysis Refresh plan.

    AsyncRun:
      type: object
      additionalProperties: false
      required: [id, projectId, kind, status, progress, lastError, resultRef, queuedAt, startedAt, completedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/RunKind' }
        status: { $ref: '#/components/schemas/RunStatus' }
