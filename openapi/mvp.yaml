  /projects/{projectId}/audit:
    get:
      tags: [Diagnosis]
      summary: Read the latest Growth Audit projection
      description: |
        Returns the latest Growth Audit for the project as a strictly read-only projection.
        Status is projected from the canonical async run; every response carries all eight
        customer-facing audit modules and all three frontstage lenses, including modules and
        lenses whose honest state is no_data. This surface writes nothing.
      operationId: getProjectGrowthAudit
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The latest complete Growth Audit projection.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthAuditHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/modules/{moduleId}:
    get:
      tags: [Diagnosis]
      summary: Read one Growth Audit module summary
      description: |
        Resolves one audit module's read-only coverage summary from the latest Growth Audit.
        Empty modules report no_data with an explicit limitation, never a zero score.
      operationId: getProjectAuditModule
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuditModuleId'
      responses:
        '200':
          description: Selected audit module coverage summary.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditModuleHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/opportunities:
    get:
      tags: [Diagnosis]
      summary: List traceable Growth Opportunities
      description: |
        Returns one bounded cursor page of traceable Growth Opportunities projected from the
        latest readable diagnostic run. Read-only: confirmation flows through the existing
        Finding review mutation, never a confirm endpoint here.
      operationId: listProjectOpportunities
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current traceable Growth Opportunity cursor page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOpportunityListHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/opportunities/{opportunityId}:
    get:
      tags: [Diagnosis]
      summary: Read one traceable Growth Opportunity
      description: |
        Resolves one Growth Opportunity keyed by its primary Finding id inside the latest
        readable diagnostic run. Read-only.
      operationId: getProjectOpportunity
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/OpportunityId'
      responses:
        '200':
          description: Selected traceable Growth Opportunity projection.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOpportunityDetailHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/results:
    get:
      tags: [Diagnosis]
      summary: Read the latest recheck comparison of two immutable runs
      description: |
        Returns the latest recheck's read-only comparison for one confirmed Action. It
        compares the prior and current immutable runs strictly on the technical rule
        condition and reports one of three technical states (verified, observed,
        insufficient_data). It never claims traffic, rank, revenue, or AI-citation movement.
      operationId: getProjectResults
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The latest recheck comparison of the prior and current run.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRecheckResultsHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/publications/previews:
    post:
      tags: [Publications]
      summary: Issue a short-lived preview for one approved publication
      description: |
        Re-reads the current ready destination, exact approved Artifact Revision, Action
        target and live provider state, then mints one append-only preview. The client only
        selects the destination revision and approval event; provider plans, checksums,
        readiness observations, actor identity and remote facts remain server-owned.
        The body idempotencyKey must exactly match the Idempotency-Key header.
      operationId: issuePublicationPreview
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssuePublicationPreviewRequest' }
      responses:
        '201':
          description: Exact customer-safe publication preview lineage issued.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuePublicationPreviewHttpResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/publications/previews/rollback:
    post:
      tags: [Publications]
      summary: Issue a short-lived rollback preview from verified publication lineage
      description: |
        Re-reads the exact source publication attempt, verified-live Change Receipt,
        historical Artifact approval, current ready destination and live provider revision.
        The client cannot supply a rollback plan, remote precondition, provider facts,
        checksum or readiness authority. The body idempotencyKey must exactly match the
        Idempotency-Key header.
      operationId: issuePublicationRollbackPreview
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssuePublicationRollbackPreviewRequest' }
      responses:
        '201':
          description: Exact customer-safe rollback preview lineage issued.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuePublicationRollbackPreviewHttpResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/publications/previews/{previewEventId}/{previewRef}/revoke:
    post:
      tags: [Publications]
      summary: Revoke one exact current publication preview
      description: |
        Appends a terminal authority-reducing event for the exact preview event and opaque
        preview reference in the route. The strict body contains only the customer's reason
        and idempotency key, which must exactly match the Idempotency-Key header.
      operationId: revokePublicationPreview
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PublicationPreviewEventId'
        - $ref: '#/components/parameters/PublicationPreviewRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokePublicationPreviewRequest' }
      responses:
        '200':
          description: Terminal revocation event appended or idempotently replayed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokePublicationPreviewHttpResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/measurement-windows/recent:
    get:
      tags: [Reports]
      summary: Read the project's latest immutable Measurement Windows
      description: |
        Returns complete Measurement Windows across every URL target in the project, ordered
        by recordedAt and measurement identity descending. This is the project-level evidence
        feed used by the existing Results module. It does not accept a target filter, collapse
        multiple URLs into one synthetic total, or add a server-fabricated lift field.
      operationId: getProjectRecentMeasurementWindows
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Complete immutable Measurement Windows from across the project, newest first.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementWindowRecentHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/measurement-windows/{measurementWindowId}/keyword-ranks:
    get:
      tags: [Reports]
      summary: Compare one URL's confirmed target Keyword absolute ranks
      description: |
        Returns the latest real DataForSEO absolute-rank observation inside each immutable
        before/after Measurement Window for the exact measured URL. The target set comes only
        from the latest confirmed Topic Map and current approved Keyword governance mapped to
        that page. GSC average position is never substituted for absolute rank. Missing
        observations remain nullable with explicit coverage limitations, and the comparison
        is observational rather than causal. This is part of the existing Results module,
        not a fifth workspace module.
      operationId: getProjectMeasurementTargetKeywordRanks
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MeasurementWindowId'
      responses:
        '200':
          description: Governed target Keyword rank evidence for the exact Measurement Window.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementTargetKeywordRanksHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/measurement-windows/{measurementWindowId}/geo-citations:
    get:
      tags: [Reports]
      summary: Trace one URL's immutable GEO / AI citation evidence
      description: |
        Returns only the GEO query and direct-citation observations already frozen into the
        exact Measurement Window. The server owns the canonical URL, before/after windows,
        source lineage, market, and language; callers cannot substitute filters or dates.
        Missing observations remain unavailable rather than becoming zero. Bounded excerpts,
        content hashes, and paragraph selectors support reverse lookup without storing a whole
        third-party answer. Structural comparisons remain evidence-bounded observations or
        explicitly limited inferences and never claim why a citation occurred or that one
        publication caused it. This is evidence inside the existing Results module, not a
        fifth workspace module.
      operationId: getProjectMeasurementGeoCitations
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MeasurementWindowId'
      responses:
        '200':
          description: Immutable GEO citation evidence for the exact Measurement Window.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoCitationEvidenceHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/measurement-windows:
    post:
      tags: [Reports, Runs]
      summary: Start an immutable before/after Measurement Window
      description: |
        Starts one delayed observational measurement run from the exact verified publication
        Change Receipt named by the customer. The Change Receipt is the only outcome-clock
        authority: the service re-resolves the canonical URL target, Site Page, artifact
        revision, publication lineage, UTC-symmetrical 28-day before/after intervals, provider
        sources and execution schedule. A Delivery Receipt never starts this clock. The browser
        cannot author target, time-window, provider, metric, result, revision or timestamp facts.
        The body idempotency key must exactly match the Idempotency-Key header; an exact replay
        returns the same pending Measurement Window and async run.
      operationId: createProjectMeasurementWindow
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMeasurementWindowRequest' }
      x-signalframe-runtime-refinement: exactVerifiedChangeReceiptAndMatchingIdempotencyKey
      responses:
        '202':
          description: The server-frozen Measurement Window and delayed run were accepted or exactly replayed.
          headers:
            Location:
              required: true
              schema: { type: string, pattern: '^/api/mvp/projects/[0-9a-f-]+/runs/[0-9a-f-]+$' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 10, default: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementWindowAcceptedHttpResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    get:
      tags: [Reports]
      summary: Read immutable before/after Measurement Window history for one URL
      description: |
        Returns finalized Measurement Windows for one exact canonical Site Page target,
        newest first. Every window preserves absolute before/after intervals, GSC, GA4 and
        GEO observations, UTM campaign identity, source Snapshot lineage, and the verified
        publication Change Receipt that starts the outcome clock. Missing provider data is
        represented as nullable unavailable/insufficient data with an explicit limitation;
        this observational history never claims causal lift.
      operationId: getProjectMeasurementWindowHistory
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: sitePageId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: targetRef
          in: query
          required: true
          description: Must be the exact canonical target identity site-page://{sitePageId}.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      x-signalframe-runtime-refinement: exactSitePageTargetQuery
      responses:
        '200':
          description: Immutable observational Measurement Window history for the exact target.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementWindowHistoryHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

components:
  securitySchemes:
    supabaseSessionCookie:
      type: apiKey
      in: cookie
      name: sb-auth-token
      description: Logical same-origin Supabase SSR session cookie; deployed cookie name may include the project reference.

  headers:
    RequestId:
      description: Stable request correlation identifier.
      schema: { type: string, minLength: 8, maxLength: 128 }

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SitePageId:
      name: sitePageId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    KeywordId:
      name: keywordId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    KeywordRelationId:
      name: relationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CompetitorId:
      name: competitorId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AuditModuleId:
      name: moduleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AuditModuleId' }
    OpportunityId:
      name: opportunityId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PublicationPreviewEventId:
      name: previewEventId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PublicationPreviewRef:
      name: previewRef
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicationPreviewRef' }
    ProductProfileCandidateId:
      name: candidateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SourceConnectionId:
      name: sourceConnectionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    FindingId:
      name: findingId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ActionId:
      name: actionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MeasurementWindowId:
      name: measurementWindowId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    FlowShadowRunId:
      name: flowShadowRunId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    GoogleProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [gsc, ga4]
    CsvProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        const: csv
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque base64url cursor returned by the previous page.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    DiagnosticRunIdPin:
      name: diagnosticRunId
      in: query
      required: false
      description: |
        Optional canonical lowercase UUID for one exact readable, same-project
        published DiagnosticRun generation. When omitted, the server selects the
        latest readable published generation. Repeated values are rejected.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ReviewView:
      name: view
      in: query
      required: false
      description: |
        Exact view=review selects the current mutable governance projection.
        It is available only on Keyword and Competitor detail GET operations,
        is mutually exclusive with diagnosticRunId, and rejects repeated values.
      schema:
        type: string
        const: review
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[ -~]+$'
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required when mode=confirm; ignored for preview.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[ -~]+$'

  responses:
    AsyncAccepted:
      description: Canonical run and job were atomically accepted.
      headers:
        Location:
          required: true
          schema: { type: string, pattern: '^/api/mvp/projects/[0-9a-f-]+/runs/[0-9a-f-]+$' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          schema: { type: integer, minimum: 1, maximum: 10, default: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AsyncAcceptedResponse' }
    BadRequest:
      description: Malformed request.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Missing or invalid session.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource absent or outside the current workspace/project.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Optimistic version, idempotency, or active-run conflict.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Semantically invalid input or unmet domain precondition.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DependencyUnavailable:
      description: Required upstream provider is temporarily unavailable.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Upload exceeds the 20 MB or 200,000-row import budget.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Application or upstream request rate limit reached.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    LocaleCode:
      type: string
      minLength: 2
      maxLength: 255
