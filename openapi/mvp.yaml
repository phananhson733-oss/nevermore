      discriminator:
        propertyName: kind
        mapping:
          snapshot: '#/components/schemas/ProductProfileSnapshotEvidenceRef'
          pageSnapshot: '#/components/schemas/ProductProfilePageSnapshotEvidenceRef'
          observation: '#/components/schemas/ProductProfileObservationEvidenceRef'
