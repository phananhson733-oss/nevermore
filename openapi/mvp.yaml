      oneOf:
        - $ref: '#/components/schemas/ApprovedArtifactApprovalEvent'
        - $ref: '#/components/schemas/TerminalArtifactApprovalEvent'
      discriminator:
        propertyName: eventKind
        mapping:
          approved: '#/components/schemas/ApprovedArtifactApprovalEvent'
          revoked: '#/components/schemas/TerminalArtifactApprovalEvent'
          superseded: '#/components/schemas/TerminalArtifactApprovalEvent'

    ArtifactApprovalEventHttpResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ArtifactApprovalEvent' }

    UpdateArtifactRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [baseRevision, contentFormat, content]
          properties:
            baseRevision: { type: integer, minimum: 0 }
            contentFormat: { $ref: '#/components/schemas/ContentFormat' }
            content:
              description: String content and the compact serialized JSON object are limited to 40000 characters.
              x-signalframe-max-serialized-chars: 40000
              oneOf:
                - type: string
                  maxLength: 40000
                - type: object
                  additionalProperties: true
            editorNote: { type: [string, 'null'], maxLength: 4000 }
        - type: object
          additionalProperties: false
          required: [baseRevision, status]
          properties:
            baseRevision: { type: integer, minimum: 0 }
            status: { type: string, enum: [draft, ready, archived] }

    CreateExportRequest:
      type: object
      additionalProperties: false
      required: [kind, outputLocale]
      properties:
        kind: { type: string, enum: [service_bundle, client_bundle] }
        outputLocale: { $ref: '#/components/schemas/LocaleCode' }
    ExportBundle:
      type: object
      additionalProperties: false
      required: [id, kind, schemaVersion, outputLocale, run, checksum, itemCounts, downloadUrl, downloadExpiresAt, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [service_bundle, client_bundle] }
        schemaVersion:
          type: string
          enum:
            - signalframe.service-bundle.0.2.0
            - signalframe.service-bundle.0.3.0
          description: Read DTO supports immutable historical 0.2 bundles; all newly generated manifests use 0.3.0.
        outputLocale: { $ref: '#/components/schemas/LocaleCode' }
        run: { $ref: '#/components/schemas/AsyncRun' }
        checksum: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        itemCounts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        downloadUrl: { type: [string, 'null'], format: uri }
        downloadExpiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    ExportResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ExportBundle' }

    Coverage:
      type: object
      additionalProperties: false
      required: [overall, domains, limitations]
      properties:
        overall: { type: string, enum: [unavailable, partial, complete] }
        domains:
          type: object
          additionalProperties:
            type: string
            enum: [unavailable, qualitative, partial, complete]
        limitations: { type: array, items: { type: string } }
    Report:
      type: object
      additionalProperties: false
      required: [project, outputLocale, generatedAt, coverage, findings, actions, artifacts, methodology, limitations]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        outputLocale: { $ref: '#/components/schemas/LocaleCode' }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
        coverage: { $ref: '#/components/schemas/Coverage' }
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        actions: { type: array, items: { $ref: '#/components/schemas/Action' } }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        methodology: { type: string }
        limitations: { type: array, items: { type: string } }
    ReportResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Report' }

    OverviewContentDecayRankTrend:
      type: object
      additionalProperties: false
      required: [olderMonth, previousMonth, currentMonth, olderPosition, previousPosition, currentPosition, firstDecline, secondDecline]
      properties:
        olderMonth:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        previousMonth:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        currentMonth:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        olderPosition: { type: number, exclusiveMinimum: 0 }
        previousPosition: { type: number, exclusiveMinimum: 0 }
        currentPosition: { type: number, exclusiveMinimum: 0 }
        firstDecline:
          type: number
          exclusiveMinimum: 5
          description: The first adjacent monthly average-position increase; a larger position is worse.
        secondDecline:
          type: number
          exclusiveMinimum: 5
          description: The second adjacent monthly average-position increase; a larger position is worse.
      description: >-
        Three consecutive canonical monthly checkpoints where each adjacent
        GSC average-position delta is strictly worse by more than five places.

    OverviewContentDecayTrafficTrend:
      type: object
      additionalProperties: false
      required: [previousMonth, currentMonth, previousClicks, currentClicks, changeRatio]
      properties:
        previousMonth:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        currentMonth:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        previousClicks: { type: integer, minimum: 1 }
        currentClicks: { type: integer, minimum: 0 }
        changeRatio:
          type: number
          exclusiveMaximum: -0.2
          description: Latest trailing-28-day clicks change, strictly below -20 percent.
      description: >-
        Two consecutive canonical monthly checkpoints whose trailing-28-day
        GSC clicks declined strictly more than twenty percent.

    OverviewContentDecayAlert:
      type: object
      additionalProperties: false
      required: [sitePageId, normalizedUrl, detectedAt, currentMonth, triggers, rankTrend, trafficTrend, sourceSnapshotIds]
      properties:
        sitePageId: { $ref: '#/components/schemas/Uuid' }
        normalizedUrl: { type: string, format: uri, maxLength: 2048 }
        detectedAt: { $ref: '#/components/schemas/Timestamp' }
        currentMonth:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        triggers:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [rank_decline, traffic_decline]
        rankTrend:
          oneOf:
            - $ref: '#/components/schemas/OverviewContentDecayRankTrend'
            - type: 'null'
        trafficTrend:
          oneOf:
            - $ref: '#/components/schemas/OverviewContentDecayTrafficTrend'
            - type: 'null'
        sourceSnapshotIds:
          type: array
          minItems: 2
          maxItems: 3
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
      description: >-
        Customer-readable advice to review one exact frozen Growth Map URL. It
        is a read-only projection and is not a Finding, Action, or claim that
        review work has been executed.

    OverviewContentDecayMonitor:
      type: object
      additionalProperties: false
      required: [version, projectionMode, scheduleState, status, timezone, timezoneSource, latestCheckpointMonth, limitations, alerts]
      properties:
        version: { const: content-decay-monitor.v1 }
        projectionMode: { const: read_time }
        scheduleState: { const: not_configured }
        status: { $ref: '#/components/schemas/Availability' }
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: Persisted provider or project IANA timezone; UTC only as an explicitly disclosed fallback.
        timezoneSource:
          type: string
          enum: [provider, project, fallback]
        latestCheckpointMonth:
          type: [string, 'null']
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        limitations:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        alerts:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/OverviewContentDecayAlert' }
      description: >-
        Read-only Overview projection over immutable GSC facts for the exact
        frozen Growth Map URL inventory. Each month contributes one canonical
        snapshot whose metric remains its trailing 28-day window, not a
        fabricated calendar-month sum. Missing, partial, or ambiguous facts
        never become zero. Monthly scheduling and push delivery are not
        connected, so this schema cannot claim automated execution.

    OverviewView:
      type: object
      additionalProperties: false
      required: [view, project, coverage, activeRuns, frozenDiagnosticRunId, topActions, decisionReminders, contentDecayMonitor, latestSnapshot, topActionEvidence, deliveryFocus]
      properties:
        view: { const: overview }
        project: { $ref: '#/components/schemas/Project' }
        coverage: { $ref: '#/components/schemas/Coverage' }
        activeRuns:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AsyncRun' }
        frozenDiagnosticRunId:
          description: Exact latest readable diagnostic run used to select the Overview work queue; null when no frozen audit exists.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        topActions: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Action' } }
        decisionReminders:
          type: array
          maxItems: 3
          description: >-
            Still-active Findings from the exact frozen audit that have had no
            Action or customer decision for at least fourteen complete days,
            ordered by longest wait, priority, then stable Finding identity.
          items: { $ref: '#/components/schemas/OverviewDecisionReminder' }
        contentDecayMonitor:
          $ref: '#/components/schemas/OverviewContentDecayMonitor'
        latestSnapshot:
          oneOf:
            - $ref: '#/components/schemas/DataSnapshot'
            - type: 'null'
        topActionEvidence:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }
        deliveryFocus:
          oneOf:
            - $ref: '#/components/schemas/OverviewDeliveryFocus'
            - type: 'null'
    OverviewDecisionReminder:
      type: object
      additionalProperties: false
      required: [findingId, sitePageId, summary, summaryLocale, severity, reviewState, firstSeenAt, lastSeenAt, staleForDays]
      properties:
        findingId: { $ref: '#/components/schemas/Uuid' }
        sitePageId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        summary: { type: string, minLength: 1 }
        summaryLocale: { type: string, minLength: 1 }
        severity: { $ref: '#/components/schemas/PriorityBand' }
        reviewState:
          type: string
          enum: [unreviewed, needs_more_data]
        firstSeenAt: { $ref: '#/components/schemas/Timestamp' }
        lastSeenAt: { $ref: '#/components/schemas/Timestamp' }
        staleForDays: { type: integer, minimum: 14 }
      description: >-
        Read-only decision reminder derived from persistent Finding/Action
        authorities. It is not a second opportunity record.
    OverviewDeliveryFocus:
      type: object
      additionalProperties: false
      required: [artifactId, actionId, artifactType, status, updatedAt]
      properties:
        artifactId: { $ref: '#/components/schemas/Uuid' }
        actionId: { $ref: '#/components/schemas/Uuid' }
        artifactType: { $ref: '#/components/schemas/ArtifactType' }
        status: { $ref: '#/components/schemas/ArtifactStatus' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    WorkspaceViewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/OverviewView'
          discriminator:
            propertyName: view
            mapping:
              overview: '#/components/schemas/OverviewView'
