        name: { type: string, minLength: 1, maxLength: 160 }
        domain: { $ref: '#/components/schemas/ProductProfileCompetitorDomain' }
        relationship: { $ref: '#/components/schemas/ProductProfileCompetitorRelationship' }
        analysisScope:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProductProfileCompetitorAnalysisScope' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ConfirmProductProfileRequest:
      type: object
      additionalProperties: false
      required: [baseVersion]
      properties:
        baseVersion: { type: integer, minimum: 1 }

    ProductProfileDraftRowDto:
      type: object
      additionalProperties: false
      required: [id, projectId, version, status, profile, contentHash, createdAt, isCurrent, isConfirmed]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        status: { const: draft }
        profile: { $ref: '#/components/schemas/ProductProfileDraft' }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        isCurrent: { type: boolean }
        isConfirmed: { const: false }
    ConfirmedProductProfileRowDto:
      type: object
      additionalProperties: false
      required: [id, projectId, version, status, profile, contentHash, createdAt, isCurrent, isConfirmed]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        status: { const: complete }
        profile: { $ref: '#/components/schemas/ConfirmedProductProfile' }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        isCurrent: { type: boolean }
        isConfirmed: { const: true }
    ProductProfileRowDto:
      oneOf:
        - $ref: '#/components/schemas/ProductProfileDraftRowDto'
        - $ref: '#/components/schemas/ConfirmedProductProfileRowDto'
      discriminator:
        propertyName: status
        mapping:
          draft: '#/components/schemas/ProductProfileDraftRowDto'
          complete: '#/components/schemas/ConfirmedProductProfileRowDto'
    ProductProfileRowResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProductProfileRowDto' }
    ConfirmedProductProfileRowResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ConfirmedProductProfileRowDto' }
    ProductProfileActiveSynthesisRun:
      allOf:
        - $ref: '#/components/schemas/AsyncRun'
        - type: object
          required: [kind, status, resultRef]
          properties:
            kind: { const: product_profile_synthesis }
            status: { type: string, enum: [queued, running] }
            resultRef: { type: 'null' }
    ProductProfileWorkspace:
      type: object
      additionalProperties: false
      required: [projectId, currentProfile, confirmedProfile, activeSynthesisRun]
      properties:
        projectId: { $ref: '#/components/schemas/Uuid' }
        currentProfile:
          oneOf:
            - $ref: '#/components/schemas/ProductProfileRowDto'
            - type: 'null'
        confirmedProfile:
          oneOf:
            - $ref: '#/components/schemas/ConfirmedProductProfileRowDto'
            - type: 'null'
        activeSynthesisRun:
          oneOf:
            - $ref: '#/components/schemas/ProductProfileActiveSynthesisRun'
            - type: 'null'
    ProductProfileWorkspaceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProductProfileWorkspace' }

    Project:
      type: object
      additionalProperties: false
      required: [id, clientName, projectName, stage, site, contextStatus, defaultDeliveryLocale, createdAt, updatedAt, archivedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        clientName: { type: string }
        projectName: { type: string }
        stage:
          type: string
          enum: [setup, collecting, ready_to_diagnose, diagnosing, planning, executing, delivered]
        site: { $ref: '#/components/schemas/Site' }
        contextStatus:
          type: string
          enum: [missing, draft, complete]
        currentIcpProfileVersion: { type: [integer, 'null'], minimum: 1 }
        confirmedIcpProfileVersion:
          type: [integer, 'null']
          minimum: 1
          description: Immutable reviewed profile version frozen for downstream audits; independent of a later working draft.
        defaultDeliveryLocale: { $ref: '#/components/schemas/LocaleCode' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        archivedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    Site:
      type: object
      additionalProperties: false
      required: [id, origin, host, marketCodes, languageCodes]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        origin: { type: string, format: uri }
        host: { type: string }
        marketCodes:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/MarketCode' }
        languageCodes:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/LocaleCode' }

    ProjectResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Project' }
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    Persona:
      type: object
      additionalProperties: false
      required: [name, roleOrContext, jobs, painPoints]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        roleOrContext: { type: string, minLength: 1, maxLength: 500 }
        jobs:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 500 }
        painPoints:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 500 }

    PrimaryConversion:
      type: object
      additionalProperties: false
      required: [label, type, targetUrl]
      properties:
        label: { type: string, minLength: 1, maxLength: 160 }
        type:
          type: string
          enum: [demo, signup, trial, purchase, lead, contact, subscribe, offline, other]
        targetUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }

    CompleteIcpProfileInput:
      type: object
      additionalProperties: false
      required:
        - productName
        - oneLineDescription
        - customerModel
        - businessProfile
        - businessProfileNote
        - marketCodes
        - siteLanguageCodes
        - defaultDeliveryLocale
        - segments
        - personas
        - useCases
        - offers
        - differentiators
        - primaryConversion
        - priorityProductsOrServices
        - priorityUrls
        - competitors
        - brandConstraints
        - complianceConstraints
        - technicalConstraints
        - resourceConstraints
        - growthQuestions
        - ninetyDayGoals
      properties:
        productName: { type: string, minLength: 1, maxLength: 160 }
        oneLineDescription: { type: string, minLength: 1, maxLength: 1000 }
        customerModel: { type: string, enum: [b2b, b2c, hybrid] }
        businessProfile:
          type: string
          enum: [b2b_saas, b2b_services, b2c_ecommerce, b2c_subscription, marketplace, publisher, other]
        businessProfileNote: { type: [string, 'null'], maxLength: 500 }
        marketCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/MarketCode' }
        siteLanguageCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/LocaleCode' }
        defaultDeliveryLocale: { $ref: '#/components/schemas/LocaleCode' }
        segments:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 500 }
        personas:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Persona' }
        useCases:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 500 }
        offers:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 500 }
        differentiators:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 500 }
        primaryConversion: { $ref: '#/components/schemas/PrimaryConversion' }
        priorityProductsOrServices:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 500 }
        priorityUrls:
          type: array
          items: { type: string, format: uri }
        competitors:
          type: array
          items: { type: string, minLength: 1, maxLength: 500 }
        brandConstraints:
          type: array
          items: { type: string, minLength: 1, maxLength: 1000 }
        complianceConstraints:
          type: array
          items: { type: string, minLength: 1, maxLength: 1000 }
        technicalConstraints:
          type: array
          items: { type: string, minLength: 1, maxLength: 1000 }
        resourceConstraints:
          type: array
          items: { type: string, minLength: 1, maxLength: 1000 }
        growthQuestions:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 1000 }
        ninetyDayGoals:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 1000 }
      allOf:
        - if:
            properties:
              businessProfile: { const: other }
          then:
            properties:
              businessProfileNote: { type: string, minLength: 3, maxLength: 500 }

    DraftIcpProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Partial merge over the current profile. Explicit null clears a field where domain-valid.
      properties:
        productName: { type: [string, 'null'], maxLength: 160 }
        oneLineDescription: { type: [string, 'null'], maxLength: 1000 }
        customerModel: { type: [string, 'null'], enum: [b2b, b2c, hybrid, null] }
        businessProfile:
          type: [string, 'null']
          enum: [b2b_saas, b2b_services, b2c_ecommerce, b2c_subscription, marketplace, publisher, other, null]
        businessProfileNote: { type: [string, 'null'], maxLength: 500 }
        marketCodes:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/MarketCode' }
        siteLanguageCodes:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/LocaleCode' }
        defaultDeliveryLocale:
          oneOf:
            - $ref: '#/components/schemas/LocaleCode'
            - type: 'null'
        segments: { type: [array, 'null'], items: { type: string } }
        personas: { type: [array, 'null'], items: { $ref: '#/components/schemas/Persona' } }
        useCases: { type: [array, 'null'], items: { type: string } }
        offers: { type: [array, 'null'], items: { type: string } }
        differentiators: { type: [array, 'null'], items: { type: string } }
        primaryConversion:
          oneOf:
            - $ref: '#/components/schemas/PrimaryConversion'
            - type: 'null'
        priorityProductsOrServices: { type: [array, 'null'], items: { type: string } }
        priorityUrls: { type: [array, 'null'], items: { type: string, format: uri } }
        competitors: { type: [array, 'null'], items: { type: string } }
        brandConstraints: { type: [array, 'null'], items: { type: string } }
        complianceConstraints: { type: [array, 'null'], items: { type: string } }
        technicalConstraints: { type: [array, 'null'], items: { type: string } }
        resourceConstraints: { type: [array, 'null'], items: { type: string } }
        growthQuestions: { type: [array, 'null'], items: { type: string } }
        ninetyDayGoals: { type: [array, 'null'], items: { type: string } }

    DraftContextRequest:
      type: object
      additionalProperties: false
      required: [mode, baseVersion, profile]
      properties:
        mode: { const: draft }
        baseVersion: { type: integer, minimum: 0 }
        profile: { $ref: '#/components/schemas/DraftIcpProfilePatch' }
    CompleteContextRequest:
      type: object
      additionalProperties: false
      required: [mode, baseVersion, profile]
      properties:
        mode: { const: complete }
        baseVersion: { type: integer, minimum: 0 }
        profile: { $ref: '#/components/schemas/CompleteIcpProfileInput' }

    IcpProfile:
      type: object
      additionalProperties: false
      required: [id, projectId, version, status, profile, contentHash, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, complete] }
        profile: { type: object, additionalProperties: true }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    IcpProfileResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/IcpProfile' }
    CurrentIcpProfileResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/IcpProfile'
            - type: 'null'

    SourceConnection:
      type: object
      additionalProperties: false
      required: [id, projectId, provider, connectionType, state, externalRef, scopes, connectedAt, latestSnapshot, activeRun, limitation, featureEnabled, updatedAt]
      properties:
        id: { type: [string, 'null'], format: uuid }
        projectId: { $ref: '#/components/schemas/Uuid' }
        provider: { $ref: '#/components/schemas/Provider' }
        connectionType: { type: string, enum: [public, oauth, file_import, api_key_stub] }
        state: { $ref: '#/components/schemas/SourceState' }
        externalRef: { type: [string, 'null'] }
        scopes: { type: array, items: { type: string } }
        connectedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        latestSnapshot:
          oneOf:
            - $ref: '#/components/schemas/DataSnapshot'
            - type: 'null'
        activeRun:
          oneOf:
            - $ref: '#/components/schemas/AsyncRun'
            - type: 'null'
        limitation: { type: string, minLength: 1 }
        featureEnabled: { type: boolean }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    SourceListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/SourceConnection' }

    AuthorizeSourceRequest:
      type: object
      additionalProperties: false
      required: [phase, returnPath]
      properties:
        phase: { const: authorize }
        returnPath: { type: string, pattern: '^/p/[0-9a-f-]+/sources$' }
    GetPropertySelectionRequest:
      type: object
      additionalProperties: false
      required: [phase, oauthIntentId]
      properties:
        phase: { const: property_selection }
        oauthIntentId: { $ref: '#/components/schemas/Uuid' }
    SelectPropertyRequest:
      type: object
      additionalProperties: false
      required: [phase, oauthIntentId, externalPropertyId]
      properties:
        phase: { const: select_property }
        oauthIntentId: { $ref: '#/components/schemas/Uuid' }
        externalPropertyId: { type: string, minLength: 1, maxLength: 1000 }
        keyEventNames:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
          description: GA4 only; ignored for GSC.
    AuthorizationPhase:
      type: object
      additionalProperties: false
      required: [phase, authorizationUrl, expiresAt]
      properties:
        phase: { const: authorization }
        authorizationUrl: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    PropertySelectionPhase:
      type: object
      additionalProperties: false
      required: [phase, oauthIntentId, provider, properties, expiresAt]
      properties:
        phase: { const: property_selection }
        oauthIntentId: { $ref: '#/components/schemas/Uuid' }
        provider: { type: string, enum: [gsc, ga4] }
        properties:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, displayName]
            properties:
              id: { type: string }
              displayName: { type: string }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    ConnectedPhase:
      type: object
      additionalProperties: false
      required: [phase, source]
      properties:
        phase: { const: connected }
        source: { $ref: '#/components/schemas/SourceConnection' }
    ConnectSourceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/AuthorizationPhase'
            - $ref: '#/components/schemas/PropertySelectionPhase'
            - $ref: '#/components/schemas/ConnectedPhase'
          discriminator:
            propertyName: phase
            mapping:
              authorization: '#/components/schemas/AuthorizationPhase'
              property_selection: '#/components/schemas/PropertySelectionPhase'
              connected: '#/components/schemas/ConnectedPhase'

    ImportPreviewRequest:
      type: object
      additionalProperties: false
      required: [mode, templateId, file]
      properties:
        mode: { type: string, const: preview }
        templateId: { type: string, const: keyword_gap_v1 }
        file: { type: string, format: binary }
    ImportConfirmRequest:
      type: object
      additionalProperties: false
      required: [mode, importToken, mapping]
      properties:
        mode: { const: confirm }
        importToken: { type: string, minLength: 32, maxLength: 512 }
        mapping:
          type: object
          additionalProperties: false
          required: [keyword, searchVolume, marketCode, languageCode]
          properties:
            keyword: { type: string }
            searchVolume: { type: string }
            cluster: { type: [string, 'null'] }
            currentUrl: { type: [string, 'null'] }
            currentRank: { type: [string, 'null'] }
            competitorDomain: { type: [string, 'null'] }
            competitorRank: { type: [string, 'null'] }
            marketCode: { type: string }
            languageCode: { type: string }
    ImportPreviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [importToken, expiresAt, rowCount, previewRows, detectedColumns, suggestedMapping, errors, warnings]
          properties:
            importToken: { type: string, minLength: 32 }
            expiresAt: { $ref: '#/components/schemas/Timestamp' }
            rowCount: { type: integer, minimum: 0, maximum: 200000 }
            previewRows:
              type: array
              maxItems: 20
              items: { type: object, additionalProperties: true }
            detectedColumns: { type: array, items: { type: string } }
            suggestedMapping: { type: object, additionalProperties: { type: [string, 'null'] } }
            errors: { type: array, items: { type: string } }
            warnings: { type: array, items: { type: string } }

    CreateCollectionRunRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: { type: string, enum: [crawl, gsc, ga4, dataforseo] }
        sourceConnectionId: { type: [string, 'null'], format: uuid }
        operation:
          type: string
          enum: [site_graph, search_analytics, organic_landing, keyword_gap_import]

    AsyncRun:
      type: object
      additionalProperties: false
      required: [id, projectId, kind, status, progress, lastError, resultRef, queuedAt, startedAt, completedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/RunKind' }
        status: { $ref: '#/components/schemas/RunStatus' }
        progress:
          type: object
          additionalProperties: false
          required: [phase, current, total, messageKey]
          properties:
            phase: { type: string }
            current: { type: integer, minimum: 0 }
            total: { type: [integer, 'null'], minimum: 0 }
            messageKey: { type: string }
        lastError:
          type: [object, 'null']
          additionalProperties: false
          required: [code, summary]
          properties:
            code: { type: string }
            summary: { type: string }
        resultRef:
          type: [object, 'null']
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
              enum: [collection_run, product_profile_run, icp_profile, diagnostic_run, artifact, export]
            id: { $ref: '#/components/schemas/Uuid' }
        queuedAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    AsyncAcceptedResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [run, statusUrl, resourceRef]
          properties:
            run: { $ref: '#/components/schemas/AsyncRun' }
            statusUrl: { type: string, pattern: '^/api/mvp/projects/[0-9a-f-]+/runs/[0-9a-f-]+$' }
            resourceRef:
              type: [object, 'null']
              additionalProperties: false
              required: [type, id]
              properties:
                type:
                  type: string
                  enum: [collection_run, product_profile_run, icp_profile, diagnostic_run, artifact, export]
                id: { $ref: '#/components/schemas/Uuid' }
    AsyncRunResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AsyncRun' }

    DataSnapshot:
      type: object
      additionalProperties: false
      required: [id, siteId, provider, datasetKey, schemaVersion, methodVersion, capturedAt, sourceWindow, availability, limitation, rowCount, checksum]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        siteId: { $ref: '#/components/schemas/Uuid' }
        provider: { $ref: '#/components/schemas/Provider' }
        datasetKey: { type: string }
        schemaVersion: { type: string }
        methodVersion: { type: string }
        capturedAt: { $ref: '#/components/schemas/Timestamp' }
        sourceWindow:
          type: object
          additionalProperties: false
          required: [start, end]
          properties:
            start: { type: [string, 'null'], format: date }
            end: { type: [string, 'null'], format: date }
        availability: { $ref: '#/components/schemas/Availability' }
        limitation: { type: string, minLength: 1 }
        rowCount: { type: integer, minimum: 0 }
        checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
    SnapshotListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DataSnapshot' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    GrowthMapCoverage:
      type: object
      additionalProperties: false
      required: [availability, limitations]
      properties:
        availability:
          type: string
          enum: [available, partial, stale, unavailable]
        limitations:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 2000 }
      description: Degraded or unavailable coverage always has at least one limitation; missing data is never projected as zero.
      x-signalframe-runtime-refinement: nonAvailableCoverageRequiresLimitation

    GrowthMapMetricNumericValueSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, const: value_numeric }

    GrowthMapMetricJsonValueSource:
      type: object
      additionalProperties: false
      required: [kind, pointer]
      properties:
        kind: { type: string, const: value_json }
        pointer:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^/(?:[^/~]|~0|~1)*(?:/(?:[^/~]|~0|~1)*)*$'

    GrowthMapMetricValueSource:
      oneOf:
        - $ref: '#/components/schemas/GrowthMapMetricNumericValueSource'
        - $ref: '#/components/schemas/GrowthMapMetricJsonValueSource'
      discriminator:
        propertyName: kind
        mapping:
          value_numeric: '#/components/schemas/GrowthMapMetricNumericValueSource'
          value_json: '#/components/schemas/GrowthMapMetricJsonValueSource'

    GrowthMapUrlMetricObservation:
      type: object
      additionalProperties: false
      required: [provider, metricKey, subjectRef, valueSource, value, unit, availability, snapshotId, observationId, sitePageId, observedAt, freshness, limitation]
      properties:
        provider: { type: string, enum: [crawl, gsc, ga4] }
        metricKey: { type: string, enum: [crawl.page.v1, gsc.page.v1, ga4.landing.v1] }
        subjectRef: { type: string, format: uri, maxLength: 2048 }
        valueSource: { $ref: '#/components/schemas/GrowthMapMetricValueSource' }
        value: { type: [number, 'null'] }
        unit: { type: [string, 'null'], minLength: 1, maxLength: 50 }
        availability: { type: string, enum: [available, partial, unavailable] }
