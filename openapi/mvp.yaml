        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    patch:
      tags: [Diagnosis]
      summary: Apply a revision-checked Topic draft edit batch
      description: |
        Applies create, update, rename, split, or merge intents to the exact draft edit revision.
        Split and merge invalidation of affected Keyword assignments is atomic. The client never
        submits Topic Node UUIDs for new nodes, legacy aliases, actors, provenance, or timestamps.
      operationId: patchProjectAuditTopicModelDraft
      parameters:
