      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [run, statusUrl, resourceRef]
          properties:
            run: { $ref: '#/components/schemas/AsyncRun' }
            statusUrl: { type: string, pattern: '^/api/mvp/projects/[0-9a-f-]+/runs/[0-9a-f-]+$' }
            resourceRef:
              type: [object, 'null']
              additionalProperties: false
              required: [type, id]
              properties:
                type:
                  type: string
                  enum: [collection_run, product_profile_run, icp_profile, diagnostic_run, artifact, export, audit_run, flow_shadow_run, analysis_refresh_run]
                id: { $ref: '#/components/schemas/Uuid' }
