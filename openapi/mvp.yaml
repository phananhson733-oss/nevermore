          items: { type: string, minLength: 1, maxLength: 1000 }
        resourceConstraints:
          type: array
          items: { type: string, minLength: 1, maxLength: 1000 }
        growthQuestions:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 1000 }
        ninetyDayGoals:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 1000 }
