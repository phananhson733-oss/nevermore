    ContentShadowQaClaim:
      type: object
      additionalProperties: false
      required: [claimId, kind, severity, status, detail]
      properties:
        claimId: { type: string, minLength: 1, maxLength: 200 }
        kind:
          type: string
          enum: [red_line, structure, citability, coverage]
        severity:
          type: string
          enum: [blocking, review, advisory]
          description: |
            What this claim costs. blocking = the draft says something the frozen records
            cannot support (exactly three checks, a closed set); review = a real defect a
            person must look at; advisory = a style signal that never moves the verdict.
            Reported rather than left to the reader, because the alternative is a copy of the
            gate's severity table in every consumer, and such a copy drifts in the one
            direction that costs the most: a reader that believes a blocking check is
            advisory presents a draft as safe to accept.
        status:
          type: string
          enum: [passed, failed, unevaluated]
          description: unevaluated is honest missing judgement, never an implicit pass.
        detail: { type: string, minLength: 1, maxLength: 2000 }

    ContentShadowAuthoritySource:
      type: object
      additionalProperties: false
      description: |
        Customer-readable, body-free projection of one immutable research source.
        Full retrieved content and URL-hash internals remain server-side in the
        append-only pack. This shape exposes the bounded excerpt, reproducible content-hash
        method and independent body/excerpt truncation flags needed for honest review without
        leaking the complete page body. Runtime refinement requires contentHash and
        contentHashMethod to be present or null together; contentTruncated requires partial
        availability plus an auditable hash; excerptTruncated requires a retained excerpt and
        cannot accompany unavailable. Every URL is HTTP(S)-only with no embedded credentials.
      required:
        - kind
        - ref
        - label
        - url
        - availability
        - authorityTier
        - capturedAt
        - contentHash
        - contentHashMethod
        - contentTruncated
        - excerpt
        - excerptTruncated
        - metrics
        - evidenceRefs
        - limitation
      properties:
        kind:
          type: string
          enum:
            - content_brief
            - search_query
            - generative_query
            - competitor
            - first_party_site
            - first_party_conversion
            - first_party_page
            - external_page
        ref: { type: string, minLength: 1, maxLength: 500 }
        label: { type: string, minLength: 1, maxLength: 500 }
        url:
          type: [string, 'null']
          format: uri
          pattern: '^[Hh][Tt][Tt][Pp][Ss]?://'
          maxLength: 2048
          description: Public HTTP(S) URL; embedded credentials are rejected by runtime refinement.
        availability:
          type: string
          enum: [available, partial, unavailable]
        authorityTier:
          type: string
          enum: [A, B, C]
        capturedAt: { type: [string, 'null'], format: date-time }
        contentHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        contentHashMethod:
          type: [string, 'null']
          enum: [sha256_canonical_extract, sha256_normalized_text, null]
          description: Reproducible normalization method for contentHash; null when no body hash exists.
        contentTruncated:
          type: boolean
          description: True when the retained immutable research body is only a bounded prefix.
        excerpt: { type: [string, 'null'], maxLength: 10000 }
        excerptTruncated:
          type: boolean
          description: True when excerpt is only a bounded customer-readable preview.
        metrics:
          type: [object, 'null']
          additionalProperties: false
          required: [status, contentType, bodyBytes, wordCount, responseMs, redirectChain]
          properties:
            status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
            contentType: { type: [string, 'null'], minLength: 1, maxLength: 200 }
            bodyBytes: { type: [integer, 'null'], minimum: 0 }
            wordCount: { type: [integer, 'null'], minimum: 0 }
            responseMs: { type: [integer, 'null'], minimum: 0 }
            redirectChain:
              type: array
              maxItems: 10
              items:
                type: string
                format: uri
                pattern: '^[Hh][Tt][Tt][Pp][Ss]?://'
                maxLength: 2048
                description: HTTP(S) redirect URL without embedded credentials.
        evidenceRefs:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
        limitation: { type: [string, 'null'], minLength: 1, maxLength: 2000 }

    ContentShadowFirstPartyIdentity:
      type: object
      additionalProperties: false
      description: |
        The project's own web identity, frozen into the content-addressed tuple at accept
