        clicks: { type: integer, minimum: 0 }
        impressions: { type: integer, minimum: 0 }
    Ga4SourceMetricSummary:
      type: object
      additionalProperties: false
      required: [provider, landingPageCount, sessions, keyEvents]
      properties:
        provider: { type: string, const: ga4 }
        landingPageCount: { type: integer, minimum: 1 }
        sessions: { type: integer, minimum: 0 }
        keyEvents: { type: [integer, 'null'], minimum: 0 }
    SourceListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/SourceConnection' }

    AuthorizeSourceRequest:
      type: object
      additionalProperties: false
      required: [phase, returnPath]
      properties:
        phase: { const: authorize }
        returnPath: { type: string, pattern: '^/p/[0-9a-f-]+/(?:sources|setup-sources)$' }
    GetPropertySelectionRequest:
      type: object
      additionalProperties: false
      required: [phase, oauthIntentId]
      properties:
        phase: { const: property_selection }
