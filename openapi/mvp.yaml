      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RecordActionExecutionStateResult' }

    CreateArtifactRequest:
      type: object
      additionalProperties: false
      required: [artifactType, generationMode, outputLocale]
      properties:
        artifactType: { $ref: '#/components/schemas/ArtifactType' }
        generationMode:
          type: string
          enum: [template, structured_llm]
          description: Template generation supports only en and zh-CN; use structured_llm for every other valid BCP-47 output locale.
        outputLocale:
          $ref: '#/components/schemas/LocaleCode'
          description: Template generation supports only en and zh-CN; use structured_llm for every other valid BCP-47 output locale.
        operatorInstructions: { type: [string, 'null'], maxLength: 4000 }

    ArtifactRevision:
      type: object
      additionalProperties: false
      required: [id, revision, outputLocale, contentFormat, content, contentHash, validationErrors, note, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, minimum: 1 }
        outputLocale: { $ref: '#/components/schemas/LocaleCode' }
        contentFormat: { $ref: '#/components/schemas/ContentFormat' }
        content:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        validationErrors: { type: array, items: { type: string } }
        note: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    ArtifactAdoption:
      type: object
      additionalProperties: false
      description: >-
        Whether the Content Shadow quality gate permits this deliverable to move to ready.
        Derived server-side from the same judgement PATCH /artifacts/{artifactId} and
        POST /content-shadow-runs/{flowShadowRunId}/review enforce, so a control can state
        the refusal before it is attempted instead of after.
      required: [blocked, blockingClaimIds]
      properties:
        blocked: { type: boolean }
        blockingClaimIds:
          type: array
          maxItems: 25
          items: { type: string, maxLength: 200 }
          description: >-
            Claim ids of the blocking checks the latest gate recorded as not passed, in gate order.
            Empty when the deliverable is not blocked, and empty when the stored claims could not be
            read - the verdict remains authoritative on its own and no reason is invented.
    Artifact:
      type: object
      additionalProperties: false
      required: [id, actionId, artifactType, status, generationMode, outputLocale, currentRevision, validationState, current, activeRun, adoption, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        actionId: { $ref: '#/components/schemas/Uuid' }
        artifactType: { $ref: '#/components/schemas/ArtifactType' }
        status: { $ref: '#/components/schemas/ArtifactStatus' }
        generationMode: { type: string, enum: [template, structured_llm] }
        outputLocale: { $ref: '#/components/schemas/LocaleCode' }
        currentRevision: { type: integer, minimum: 0 }
        validationState: { type: string, enum: [pending, valid, invalid] }
        current:
          oneOf:
            - $ref: '#/components/schemas/ArtifactRevision'
            - type: 'null'
        activeRun:
          oneOf:
            - $ref: '#/components/schemas/AsyncRun'
            - type: 'null'
        adoption:
          description: >-
            null when no Content Shadow quality gate judges this artifact type. That is not the
            same statement as "adoption is allowed", and a reader must not render it as one.
          oneOf:
            - $ref: '#/components/schemas/ArtifactAdoption'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
