openapi: 3.1.0
info:
  title: SignalFrame Service Delivery MVP API
  version: 0.3.0
  summary: Same-origin internal API for the ICP-to-enterprise-export MVP.
  description: |
    Implementation contract for SignalFrame MVP 0.3. All authenticated operators have
    full product access inside one internal workspace. Project scoping, evidence lineage,
    unavailable-not-zero semantics, optimistic revisions, and asynchronous status URLs
    are mandatory. This is an internal contract, not a public API commitment.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/mvp
    description: Same-origin web application API
security:
  - supabaseSessionCookie: []
tags:
  - name: Projects
    description: Client projects, sites, context versions, and screen projections.
  - name: Sources
    description: Source authorization, import, collection, and immutable snapshots.
  - name: Runs
    description: Unified asynchronous job lifecycle and polling.
  - name: Diagnosis
    description: Frozen diagnostic runs, evidence, findings, and human review.
  - name: Actions
    description: Deterministic action templates and the 30/60/90 plan.
  - name: Artifacts
    description: Generated and manually revised execution deliverables.
  - name: Publications
    description: Short-lived, server-issued publication and rollback preview authority.
  - name: Reports
    description: Canonical browser-facing client report projection.
  - name: Exports
    description: Versioned enterprise and client JSON ZIP bundles.

paths:
  /projects:
    get:
      tags: [Projects]
      summary: List client projects in the internal workspace
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Project page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Projects]
      summary: Create a client project, primary site, and default crawl source
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Project created.
          headers:
            Location:
              required: true
              description: Legacy creation opens Overview; URL-first Product Profile creation opens the Product Profile editor.
              schema: { type: string, pattern: '^/p/[0-9a-f-]+/(?:overview|context)$' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Read the current project aggregate
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Current project aggregate.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Projects]
      summary: Remove a product from the active workspace while preserving its history
      description: |
        Soft-deletes the project by archiving it. The product disappears from
        active project lists and all future writes remain fenced, while its
        immutable evidence and delivery history are retained for audit.
        Repeating the command for the same scoped archived project is idempotent.
      operationId: deleteProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Product archived and removed from the active workspace.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/context:
    get:
      tags: [Projects]
      summary: Read the current immutable ICP profile version, or null before the first save
      operationId: getProjectContext
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Current ICP profile or null for a new project.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentIcpProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Save an immutable draft or complete ICP profile version
      operationId: updateProjectContext
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DraftContextRequest'
                - $ref: '#/components/schemas/CompleteContextRequest'
              discriminator:
                propertyName: mode
                mapping:
                  draft: '#/components/schemas/DraftContextRequest'
                  complete: '#/components/schemas/CompleteContextRequest'
      responses:
        '200':
          description: Current profile; semantic no-op may return the existing version.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IcpProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/product-profile:
    get:
      tags: [Projects]
      summary: Read the current, confirmed, and actively synthesizing Product Profile versions
      operationId: getProjectProductProfile
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Product Profile review workspace backed by append-only profile versions.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductProfileWorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Append a customer-edited Product Profile draft version
      operationId: updateProductProfileDraft
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductProfileDraftRequest' }
      responses:
        '200':
          description: Current Product Profile version; a semantic no-op may return the existing row.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductProfileRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/product-profile/synthesis-runs:
    post:
      tags: [Projects, Runs]
      summary: Queue Product Profile synthesis from a frozen Site snapshot manifest
      operationId: createProductProfileSynthesisRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductProfileSynthesisRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/product-profile/competitors/{candidateId}:
    patch:
      tags: [Projects]
      summary: Review or correct one Product Profile competitor candidate
      operationId: reviewProductProfileCompetitor
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ProductProfileCandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewProductProfileCompetitorRequest' }
      responses:
        '200':
          description: Current Product Profile version after the reviewed candidate is appended.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductProfileRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/product-profile/competitors:
    post:
      tags: [Projects]
      summary: Add one customer-declared competitor to the Product Profile
      operationId: addProductProfileCompetitor
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddProductProfileCompetitorRequest' }
      responses:
        '200':
          description: Current Product Profile version with the server-identified approved competitor.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductProfileRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/product-profile/confirm:
    post:
      tags: [Projects]
      summary: Confirm one reviewed Product Profile version without starting an Audit
      operationId: confirmProductProfile
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmProductProfileRequest' }
      responses:
        '200':
          description: Confirmed Product Profile row. No diagnostic or Audit run is created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmedProductProfileRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/workspace:
    get:
      tags: [Projects]
      summary: Read a screen-oriented projection backed by canonical repositories
      operationId: getProjectWorkspaceView
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [overview]
        - name: outputLocale
          in: query
          schema: { $ref: '#/components/schemas/LocaleCode' }
      responses:
        '200':
          description: Requested projection. The data.view discriminator identifies its shape.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceViewResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/sources:
    get:
      tags: [Sources]
      summary: List source cards, capabilities, and latest snapshots
      operationId: listProjectSources
      description: |
        Active projects require a confirmed Product Profile and ICP before this
        read returns any source connection or snapshot metadata; otherwise the
        response is 422 `CONTEXT_INCOMPLETE`. Archived projects preserve their
        retained source and snapshot history as a read-only view.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: All five MVP source capabilities, including disabled or absent sources.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/sources/{provider}/connect:
    post:
      tags: [Sources]
      summary: Begin Google authorization, read candidate properties, or select one property
      operationId: connectProjectSource
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/GoogleProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizeSourceRequest'
                - $ref: '#/components/schemas/GetPropertySelectionRequest'
                - $ref: '#/components/schemas/SelectPropertyRequest'
              discriminator:
                propertyName: phase
                mapping:
                  authorize: '#/components/schemas/AuthorizeSourceRequest'
                  property_selection: '#/components/schemas/GetPropertySelectionRequest'
                  select_property: '#/components/schemas/SelectPropertyRequest'
      responses:
        '200':
          description: Authorization URL or connected source; response is discriminated by phase.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectSourceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /oauth/google/callback:
    get:
      tags: [Sources]
      summary: Consume one Google OAuth callback and return to the project Sources screen
      operationId: handleGoogleOAuthCallback
      parameters:
        - name: code
          in: query
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          schema: { type: string, minLength: 20 }
        - name: error
          in: query
          schema: { type: string }
        - name: error_description
          in: query
          schema: { type: string }
      responses:
        '303':
          description: Redirect to the project Sources page with oauthIntentId or a stable error code.
          headers:
            Location:
              required: true
              schema: { type: string, pattern: '^/p/[0-9a-f-]+/sources' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/sources/{provider}/import:
    post:
      tags: [Sources]
      summary: Preview or confirm a keyword-gap CSV import
      description: |
        multipart/form-data with mode=preview returns 200 and does not write canonical observations.
        application/json with mode=confirm returns 202 and a statusUrl.
      operationId: importProjectSourceFile
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsvProvider'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImportPreviewRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/ImportConfirmRequest' }
      responses:
        '200':
          description: Safe preview only; no canonical observations were written.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreviewResponse' }
        '202':
          $ref: '#/components/responses/AsyncAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/sources/{sourceConnectionId}:
    delete:
      tags: [Sources]
      summary: Disconnect a source and remove its credential while preserving snapshots
      operationId: disconnectProjectSource
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SourceConnectionId'
      responses:
        '204':
          description: Source disconnected. Historical snapshots remain.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/collection-runs:
    post:
      tags: [Runs, Sources]
      summary: Queue one customer-triggerable provider collection
      description: |
        This public command accepts exactly Crawl, connected GSC, or connected
        GA4. CSV uses the dedicated import endpoint. DataForSEO Search
        Landscape (DFS) is a built-in, server-owned Analysis Refresh step:
        clients cannot trigger or configure it here, and this request never
        accepts provider credentials, API keys, Search Landscape scope, or
        provider limits.
      operationId: createCollectionRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCollectionRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/analysis-refresh-runs:
    post:
      tags: [Runs, Sources, Diagnosis]
      summary: Queue the server-owned durable Analysis Refresh plan
      description: |
        Freezes the primary Site, current confirmed ICP, and the fixed ordered
        Crawl → connected GSC → connected GA4 → built-in DataForSEO Search
        Landscape (DFS) → Growth Audit plan. The server derives the DFS target,
        market, language and cost caps from frozen project context and server
        configuration. Optional unavailable inputs are recorded as skipped
        steps; the client cannot add, remove, reorder, configure, or directly
        invoke any step.
      operationId: createAnalysisRefreshRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAnalysisRefreshRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/snapshots:
    get:
      tags: [Sources]
      summary: List immutable data snapshots
      operationId: listProjectSnapshots
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: provider
          in: query
          schema: { $ref: '#/components/schemas/Provider' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Snapshot page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/runs/{runId}:
    get:
      tags: [Runs]
      summary: Poll any collection, Analysis Refresh, Product Profile synthesis, diagnostic, artifact, or export run
      operationId: getProjectRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current run projection.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 10 }
              description: Present for queued or running responses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncRunResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/diagnostic-runs:
    post:
      tags: [Runs, Diagnosis]
      summary: Queue a frozen-input diagnostic run
      operationId: createDiagnosticRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDiagnosticRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/audit-runs:
    post:
      tags: [Runs, Diagnosis]
      summary: Queue a versioned full Growth Audit over frozen URL/ICP/snapshot inputs
      operationId: createGrowthAuditRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGrowthAuditRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/content-shadow-runs:
    post:
      tags: [Runs, Execution]
      summary: Queue a pinned SEO/GEO Content Shadow run over a confirmed content brief
      description: |
        Freezes an already confirmed content Finding, its single canonical Action, the
        confirmed content_brief revision, an explicit competitor set, one SearchQuery cluster
        and a separate GenerativeQuery set into an immutable content-addressed tuple, then
        queues one shadow-mode run. This command confirms nothing a second time: it requires a
        Finding that the canonical Finding Review transaction already confirmed and refuses
        otherwise. The brief is consumed as-is and never regenerated. The run performs internal
        writes only and never writes to a CMS or publishes anything.
      operationId: createContentShadowRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContentShadowRunRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    get:
      tags: [Execution]
      summary: List this project's Content Shadow runs as a state-free index
      description: |
        Returns the project's Content Shadow runs, newest first, as cursor pages. Each row
        carries only columns of the run's own immutable record plus its frozen output locale,
        so a page can never report a phase, a verdict or a research pack it did not read; run
        state and every child projection come from getContentShadowRun. The index exists
        because a run id was otherwise handed out only once, in the 202 that created it, which
        made the research pack, the QA verdict and the honesty disclosures unreachable after a
        reload. Runs outside the caller's workspace or project are absent, never forbidden.
      operationId: listContentShadowRuns
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Content Shadow run index page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentShadowRunListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/content-shadow-runs/{flowShadowRunId}:
    get:
      tags: [Execution]
      summary: Read one Content Shadow run projection
      description: |
        Returns one Content Shadow run as a strictly read-only projection. Run status is
        projected from the canonical async run and the phase is derived from which append-only
        child rows exist; the shadow rows own no second lifecycle. A run outside the caller's
        workspace or project is reported as absent.
      operationId: getContentShadowRun
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlowShadowRunId'
      responses:
        '200':
          description: The requested Content Shadow run projection.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentShadowRunHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/content-shadow-runs/{flowShadowRunId}/review:
    post:
      tags: [Execution]
      summary: Record a human review of one Content Shadow draft revision
      description: |
        Records that a person reviewed the draft revision this run produced, and marks that
        revision reviewed. It performs NO external write of any kind: no CMS, no Git, no
        third-party publishing target exists in this stage, and the receipt states that as a
        field rather than as prose.

        The command is bound to one revision. baseRevision names the revision the reviewer
        actually read; if the deliverable has moved on, the review is refused with 409
        STALE_REVISION and nothing changes, rather than being re-aimed at text nobody read.
        The same guard is applied to the automated verdict: a verdict that judged an earlier
        revision cannot carry a review of the current one.

        Every refusal is recomputed here rather than trusted from the caller. A blocked
        verdict cannot pass, and a needs_review verdict requires acknowledgeFindings to be
        true. There is no decision parameter: the artifact lifecycle already owns the way
        back from reviewed — editing appends a revision and returns the deliverable to draft
        — so a second decision value would be a control that writes nothing.
      operationId: reviewContentShadowRevision
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FlowShadowRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewContentShadowRevisionRequest' }
      responses:
        '200':
          description: The recorded review, as facts that can be checked against the record.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentShadowReviewReceiptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/actions/{actionId}/recheck:
    post:
      tags: [Runs, Diagnosis]
      summary: Recheck one confirmed Action's technical condition with fresh data
      description: |
        Queues a targeted recheck of one confirmed Action. The recheck re-runs the frozen
        diagnostic pipeline over the latest eligible crawl snapshot and creates a brand-new
        immutable audit run under an isolated recheck projection version. The prior run is
        never mutated and no performance checkpoint is written.
      operationId: createActionRecheck
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActionRecheckRequest' }
      responses:
        '202': { $ref: '#/components/responses/AsyncAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/urls:
    get:
      tags: [Diagnosis]
      summary: List the latest readable Growth Map URL portfolio
      description: |
        Returns one bounded page of canonical Site Pages proven by one published
        DiagnosticRun's frozen Crawl/GSC/GA4 inputs. Without diagnosticRunId the
        server selects the latest readable generation; with diagnosticRunId it
        reads that exact same-project published generation. The response deliberately
        has no project-wide total. Missing observations remain unavailable with
        explicit limitations; unresolved or definition-only Finding targets are
        never assigned to URL rows.
      operationId: listProjectAuditUrls
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: search
          in: query
          description: Trimmed, non-empty literal substring matched against canonical URL. Repeated scalar query parameters are rejected.
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: '\S'
        - $ref: '#/components/parameters/DiagnosticRunIdPin'
      responses:
        '200':
          description: Current traceable URL portfolio page without a synthetic total.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapUrlPortfolioHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/urls/{sitePageId}:
    get:
      tags: [Diagnosis]
      summary: Read one URL from the latest readable Growth Map portfolio
      description: |
        Resolves the selected canonical Site Page inside the latest readable
