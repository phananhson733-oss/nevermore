        governance projection for human review; view=review and diagnosticRunId
        are mutually exclusive, and repeated scalar query parameters are rejected.
      operationId: getProjectAuditKeyword
      x-signalframe-query-refinement: reviewViewAndDiagnosticRunIdAreMutuallyExclusive
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/KeywordId'
        - $ref: '#/components/parameters/DiagnosticRunIdPin'
        - $ref: '#/components/parameters/ReviewView'
      responses:
        '200':
          description: Selected traceable Keyword Library entry.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapKeywordDetailHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    patch:
      tags: [Diagnosis]
      summary: Review one project Keyword governance decision
      description: |
        Appends one human Keyword governance decision against an exact optimistic revision,
        confirmed Topic Model revision, and optional same-project Site Page. Topic labels,
        actor identity, timestamps, provenance, and source occurrence history remain
        server-owned. An exact immediate retry is idempotent. PATCH rejects every
        query parameter, including diagnosticRunId and view; review semantics come
        only from the governed request body.
      operationId: reviewProjectAuditKeyword
      x-signalframe-query-contract: rejectAllQueryParameters
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/KeywordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewKeywordRequest' }
      responses:
        '200':
          description: Canonical Keyword detail after the governance decision.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapKeywordDetailHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/keywords/{keywordId}/rank-history:
    get:
      tags: [Diagnosis]
      summary: Read one Keyword's fixed rank history
      description: |
        Returns the exact trailing 90-day UTC rank evidence for one governed Keyword
        inside Growth Map. DataForSEO absolute rank and GSC rolling 28-day
        impression-weighted average position remain separate series and are never
        presented as the same metric. Content-change markers come only from verified
        Change Receipts for the exact canonical mapped page. The window is server-owned;
        this built-in Growth Map capability is not a fifth workspace module.
      operationId: getProjectAuditKeywordRankHistory
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/KeywordId'
      responses:
        '200':
          description: Traceable Keyword rank history for the fixed 90-day window.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMapKeywordRankHistoryHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/keyword-relations:
    get:
      tags: [Diagnosis]
      summary: List governed duplicate-Keyword relations
      description: |
        Returns one bounded cursor page of immutable duplicate candidates and
        customer decisions inside the existing Growth Map Keyword Library. Repeated
        keywordId values attach at most one visible Keyword Library page in one
        project-scoped query; they do not create a separate product module. Only an
        active primary/supporting decision may fold a supporting Keyword from the
        default list, and governance drift makes that fold stale and visible again.
      operationId: listProjectAuditKeywordRelations
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: keywordId
          in: query
          required: false
          style: form
          explode: true
          description: One to fifty unique stable Keyword IDs from the currently visible Keyword Library page.
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Current and stale Keyword Relation projections for this cursor page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeywordRelationListHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    post:
      tags: [Diagnosis]
      summary: Refresh governed duplicate-Keyword candidates
      description: |
        Re-evaluates current reviewed Keywords using the server-owned duplicate
        rule and appends only new immutable evidence snapshots. The command has no
        request body or query parameters: relation identities, evidence hashes,
        rule versions, actors, and clocks are server-owned. Existing Keywords,
        occurrences, observations, rank history, and decisions are never deleted.
      operationId: refreshProjectAuditKeywordRelations
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Bounded refresh counts; an exact evidence replay creates no duplicate candidate.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeywordRelationRefreshHttpResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
