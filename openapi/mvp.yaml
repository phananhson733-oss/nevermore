  /projects/{projectId}/audit/topic-model/draft:
    post:
      tags: [Diagnosis]
      summary: Begin the unique next Growth Map Topic draft
      description: |
        Starts one editable draft from the exact latest confirmed Topic Model revision. Zero is
        the first-model sentinel. Actor identity, generation provenance, evidence, timestamps,
        Topic Node UUIDs, aliases, and content hashes are resolved or generated by the server.
      operationId: beginProjectAuditTopicModelDraft
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeginTopicModelDraftRequest' }
      responses:
        '200':
          description: Growth Map Topic workspace with its unique draft.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
