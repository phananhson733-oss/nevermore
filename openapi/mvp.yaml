        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /projects/{projectId}/audit/internal-link-map:
    get:
      tags: [Diagnosis]
      summary: Read the frozen Internal Link Map inside Growth Map
      description: |
        Returns canonical site nodes and observed directed edges from the latest readable
