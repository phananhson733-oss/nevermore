    ProductProfileFieldProvenance:
      type: object
      additionalProperties: false
      required: [path, derivation, confidence, evidenceRefs, limitation, observedAt]
      properties:
        path:
          type: string
          maxLength: 1000
          pattern: '^(?:\/(?:[^~/]|~0|~1)*)+$'
        derivation:
          type: string
          enum: [declared, observed, computed, inferred, missing, contradicted]
        confidence: { type: string, enum: [high, medium, low, unknown] }
        evidenceRefs:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ProductProfileEvidenceRef' }
        limitation: { type: [string, 'null'], minLength: 1, maxLength: 2000 }
        observedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      allOf:
        - if:
            properties: { derivation: { const: declared } }
            required: [derivation]
          then:
            properties:
              evidenceRefs:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  oneOf:
                    - $ref: '#/components/schemas/ProductProfileDeclaredHintEvidenceRef'
                    - $ref: '#/components/schemas/ProductProfileUserEditEvidenceRef'
        - if:
            properties: { derivation: { enum: [observed, computed, inferred] } }
            required: [derivation]
          then:
            properties:
              observedAt: { $ref: '#/components/schemas/Timestamp' }
              evidenceRefs:
                contains:
                  oneOf:
                    - $ref: '#/components/schemas/ProductProfileSnapshotEvidenceRef'
                    - $ref: '#/components/schemas/ProductProfilePageSnapshotEvidenceRef'
                    - $ref: '#/components/schemas/ProductProfileObservationEvidenceRef'
                    - $ref: '#/components/schemas/ProductProfileAnalysisInvocationEvidenceRef'
                minContains: 1
        - if:
            properties: { derivation: { const: contradicted } }
            required: [derivation]
          then:
            properties:
              observedAt: { $ref: '#/components/schemas/Timestamp' }
              evidenceRefs: { minItems: 2 }
        - if:
            properties: { derivation: { const: missing } }
            required: [derivation]
          then:
            properties:
              confidence: { const: unknown }
              evidenceRefs: { maxItems: 0 }
              observedAt: { type: 'null' }

