        surface: Slice 2 performs zero external writes.
      required:
        - flowShadowRunId
        - projectId
        - siteId
        - asyncRunId
        - status
        - phase
        - contentHash
        - projectionVersion
        - flowAdapterVersion
        - outputLocale
        - createdAt
        - source
        - frozenInputs
        - research
        - draft
        - qa
      properties:
        flowShadowRunId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        siteId: { $ref: '#/components/schemas/Uuid' }
        asyncRunId: { $ref: '#/components/schemas/Uuid' }
        status:
          type: string
          enum: [queued, running, completed, partial, failed, cancelled]
        phase:
          type: string
          enum: [queued, research, draft, qa, complete, failed]
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        projectionVersion: { type: string, minLength: 1, maxLength: 200 }
        flowAdapterVersion: { type: string, minLength: 1, maxLength: 200 }
        outputLocale: { $ref: '#/components/schemas/LocaleCode' }
        createdAt: { type: string, format: date-time }
        source:
          type: object
          additionalProperties: false
          required: [findingId, actionId, contentBriefArtifactId, contentBriefRevision]
          properties:
            findingId: { $ref: '#/components/schemas/Uuid' }
            actionId: { $ref: '#/components/schemas/Uuid' }
            contentBriefArtifactId: { $ref: '#/components/schemas/Uuid' }
            contentBriefRevision: { type: integer, minimum: 1 }
        frozenInputs:
          type: object
          additionalProperties: false
          required:
            - primaryFindingId
            - sourceDiagnosticRunId
            - competitorEntityIds
            - searchCluster
            - generativeQueryEntityIds
            - firstParty
            - contentBriefOutline
            - researchContext
          properties:
            primaryFindingId: { $ref: '#/components/schemas/Uuid' }
            sourceDiagnosticRunId: { $ref: '#/components/schemas/Uuid' }
            competitorEntityIds:
              type: array
              uniqueItems: true
              maxItems: 50
              items: { $ref: '#/components/schemas/Uuid' }
            searchCluster:
              type: object
              additionalProperties: false
              required: [clusterKey, keywordEntityIds]
              properties:
                clusterKey: { type: string, minLength: 1, maxLength: 200 }
                keywordEntityIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  maxItems: 500
                  items: { $ref: '#/components/schemas/Uuid' }
            generativeQueryEntityIds:
              type: array
              uniqueItems: true
              maxItems: 500
              items: { $ref: '#/components/schemas/Uuid' }
            firstParty: { $ref: '#/components/schemas/ContentShadowFirstPartyIdentity' }
            contentBriefOutline: { $ref: '#/components/schemas/ContentShadowBriefOutline' }
            researchContext: { $ref: '#/components/schemas/ContentShadowResearchContext' }
        research:
          type: [object, 'null']
          additionalProperties: false
          required: [packId, sources, limitations, generatedAt]
          properties:
            packId: { $ref: '#/components/schemas/Uuid' }
            sources:
              type: array
              maxItems: 1200
              items: { $ref: '#/components/schemas/ContentShadowAuthoritySource' }
            limitations:
              type: array
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 2000 }
            generatedAt: { type: string, format: date-time }
        draft:
          type: [object, 'null']
          additionalProperties: false
          description: |
            The draft THIS run owns, bound through its QA gate or its own invocation lineage —
            never the Action's currently live artifact. A later shadow run for the same Action
            may install a further revision on the same artifact row; that never changes what a
            finished run reports here. Null until this run claims or produces a draft.
          required: [artifactId, status, currentRevision, contentText, revisionHistory]
          properties:
            artifactId: { $ref: '#/components/schemas/Uuid' }
            status:
              type: string
              enum: [generating, draft, ready, failed, archived]
              description: The internal shadow draft lifecycle; it never reaches a published state.
            currentRevision:
              type: integer
              minimum: 0
              description: The revision this run installed or evaluated; 0 before it installs one.
            contentText: { type: [string, 'null'] }
            revisionHistory:
              type: array
              maxItems: 1000
              items: { $ref: '#/components/schemas/ContentShadowArtifactRevisionSummary' }
              description: Complete immutable artifact revision ledger, newest first.
              x-signalframe-runtime-refinement: completeNewestFirstRevisionHistory
        qa:
          type: [object, 'null']
          additionalProperties: false
          required: [gateId, verdict, evaluatedArtifactId, evaluatedRevision, claims, evaluatedAt]
          properties:
            gateId: { $ref: '#/components/schemas/Uuid' }
            verdict:
              type: string
              enum: [passed, needs_review, blocked]
            evaluatedArtifactId: { $ref: '#/components/schemas/Uuid' }
            evaluatedRevision: { type: integer, minimum: 1 }
            claims:
              type: array
              maxItems: 500
              items: { $ref: '#/components/schemas/ContentShadowQaClaim' }
            evaluatedAt: { type: string, format: date-time }

    ContentShadowRunHttpResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ContentShadowRunResponse' }

    ContentShadowRunSummary:
      type: object
      additionalProperties: false
      description: |
        One row of the Content Shadow run index. Deliberately state-free: every field is a
        column of the run's own immutable record plus the frozen manifest's output locale, so
        a page of this list can never report a lifecycle it did not read. Phase, status, the
        research pack, the draft and the QA gate all come from getContentShadowRun, which
        reads the append-only child rows that own them.
      required:
        - flowShadowRunId
        - projectId
        - siteId
        - asyncRunId
        - contentHash
        - projectionVersion
        - flowAdapterVersion
        - outputLocale
        - createdAt
        - source
      properties:
        flowShadowRunId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        siteId: { $ref: '#/components/schemas/Uuid' }
        asyncRunId: { $ref: '#/components/schemas/Uuid' }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        projectionVersion: { type: string, minLength: 1, maxLength: 200 }
        flowAdapterVersion: { type: string, minLength: 1, maxLength: 200 }
        outputLocale: { $ref: '#/components/schemas/LocaleCode' }
        createdAt: { type: string, format: date-time }
        source:
          type: object
          additionalProperties: false
          required: [findingId, actionId, contentBriefArtifactId, contentBriefRevision]
          properties:
            findingId: { $ref: '#/components/schemas/Uuid' }
            actionId: { $ref: '#/components/schemas/Uuid' }
            contentBriefArtifactId: { $ref: '#/components/schemas/Uuid' }
            contentBriefRevision: { type: integer, minimum: 1 }

    ContentShadowRunListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ContentShadowRunSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ReviewContentShadowRevisionRequest:
      type: object
      additionalProperties: false
      description: |
        A human review of one Content Shadow draft revision. There is deliberately no
        decision field: the artifact lifecycle's manual edges are generating -> draft ->
        ready and draft | ready -> archived, so the way back from reviewed is to edit, which
        appends a revision and returns the deliverable to draft by itself. A second decision
        value would have to be recorded somewhere no table exists for, and a control that
        writes nothing while appearing to decide something is exactly what this stage refuses
        to build.
      required: [baseRevision]
      properties:
        baseRevision:
          type: integer
          minimum: 1
          description: |
            The revision the reviewer actually read. If the deliverable has moved on the
            review is refused (409 STALE_REVISION) rather than re-aimed at newer text.
        acknowledgeFindings:
          type: boolean
          description: |
            The reviewer's explicit statement that they read every finding needing human
            confirmation. Must be true when the automated verdict is needs_review; a
            one-click pass would make that verdict decorative. Omission is interpreted as
            false by the request validator.

    ContentShadowReviewReceipt:
      type: object
      additionalProperties: false
      description: |
        What the review did, as facts that can be checked against the record rather than as
        prose. externalPublishingWrite is a constant with one legal value, and that is the
        point: "nothing was published" as a field can only ever read none, where a sentence in
        the interface could quietly stop being true.
      required:
        - flowShadowRunId
        - artifactId
        - reviewedRevision
        - artifactStatus
        - verdict
        - claimCounts
        - contentHash
        - reviewedAt
        - externalPublishingWrite
      properties:
        flowShadowRunId: { $ref: '#/components/schemas/Uuid' }
        artifactId: { $ref: '#/components/schemas/Uuid' }
        reviewedRevision: { type: integer, minimum: 1 }
        artifactStatus: { $ref: '#/components/schemas/ArtifactStatus' }
        verdict:
          type: string
          enum: [passed, needs_review, blocked]
          description: |
            The automated verdict that applied to the reviewed revision, recorded so the
            receipt says what the person was looking at. blocked never appears here: a
            blocked draft cannot be passed.
        claimCounts:
          type: object
          additionalProperties: false
          required: [passed, failed, unevaluated]
          description: |
            The three-way tally of the verdict that applied, carried into the receipt so it
            records what was known at review time. Never folded into two.
          properties:
            passed: { type: integer, minimum: 0 }
