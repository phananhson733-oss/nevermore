    />
    <style>
:root {
  color-scheme: light;
  --nm-forest-950: #082f28;
  --nm-forest-900: #0d3b32;
  --nm-forest-800: #164f43;
  --nm-forest-700: #216557;
  --nm-forest-100: #d9e9e3;
  --nm-forest-050: #edf5f1;
  --nm-lime: #c7f36a;
  --nm-lime-soft: #e8f8bf;
  --nm-paper: #f2efe7;
  --nm-sheet: #fbfaf5;
  --nm-white: #fffef9;
  --nm-ink: #18241f;
  --nm-ink-2: #43534d;
  --nm-ink-3: #64716c;
  --nm-line: #d8d2c5;
  --nm-line-strong: #bcb3a1;
  --nm-coral: #e45c45;
  --nm-coral-dark: #9c2e21;
  --nm-coral-soft: #f7ddd5;
  --nm-amber: #96600c;
  --nm-amber-soft: #f4e6c4;
  --nm-blue: #315f8f;
  --nm-blue-soft: #dce8f3;
  --nm-violet: #62519c;
  --nm-violet-soft: #e8e2f4;
  --nm-focus: #ee6b32;
  --nm-shadow: 0 24px 70px rgb(11 48 40 / 10%);
  --nm-shadow-soft: 0 12px 32px rgb(11 48 40 / 7%);
  --nm-display: "Iowan Old Style", "Songti SC", "STSong", "Noto Serif CJK SC",
    Georgia, serif;
  --nm-body: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--nm-paper);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--nm-ink);
  background:
    radial-gradient(circle at 84% 0, rgb(255 255 255 / 75%), transparent 32rem),
    linear-gradient(90deg, rgb(13 59 50 / 2%) 1px, transparent 1px) 0 0 / 64px 64px,
    var(--nm-paper);
  font-family: var(--nm-body);
  font-size: 16px;
  line-height: 1.65;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

button,
select,
input {
  font: inherit;
}

button {
  color: inherit;
  touch-action: manipulation;
}

button:focus-visible,
select:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--nm-focus);
  outline-offset: 3px;
}

[data-reading-text] {
  font-size: 1rem !important;
  line-height: 1.78;
}

.skip-link {
  position: fixed;
  z-index: 1000;
  top: 12px;
  left: 12px;
  padding: 10px 15px;
  transform: translateY(-180%);
  border: 2px solid var(--nm-lime);
  border-radius: 5px;
  color: var(--nm-white);
  background: var(--nm-forest-950);
  font-weight: 800;
}

.skip-link:focus {
  transform: translateY(0);
}

#app {
  min-height: 100vh;
}

.boot-error {
  width: min(760px, calc(100% - 32px));
  margin: 64px auto;
  padding: 40px;
  border: 1px solid var(--nm-coral);
  background: var(--nm-white);
}

.product-shell {
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  min-height: 100vh;
}

.product-sidebar {
  position: sticky;
  z-index: 40;
  top: 0;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  width: 272px;
  height: 100vh;
  overflow: hidden;
  color: #e7f1ed;
  background:
    radial-gradient(circle at 5% 8%, rgb(199 243 106 / 14%), transparent 17rem),
    linear-gradient(160deg, var(--nm-forest-800), var(--nm-forest-950) 58%);
  box-shadow: 12px 0 40px rgb(8 47 40 / 13%);
}

.brand {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 28px 24px 20px;
}

.brand__mark {
  display: grid;
  flex: 0 0 auto;
  width: 48px;
  height: 48px;
  place-content: center;
  border-radius: 12px 2px 12px 2px;
  color: var(--nm-forest-950);
  background: var(--nm-lime);
  font-family: var(--nm-display);
  font-size: 1.85rem;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgb(8 47 40 / 16%);
}

.brand__name {
  display: block;
  color: #fffef7;
  font-family: var(--nm-display);
  font-size: 1.42rem;
  font-weight: 650;
  letter-spacing: 0.01em;
  line-height: 1.2;
}

.brand__tagline {
  display: block;
  margin-top: 3px;
  color: #b9cbc4;
  font-size: 0.875rem;
}

.project-identity {
  margin: 8px 18px 20px;
  padding: 17px;
  border: 1px solid rgb(255 255 255 / 16%);
  border-radius: 14px;
  background: rgb(255 255 255 / 7%);
}

.project-identity__eyebrow {
  display: block;
  color: var(--nm-lime);
  font-size: 0.875rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.project-identity strong {
  display: block;
  margin-top: 6px;
  color: #fffef8;
  font-size: 1rem;
}

.project-identity p {
  margin: 5px 0 0;
  color: #b9cbc4;
  font-size: 0.875rem;
  line-height: 1.55;
}

.workspace-nav {
  min-height: 0;
  padding: 8px 16px;
  overflow-y: auto;
  scrollbar-color: rgb(255 255 255 / 22%) transparent;
}

.workspace-nav__label {
  margin: 0 12px 10px;
  color: #a9bdb5;
  font-size: 0.875rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.workspace-nav button {
  position: relative;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  width: 100%;
  min-height: 72px;
  margin-bottom: 7px;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: 14px;
  color: #bcd0c8;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.workspace-nav button:hover {
  color: #fff;
  border-color: rgb(255 255 255 / 13%);
  background: rgb(255 255 255 / 7%);
}

.workspace-nav button[aria-current="page"] {
  color: #fff;
  border-color: rgb(199 243 106 / 28%);
  background: rgb(255 255 255 / 12%);
}

.workspace-nav button[aria-current="page"]::before {
  position: absolute;
  top: 17px;
  bottom: 17px;
  left: -17px;
  width: 5px;
  border-radius: 0 4px 4px 0;
  background: var(--nm-lime);
  content: "";
}

.workspace-nav__icon {
  display: grid;
  width: 40px;
  height: 40px;
  place-content: center;
  border: 1px solid rgb(255 255 255 / 17%);
  border-radius: 11px;
  font-family: var(--nm-display);
  font-size: 1.06rem;
  font-weight: 750;
}

.workspace-nav button[aria-current="page"] .workspace-nav__icon {
  color: var(--nm-forest-950);
  border-color: var(--nm-lime);
  background: var(--nm-lime);
}

.workspace-nav__copy strong {
  display: block;
  font-size: 1rem;
}

.workspace-nav__copy small {
  display: block;
  margin-top: 2px;
  color: #9fb3ab;
  font-size: 0.875rem;
}

.workspace-nav button[aria-current="page"] small {
  color: #c8dad3;
}

.sidebar-evidence {
  margin: 14px 18px 20px;
  padding: 16px;
  border: 1px solid rgb(199 243 106 / 26%);
  border-radius: 14px;
  background: rgb(255 255 255 / 8%);
}

.sidebar-evidence__label {
  color: var(--nm-lime);
  font-size: 0.875rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.sidebar-evidence p {
  margin: 7px 0 13px;
  color: #c7d5d0;
  font-size: 0.875rem;
  line-height: 1.6;
}

.sidebar-evidence button {
  width: 100%;
  min-height: 42px;
  border: 1px solid rgb(255 255 255 / 25%);
  border-radius: 8px;
  color: #fff;
  background: transparent;
  font-weight: 750;
  cursor: pointer;
}

.sidebar-evidence button:hover {
  color: var(--nm-forest-950);
  border-color: var(--nm-lime);
  background: var(--nm-lime);
}

.product-stage {
  min-width: 0;
  min-height: 100vh;
}

.product-topbar {
  position: sticky;
  z-index: 30;
  top: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  align-items: center;
  min-height: 78px;
  padding: 12px clamp(20px, 3vw, 52px);
  border-bottom: 1px solid var(--nm-line);
  background: rgb(251 250 245 / 94%);
  backdrop-filter: blur(16px);
}

.breadcrumb {
  display: flex;
  gap: 9px;
  align-items: center;
  min-width: 0;
  color: var(--nm-ink-2);
  font-size: 0.94rem;
}

.breadcrumb strong {
  overflow: hidden;
  color: var(--nm-ink);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.breadcrumb__slash {
  color: var(--nm-line-strong);
}

.connection-readiness {
  display: flex;
  gap: 8px;
  align-items: center;
}

.connection-chip {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  min-height: 38px;
  padding: 7px 11px;
  border: 1px solid var(--nm-line);
  border-radius: 999px;
  color: var(--nm-ink-2);
  background: var(--nm-white);
  font-size: 0.875rem;
  font-weight: 750;
  cursor: pointer;
}

.connection-chip::before {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--nm-line-strong);
  content: "";
}

.connection-chip[data-readiness="available"]::before,
.connection-chip[data-readiness="ready"]::before,
.connection-chip[data-readiness="current"]::before {
  background: #2f8d6f;
  box-shadow: 0 0 0 4px rgb(47 141 111 / 12%);
}

.connection-chip[data-readiness="planned"]::before,
.connection-chip[data-readiness="unavailable"]::before {
  background: #b97814;
  box-shadow: 0 0 0 4px rgb(185 120 20 / 12%);
}

.connection-chip:hover {
  border-color: var(--nm-forest-700);
  color: var(--nm-forest-900);
}

.connection-more {
  display: grid;
  width: 38px;
  height: 38px;
  place-content: center;
  border: 1px solid var(--nm-line);
  border-radius: 50%;
  color: var(--nm-forest-900);
  background: var(--nm-white);
  font-weight: 850;
  cursor: pointer;
}

.product-workspace {
  padding: clamp(26px, 4vw, 58px) clamp(20px, 4vw, 58px) 72px;
}

.product-heading {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(270px, 0.42fr);
  gap: clamp(24px, 4vw, 72px);
  align-items: end;
  max-width: 1500px;
  margin: 0 auto 30px;
}

.product-heading__eyebrow {
  margin: 0 0 10px;
  color: var(--nm-coral-dark);
  font-size: 0.875rem;
  font-weight: 850;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.product-heading h1,
.product-heading h2 {
  margin: 0;
  font-family: var(--nm-display);
  font-size: clamp(2.2rem, 4.2vw, 4.8rem);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.04;
}

.product-heading__promise {
  max-width: 900px;
  margin: 18px 0 0;
  color: var(--nm-ink-2);
  font-size: clamp(1rem, 1.2vw, 1.18rem);
  line-height: 1.78;
}

.truth-card {
  padding: 19px 20px;
  border: 1px solid var(--nm-line);
  border-left: 4px solid var(--nm-forest-700);
  background: var(--nm-sheet);
  box-shadow: var(--nm-shadow-soft);
}

.truth-card__label {
  color: var(--nm-forest-800);
  font-size: 0.875rem;
  font-weight: 850;
}

.truth-card p {
  margin: 7px 0 0;
  color: var(--nm-ink-2);
  font-size: 0.94rem;
  line-height: 1.65;
}

.lifecycle-strip {
  display: flex;
  max-width: 1500px;
  margin: 0 auto 24px;
  overflow-x: auto;
  border: 1px solid var(--nm-line);
  border-radius: 14px;
  background: var(--nm-sheet);
  box-shadow: var(--nm-shadow-soft);
}

.lifecycle-step {
  position: relative;
  display: flex;
  flex: 1 0 180px;
  gap: 10px;
  align-items: center;
  min-height: 66px;
  padding: 12px 20px;
  border-right: 1px solid var(--nm-line);
}

.lifecycle-step:last-child {
  border-right: 0;
}

.lifecycle-step__index {
  display: grid;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  place-content: center;
  border: 1px solid var(--nm-forest-700);
  border-radius: 50%;
  color: var(--nm-forest-800);
  font-family: var(--nm-display);
  font-size: 0.875rem;
  font-weight: 800;
}

.lifecycle-step span:last-child {
  font-size: 0.9rem;
  font-weight: 750;
}

.surface-tabs {
  display: flex;
  gap: 5px;
  max-width: 1500px;
  margin: 0 auto;
  padding: 7px;
  overflow-x: auto;
  border: 1px solid var(--nm-line);
  border-radius: 14px;
  background: #e8e4da;
}

.surface-tabs button {
  flex: 1 0 148px;
  min-height: 48px;
  padding: 9px 14px;
  border: 0;
  border-radius: 9px;
  color: var(--nm-ink-2);
  background: transparent;
  font-weight: 750;
  cursor: pointer;
}

.surface-tabs button:hover {
  color: var(--nm-forest-900);
  background: rgb(255 255 255 / 58%);
}

.surface-tabs button[aria-selected="true"] {
  color: var(--nm-forest-950);
  background: var(--nm-white);
  box-shadow: 0 5px 16px rgb(14 55 47 / 9%);
}

.module-board {
  display: grid;
  grid-template-columns: minmax(235px, 0.68fr) minmax(500px, 1.75fr) minmax(270px, 0.75fr);
  gap: 17px;
  align-items: start;
  max-width: 1500px;
  margin: 17px auto 0;
}

.product-panel {
  min-width: 0;
  border: 1px solid var(--nm-line);
  border-radius: 14px;
  background: var(--nm-sheet);
  box-shadow: var(--nm-shadow-soft);
}

.panel-head {
  padding: 20px;
  border-bottom: 1px solid var(--nm-line);
}

.panel-head__eyebrow {
  display: block;
  margin-bottom: 5px;
  color: var(--nm-coral-dark);
  font-size: 0.875rem;
  font-weight: 850;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.panel-head h2,
.panel-head h3 {
  margin: 0;
  font-family: var(--nm-display);
  font-size: 1.42rem;
  font-weight: 650;
  line-height: 1.25;
}

.panel-head p {
  margin: 8px 0 0;
  color: var(--nm-ink-2);
  font-size: 0.94rem;
  line-height: 1.65;
}

.workspace-inline-action {
  padding: 0 20px 20px;
}

.capability-index {
  position: sticky;
  top: 96px;
  max-height: calc(100vh - 118px);
  overflow-y: auto;
  scrollbar-color: var(--nm-line-strong) transparent;
}

.capability-list {
  display: grid;
  margin: 0;
  padding: 0;
  list-style: none;
}

.capability-entry {
  position: relative;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 11px;
  width: 100%;
  min-height: 86px;
  padding: 16px 17px;
  border: 0;
  border-bottom: 1px solid var(--nm-line);
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.capability-entry:hover {
  background: var(--nm-forest-050);
}

.capability-entry[aria-current="true"] {
  background: var(--nm-forest-100);
}

.capability-entry[aria-current="true"]::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 5px;
  background: var(--nm-coral);
  content: "";
}

.capability-entry__index {
  color: var(--nm-coral-dark);
  font-family: var(--nm-display);
  font-size: 1.12rem;
  font-weight: 750;
}

.capability-entry__title {
  display: block;
  font-size: 0.94rem;
  font-weight: 800;
  line-height: 1.48;
}

.capability-entry__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  margin-top: 7px;
  color: #465a52;
  font-size: 0.875rem;
}

.module-canvas {
  min-height: 720px;
  overflow: hidden;
  background:
    linear-gradient(90deg, transparent 48px, rgb(228 92 69 / 7%) 48px, rgb(228 92 69 / 7%) 49px, transparent 49px),
    var(--nm-white);
}

.canvas-heading {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  align-items: start;
  padding: clamp(24px, 3vw, 42px);
  border-bottom: 1px solid var(--nm-line);
}

.canvas-heading h2 {
  margin: 5px 0 0;
  font-family: var(--nm-display);
  font-size: clamp(1.75rem, 2.7vw, 3.1rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.16;
}

.canvas-heading p {
  max-width: 780px;
  margin: 14px 0 0;
  color: var(--nm-ink-2);
}

.truth-badge {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  min-height: 34px;
  padding: 6px 10px;
  border: 1px solid currentcolor;
  border-radius: 999px;
  font-size: 0.875rem;
  font-weight: 800;
  white-space: nowrap;
}

.truth-badge::before {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentcolor;
  content: "";
}

.truth-badge--current,
.truth-badge--available {
  color: #176149;
  background: #dbefe6;
}

.truth-badge--partial,
.truth-badge--planned {
  color: var(--nm-blue);
  background: var(--nm-blue-soft);
}

.truth-badge--not-implemented,
.truth-badge--unavailable {
  color: var(--nm-coral-dark);
  background: var(--nm-coral-soft);
}

.truth-badge--external-dependent,
.truth-badge--deferred {
  color: var(--nm-amber);
  background: var(--nm-amber-soft);
}

.canvas-blueprint {
  padding: clamp(22px, 3vw, 40px);
  border-bottom: 1px solid var(--nm-line);
  background: rgb(242 239 231 / 58%);
}

.blueprint-label {
  margin: 0 0 14px;
  color: var(--nm-forest-800);
  font-size: 0.875rem;
  font-weight: 850;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.blueprint-flow {
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.blueprint-node {
  position: relative;
  flex: 1 0 140px;
  min-height: 72px;
  padding: 13px;
  border: 1px solid var(--nm-line);
  border-radius: 10px;
  background: var(--nm-white);
}

.blueprint-node + .blueprint-node::before {
  position: absolute;
  top: 50%;
  left: -9px;
  color: var(--nm-coral-dark);
  content: "→";
  transform: translate(-50%, -50%);
}

.blueprint-node strong {
  display: block;
  font-size: 0.92rem;
}

.blueprint-node small {
  display: block;
  margin-top: 5px;
  color: var(--nm-ink-2);
  font-size: 0.875rem;
  line-height: 1.45;
}

.capability-detail {
  padding: clamp(24px, 3vw, 44px);
}

.capability-detail__topline {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.capability-detail__id {
  color: var(--nm-coral-dark);
  font-size: 0.875rem;
  font-weight: 850;
  letter-spacing: 0.1em;
}

.capability-detail h3 {
  margin: 0;
  font-family: var(--nm-display);
  font-size: clamp(1.65rem, 2.5vw, 2.7rem);
  font-weight: 600;
  line-height: 1.2;
}

.capability-detail__outcome {
  margin: 15px 0 0;
  color: var(--nm-ink-2);
  font-size: 1.06rem;
  line-height: 1.8;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-top: 25px;
}

.detail-block {
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--nm-line);
  border-radius: 10px;
  background: var(--nm-sheet);
}

.detail-block h4 {
  margin: 0 0 10px;
  color: var(--nm-forest-800);
  font-size: 0.94rem;
}

.detail-block p {
  margin: 0;
  color: var(--nm-ink-2);
}

.object-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.object-pill {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  padding: 5px 9px;
  border: 1px solid var(--nm-line-strong);
  border-radius: 999px;
  background: var(--nm-white);
  font-size: 0.875rem;
  font-weight: 750;
}

.journey-list,
.condition-list {
  display: grid;
  gap: 9px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.journey-list li,
.condition-list li {
  position: relative;
  padding-left: 20px;
  color: var(--nm-ink-2);
  font-size: 0.94rem;
}

.journey-list li::before,
.condition-list li::before {
  position: absolute;
  top: 0.7em;
  left: 0;
  width: 8px;
  height: 2px;
  background: var(--nm-coral);
  content: "";
}

.capability-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 25px;
}

.product-button {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 10px 16px;
  border: 1px solid var(--nm-forest-900);
  border-radius: 9px;
  color: var(--nm-white);
  background: var(--nm-forest-900);
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
}

.product-button:hover {
  border-color: var(--nm-forest-700);
  background: var(--nm-forest-700);
}

.product-button--secondary {
  color: var(--nm-forest-900);
  background: var(--nm-white);
}

.product-button--secondary:hover {
  color: var(--nm-white);
}

.product-button--unavailable {
  color: #4e514d;
  border-color: var(--nm-line-strong);
  background: #e7e3da;
}

.product-button--unavailable:hover {
  color: #4e514d;
  border-color: var(--nm-line-strong);
  background: #ddd8cd;
}

.journey-rail {
  position: sticky;
  top: 96px;
  max-height: calc(100vh - 118px);
  overflow-y: auto;
}

.journey-rail__body {
  padding: 20px;
}

.rail-section + .rail-section {
  margin-top: 25px;
  padding-top: 22px;
  border-top: 1px solid var(--nm-line);
}

.rail-section h3 {
  margin: 0 0 11px;
  font-family: var(--nm-display);
  font-size: 1.2rem;
  font-weight: 650;
}

.rail-section p {
  margin: 0;
  color: var(--nm-ink-2);
  font-size: 0.94rem;
}

.handoff-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.handoff-card {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--nm-line);
  border-radius: 9px;
  background: var(--nm-white);
  text-align: left;
}

button.handoff-card {
  cursor: pointer;
}

button.handoff-card:hover {
  border-color: var(--nm-forest-700);
  background: var(--nm-forest-050);
}

.handoff-card strong {
  display: block;
  font-size: 0.92rem;
}

.handoff-card span {
  display: block;
  margin-top: 5px;
  color: var(--nm-ink-2);
  font-size: 0.875rem;
  line-height: 1.5;
}

.module-specific {
  margin-top: 16px;
}

.structure-board {
  display: grid;
  gap: 10px;
}

.structure-row {
  display: grid;
  grid-template-columns: minmax(130px, 0.45fr) minmax(0, 1.3fr) auto;
  gap: 14px;
  align-items: center;
  min-height: 68px;
  padding: 13px 15px;
  border: 1px solid var(--nm-line);
  border-radius: 9px;
  background: var(--nm-white);
}

.structure-row strong {
  font-size: 0.92rem;
}

.structure-row p {
  margin: 0;
  color: var(--nm-ink-2);
  font-size: 0.9rem;
}

.structure-state {
  color: var(--nm-forest-800);
  font-size: 0.875rem;
  font-weight: 800;
  white-space: nowrap;
}

.execution-preview {
  display: grid;
  grid-template-columns: 0.8fr minmax(0, 1.5fr) 0.8fr;
  gap: 10px;
}

.execution-column {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--nm-line);
  border-radius: 10px;
  background: var(--nm-white);
}

.execution-column h4 {
  margin: 0 0 10px;
  color: var(--nm-forest-800);
  font-size: 0.92rem;
}

.execution-column ul {
  display: grid;
  gap: 7px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.execution-column li {
  padding: 8px 9px;
  border-left: 3px solid var(--nm-line-strong);
  background: var(--nm-paper);
  font-size: 0.875rem;
}

.results-preview {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.result-boundary {
  min-height: 105px;
  padding: 15px;
  border: 1px solid var(--nm-line);
  border-radius: 10px;
  background: var(--nm-white);
}

.result-boundary strong {
  display: block;
  font-size: 0.94rem;
}

.result-boundary p {
  margin: 6px 0 0;
  color: var(--nm-ink-2);
  font-size: 0.875rem;
}

.unavailable-note {
  padding: 14px 16px;
  border: 1px solid #d6b27b;
  border-left: 4px solid var(--nm-amber);
  border-radius: 7px;
  color: #593f18;
  background: var(--nm-amber-soft);
  font-size: 0.94rem;
}

.product-footer {
  max-width: 1500px;
  margin: 22px auto 0;
  padding: 20px 2px;
  color: var(--nm-ink-2);
  font-size: 0.875rem;
}

.product-footer strong {
  color: var(--nm-ink);
}

.product-dialog {
  width: min(720px, 100vw);
  max-width: none;
  height: 100dvh;
  max-height: none;
  margin: 0 0 0 auto;
  padding: 0;
  overflow: hidden;
  border: 0;
  color: var(--nm-ink);
  background: var(--nm-white);
  box-shadow: -30px 0 90px rgb(8 47 40 / 26%);
}

.product-dialog[open] {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  animation: drawer-shift 190ms ease-out;
}

.product-dialog::backdrop {
  background: rgb(8 47 40 / 58%);
  backdrop-filter: blur(2px);
}

@keyframes drawer-shift {
  from {
    transform: translateX(26px);
  }

  to {
    transform: translateX(0);
  }
}

.dialog-head {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  justify-content: space-between;
  padding: 27px clamp(22px, 4vw, 42px);
  border-bottom: 1px solid var(--nm-line);
  background: var(--nm-paper);
}

.dialog-head__eyebrow {
  margin: 0 0 5px;
  color: #762016;
  font-size: 0.875rem;
  font-weight: 850;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.dialog-head h2 {
  margin: 0;
  font-family: var(--nm-display);
  font-size: clamp(1.55rem, 3vw, 2.3rem);
  font-weight: 600;
  line-height: 1.22;
}

.dialog-close {
  display: grid;
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  place-content: center;
  border: 1px solid var(--nm-line-strong);
  border-radius: 50%;
  color: var(--nm-forest-950);
  background: var(--nm-white);
  font-size: 1.35rem;
  cursor: pointer;
}

.dialog-close:hover {
  color: var(--nm-white);
  border-color: var(--nm-forest-900);
  background: var(--nm-forest-900);
}

.dialog-body {
  padding: 28px clamp(22px, 4vw, 42px) 42px;
  overflow-y: auto;
}

.dialog-section + .dialog-section {
  margin-top: 27px;
  padding-top: 24px;
  border-top: 1px solid var(--nm-line);
}

.dialog-section h3 {
  margin: 0 0 12px;
  font-family: var(--nm-display);
  font-size: 1.25rem;
  font-weight: 650;
}

.dialog-section p,
.dialog-section li {
  font-size: 1rem;
  line-height: 1.75;
}

.dialog-section ul {
  margin: 0;
  padding-left: 21px;
}

.dialog-section li + li {
  margin-top: 8px;
}

.dialog-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
  padding: 17px clamp(22px, 4vw, 42px);
  border-top: 1px solid var(--nm-line);
  background: var(--nm-paper);
}

.dialog-foot .product-button {
  color: var(--nm-white);
  border-color: var(--nm-forest-950);
  background: var(--nm-forest-950);
}

.dialog-foot .product-button--secondary {
  color: var(--nm-forest-950);
  background: var(--nm-white);
}

.connection-ledger {
  display: grid;
  gap: 10px;
}

.connection-row {
  display: grid;
  grid-template-columns: minmax(0, 0.6fr) minmax(0, 1.4fr) auto;
  gap: 15px;
  align-items: center;
  padding: 17px;
  border: 1px solid var(--nm-line);
  border-radius: 10px;
  background: var(--nm-sheet);
}

.connection-row strong {
  font-size: 1rem;
}

.connection-row p {
  margin: 0;
  color: var(--nm-ink-2);
  font-size: 0.94rem;
}

.audit-index {
  display: grid;
  gap: 8px;
}

.audit-index button {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  gap: 11px;
  align-items: center;
  width: 100%;
  padding: 12px;
  border: 1px solid var(--nm-line);
  border-radius: 9px;
  background: var(--nm-sheet);
  text-align: left;
  cursor: pointer;
}

.audit-index button:hover,
.audit-index button[aria-current="true"] {
  border-color: var(--nm-forest-700);
  background: var(--nm-forest-050);
}

.audit-index__number {
  color: var(--nm-coral-dark);
  font-family: var(--nm-display);
  font-size: 1.05rem;
}

.audit-index__title {
  font-size: 0.92rem;
  font-weight: 750;
}

.audit-index__state {
  color: var(--nm-ink-2);
  font-size: 0.875rem;
}

.audit-evidence-detail {
  padding-top: 24px;
}

.audit-evidence-detail h3 {
  margin: 0 0 10px;
  font-family: var(--nm-display);
  font-size: 1.38rem;
}

.audit-evidence-list {
  display: grid;
  gap: 9px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.audit-evidence-list li {
  position: relative;
  padding-left: 21px;
}

.audit-evidence-list li::before {
  position: absolute;
  top: 0.72em;
  left: 0;
  width: 8px;
  height: 2px;
  background: var(--nm-coral);
  content: "";
}

.truth-badge--next {
  border-color: #b9cde2;
  color: var(--nm-blue);
  background: var(--nm-blue-soft);
}

.truth-badge--provider-dependent {
  border-color: #dec78f;
  color: #4f3200;
  background: var(--nm-amber-soft);
}

.connection-chip[data-readiness="next"]::before,
.connection-chip[data-readiness="provider-dependent"]::before {
  background: #d99b32;
}

.native-module-workspace {
  display: grid;
  gap: 20px;
}

.overview-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.overview-card {
  display: flex;
  min-height: 310px;
  padding: 25px;
  flex-direction: column;
  border: 1px solid var(--nm-line);
  border-radius: 16px;
  background: var(--nm-white);
  box-shadow: var(--nm-shadow-soft);
}

.overview-card.is-active {
  border-color: var(--nm-forest-700);
  box-shadow:
    inset 4px 0 0 var(--nm-forest-700),
    var(--nm-shadow-soft);
}

.overview-card__topline {
  display: flex;
  margin-bottom: 18px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.overview-card__topline > span:first-child {
  color: #5c2118;
  font-size: 0.82rem;
  font-weight: 900;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.overview-card h2 {
  margin: 0;
  font-family: var(--nm-display);
  font-size: clamp(1.55rem, 2.2vw, 2.15rem);
  font-weight: 600;
  line-height: 1.15;
}

.overview-card > p {
  margin: 14px 0 18px;
  color: var(--nm-ink-2);
}

.overview-card > .product-button {
  width: 100%;
  margin-top: auto;
}

.profile-summary,
.brief-grid,
.metadata-grid {
  display: grid;
  margin: 0 0 18px;
  gap: 0;
}

.profile-summary div,
.brief-grid div,
.metadata-grid div {
  display: grid;
  grid-template-columns: minmax(110px, 0.35fr) minmax(0, 1fr);
  gap: 14px;
  padding: 10px 0;
  border-top: 1px solid var(--nm-line);
}

.profile-summary dt,
.brief-grid dt,
.metadata-grid dt {
  color: var(--nm-ink-3);
  font-weight: 700;
}

.profile-summary dd,
.brief-grid dd,
.metadata-grid dd {
  margin: 0;
  font-weight: 650;
}

.connector-summary {
  display: flex;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 8px;
}

.connector-summary span {
  display: inline-flex;
  padding: 7px 10px;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--nm-line);
  border-radius: 999px;
  background: var(--nm-sheet);
}

.connector-summary b {
  color: var(--nm-forest-700);
  font-size: 0.78rem;
}

.honest-empty {
  padding: 12px 14px;
  border: 1px dashed var(--nm-line-strong);
  border-radius: 9px;
  color: var(--nm-ink-2);
  background: #f5f2eb;
}

.honest-empty--large {
  display: grid;
  min-height: 230px;
  padding: 34px;
  place-content: center;
  text-align: center;
}

.honest-empty--large strong {
  font-family: var(--nm-display);
  font-size: 1.75rem;
  font-weight: 600;
}

.honest-empty--large p {
  max-width: 760px;
  margin: 10px auto 20px;
  color: var(--nm-ink-2);
}

.honest-empty--large .product-button {
  justify-self: center;
}

.overview-grid__workflow,
.execution-workspace__workflow,
.results-workspace__workflow {
  grid-column: 1 / -1;
}

.native-function-workspace {
  display: grid;
  grid-template-columns: minmax(255px, 0.72fr) minmax(0, 1.7fr);
  gap: 18px;
}

.native-entry-panel {
  align-self: stretch;
  overflow: hidden;
}

.native-entry-list {
  display: grid;
}

.native-entry-list .capability-entry {
  grid-template-columns: 12px minmax(0, 1fr);
}

.native-entry-dot {
  width: 9px;
  height: 9px;
  margin-top: 8px;
  border-radius: 50%;
  background: var(--nm-blue);
}

.native-entry-dot--current {
  background: #3aa998;
}

.native-entry-dot--next {
  background: #5f88bb;
}

.native-entry-dot--provider-dependent {
  background: #d99b32;
}

.native-detail {
  min-height: 100%;
  border: 1px solid var(--nm-line);
  border-radius: 15px;
  background:
    linear-gradient(140deg, rgb(217 233 227 / 42%), transparent 38%),
    var(--nm-white);
  box-shadow: var(--nm-shadow-soft);
}

.native-detail .detail-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.native-detail .detail-block {
  min-height: 155px;
}

.object-workspace,
.results-workspace {
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--nm-line);
  border-radius: 16px;
  background: var(--nm-white);
  box-shadow: var(--nm-shadow-soft);
}

.object-workspace__head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 24px;
  padding: 25px 27px;
  align-items: start;
  border-bottom: 1px solid var(--nm-line);
}

.object-workspace__head h2 {
  margin: 5px 0 8px;
  font-family: var(--nm-display);
  font-size: clamp(1.8rem, 3vw, 2.65rem);
  font-weight: 600;
  line-height: 1.08;
}

.object-workspace__head p {
  max-width: 820px;
  margin: 0;
  color: var(--nm-ink-2);
}

.object-table {
  padding: 0 0 22px;
}

.object-table__head {
  display: grid;
  grid-template-columns: 1.35fr 0.85fr 0.9fr 1fr;
  padding: 13px 25px;
  gap: 14px;
  border-bottom: 1px solid var(--nm-line);
  color: var(--nm-ink-3);
  background: #f7f4ed;
  font-size: 0.82rem;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.object-table .honest-empty {
  margin: 22px;
}

.object-workspace__workflow {
  padding: 0 22px 24px;
}

.section-action-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  overflow: hidden;
  border: 1px solid var(--nm-line);
  border-radius: 14px;
  background: var(--nm-white);
}

.section-action-bar > div {
  display: grid;
  padding: 14px;
  align-content: space-between;
  gap: 11px;
  border-right: 1px solid var(--nm-line);
  border-bottom: 1px solid var(--nm-line);
}

.section-action-bar > div.is-active {
  background: var(--nm-forest-050);
}

.section-action-bar > div > span {
  color: var(--nm-ink-2);
  font-size: 0.86rem;
  font-weight: 800;
}

.section-action-bar .product-button {
  min-height: 42px;
  padding: 9px 12px;
  justify-content: center;
  text-align: center;
}

.execution-workspace {
  display: grid;
  grid-template-columns: minmax(235px, 0.62fr) minmax(0, 1.75fr);
  gap: 18px;
}

.work-queue,
.deliverable-canvas {
  min-width: 0;
}

.deliverable-tabs {
  display: grid;
}

.deliverable-tabs button {
  display: grid;
  width: 100%;
  padding: 14px 16px;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  border: 0;
  border-top: 1px solid var(--nm-line);
  color: var(--nm-ink-2);
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.deliverable-tabs button[aria-selected="true"] {
  color: var(--nm-forest-900);
  background: var(--nm-forest-100);
  box-shadow: inset 4px 0 0 #3aa998;
}

.deliverable-tabs button span {
  font-weight: 800;
}

.deliverable-tabs button small {
  color: #4f3200;
  font-weight: 800;
}

.workspace-inline-action {
  padding: 0 16px 16px;
}

.workspace-inline-action .product-button {
  width: 100%;
}

.deliverable-canvas {
  padding: 0;
}

.deliverable-document {
  padding: clamp(24px, 4vw, 48px);
}

.deliverable-document__status {
  display: inline-flex;
  margin-bottom: 18px;
  padding: 6px 11px;
  border-radius: 999px;
  color: #4f3200;
  border: 1px solid #cfa55b;
  background: var(--nm-amber-soft);
  font-size: 0.84rem;
  font-weight: 900;
}

.deliverable-document h2 {
  max-width: 950px;
  margin: 0 0 20px;
  font-family: var(--nm-display);
  font-size: clamp(2rem, 4vw, 3.35rem);
  font-weight: 600;
  line-height: 1.08;
}

.deliverable-document h3 {
  margin: 32px 0 8px;
  font-family: var(--nm-display);
  font-size: 1.55rem;
}

.deliverable-document p {
  max-width: 860px;
  color: var(--nm-ink-2);
}

.deliverable-lede {
  padding: 18px 20px;
  border-left: 4px solid #3aa998;
  background: var(--nm-forest-050);
  font-size: 1.12rem !important;
}

.draft-cta {
  margin-top: 30px;
  padding: 18px 20px;
  border: 1px solid var(--nm-line);
  background: #f7f4ed;
  font-weight: 750;
}

.ticket-section pre {
  max-width: 100%;
  overflow-x: auto;
  padding: 18px;
  border-radius: 9px;
  color: #dcece7;
  background: var(--nm-forest-950);
  font-size: 0.9rem;
  line-height: 1.65;
}

.delivery-governance--inline {
  display: grid;
  margin-top: 40px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding-top: 28px;
  border-top: 1px solid var(--nm-line);
}

.delivery-governance--inline .panel-head {
  grid-column: 1 / -1;
}

.delivery-check {
  display: grid;
  padding: 15px;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px 12px;
  border: 1px solid var(--nm-line);
  border-radius: 10px;
  background: #f8f5ee;
}

.delivery-check strong {
  font-weight: 850;
}

.delivery-check > span {
  color: var(--nm-amber);
  font-size: 0.8rem;
  font-weight: 900;
}

.delivery-check p {
  grid-column: 1 / -1;
  margin: 0;
}

.results-workspace {
  padding-bottom: 22px;
}

.comparison-skeleton {

    <script>
(function startNevermoreIntegratedProduct(global) {
  "use strict";

  const PRODUCT_VIEW_IDS = ["overview", "growth-map", "execution", "results"];
  const VIEW_ICONS = {

  const VIEW_SUBTITLES = {

    execution: "审核并处理交付物",
    results: "改前 / 改后与证据",
  };
  const TRUTH_LABELS = {
    current: "当前可用",
    next: "尚未启用",
    "provider-dependent": "需接入数据源",
    partial: "部分存在",
    planned: "已规划 · 待落地",
    unavailable: "当前不可用",
    "not-implemented": "尚未实现",
    "external-dependent": "依赖外部接入",
  };
  const CONNECTION_ORDER = ["gsc", "ga4", "github"];
  const DELIVERABLE_IDS = [
    "english-blog",
    "content-brief",
    "metadata",
    "technical-ticket-code-patch",
  ];
  const NATIVE_ENTRY_IDS = {
    "topic-governance": "topic-review",
    "keyword-relation-governance": "keyword-relationship-review",
    "voc-source-governance": "source-readiness",
    "artifact-source-provenance": "deliverable-sources",
    "action-blocker": "blocked-task",
    "action-business-progress": "task-progress",
    "opportunity-decision-sla": "pending-opportunity",
    "internal-link-graph": "internal-link-opportunity",
    "keyword-rank-history": "keyword-observation",
    "content-decay-monitor": "content-health-alert",
    "backlink-evidence": "backlink-readiness",
    "geo-citation-observation": "geo-evidence",
    "competitor-delta-monitor": "competitor-change",
  };
  const DEFAULT_STATE = {
    view: "overview",
    surface: "",
    entryId: "",
    capabilityId: "",
    deliverable: DELIVERABLE_IDS[0],
    target: "",
    drawer: "",
    auditRequirementId: 0,
  };

  let audit;
  let product;
  let app;
  let state = { ...DEFAULT_STATE };
  let dialogInvoker = null;

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function text(value, fallback = "未提供") {
    const normalized = String(value ?? "").trim();
    return normalized || fallback;
  }

  function list(value) {
    if (Array.isArray(value)) {
      return value.filter((item) => item !== null && item !== undefined);
    }
    if (value === null || value === undefined || value === "") {
      return [];
    }
    return [value];
  }

  function itemLabel(item) {
    if (typeof item === "string" || typeof item === "number") {
      const canonicalObject = list(product?.canonicalObjects).find(
        (object) => object.id === String(item),
      );
      return text(canonicalObject?.name ?? item);
    }
    if (item && typeof item === "object") {
      return text(
        item.label ??
          item.name ??
          item.title ??
          item.trigger ??
          item.surface ??
          item.description ??
          item.purpose ??
          item.carries,
      );
    }
    return "未提供";
  }

  function renderList(items, className = "condition-list") {
    const normalized = list(items);
    if (normalized.length === 0) {
      return '<p data-reading-text>当前没有额外条目。</p>';
    }
    return `<ul class="${escapeHtml(className)}">${normalized
      .map((item) => `<li data-reading-text>${escapeHtml(itemLabel(item))}</li>`)
      .join("")}</ul>`;
  }

  function moduleById(moduleId) {
    return product.modules.find((module) => module.id === moduleId) ?? null;
  }

  function sectionById(module, sectionId) {
    return (
      list(module?.mainSections).find((section) => section.id === sectionId) ??
      null
    );
  }

  function capabilityById(capabilityId) {
    return (
      product.capabilities.find(
        (capability) => capability.id === String(capabilityId),
      ) ?? null
    );
  }

  function nativeEntryId(capability) {
    return (
      NATIVE_ENTRY_IDS[capability?.id] ??
      `workspace-item-${capability?.requirementId ?? "unknown"}`
    );
  }

  function capabilityByEntryId(entryId) {
    return (
      product.capabilities.find(
        (capability) => nativeEntryId(capability) === String(entryId),
      ) ?? null
    );
  }

  function requirementById(requirementId) {
    return (
      audit.requirements.find(
        (requirement) => requirement.id === Number(requirementId),
      ) ?? null
    );
  }

  function capabilityForRequirement(requirementId) {
    return (
      product.capabilities.find(
        (capability) =>
          capability.requirementId === Number(requirementId),
      ) ?? null
    );
  }

  function capabilityIdsForSection(module, section) {
    const sectionIds = list(section?.capabilityIds).map(String);
    if (sectionIds.length > 0) {
      return sectionIds;
    }
    return list(module?.capabilityIds).map(String);
  }

  function capabilitiesForSection(module, section) {
    const ids = new Set(capabilityIdsForSection(module, section));
    return product.capabilities.filter((capability) => ids.has(capability.id));
  }

  function capabilitiesForModule(module) {
    const primaryCapabilities = product.capabilities.filter(
      (capability) => capability.primaryModule === module?.id,
    );
    if (primaryCapabilities.length > 0) {
      return primaryCapabilities;
    }
    const ids = new Set(list(module?.capabilityIds).map(String));
    return product.capabilities.filter((capability) => ids.has(capability.id));
  }

  function firstSection(module) {
    return list(module?.mainSections)[0] ?? null;
  }

  function firstCapability(module, section) {
    return (
      capabilitiesForSection(module, section)[0] ??
      capabilitiesForModule(module)[0] ??
      null
    );
  }

  function truthLabel(status) {
    return TRUTH_LABELS[status] ?? text(status);
  }

  function truthDescription(status) {
    const productState = product.truthStates?.[status];
    if (typeof productState === "string") {
      return productState;
    }
    if (productState && typeof productState === "object") {
      return text(
        productState.description ?? productState.label ?? productState.name,
        truthLabel(status),
      );
    }
    return truthLabel(status);
  }

  function truthBadge(status) {
    return `<span class="truth-badge truth-badge--${escapeHtml(
      status,
    )}">${escapeHtml(truthLabel(status))}</span>`;
  }

  function deliveryStageLabel(stage) {
    const normalized = text(stage, "");
    const labels = {
      "stage-1": "已纳入本期范围",
      "stage-2": "进入后续迭代",
      "stage-3": "依赖外部条件",
    };
    return labels[normalized] ?? normalized;
  }

  function normalizeConnectionId(value) {
    return String(value ?? "")
      .trim()
      .toLowerCase()
      .replaceAll("google search console", "gsc")
      .replaceAll("google analytics 4", "ga4");
  }

  function connections() {
    const policy = product.connectorPolicy ?? audit.connectorPolicy ?? {};
    const candidates = Array.isArray(policy)
      ? policy
      : list(
          policy.connections ??
            policy.customerVisibleConnections ??
            policy.connectors ??
            policy.items,
        );

    const normalized = candidates
      .map((connection) => {
        if (typeof connection === "string") {
          const id = normalizeConnectionId(connection);
          return {
            id,
            name: connection,
            purpose: "客户可见数据连接",
            readiness: "next",
            unavailableText: "连接状态需由项目实际授权确认。",
          };
        }
        const id = normalizeConnectionId(
          connection.id ?? connection.name ?? connection.label,
        );
        return {
          ...connection,
          id,
          name: text(
            connection.name ?? connection.label,
            id.toUpperCase(),
          ),
          purpose: text(
            connection.purpose,
            "客户可见数据连接",
          ),
          truthStatus: text(
            connection.truthStatus ?? connection.status,
            "next",
          ),
          readiness: text(
            connection.readiness,
            "需要完成项目级授权与 Scope 校验。",
          ),
          unavailableText: text(
            connection.unavailableText,
            "尚未具备可验证的连接状态。",
          ),
        };
      })
      .filter((connection) => CONNECTION_ORDER.includes(connection.id));

    return CONNECTION_ORDER.map((id) =>
      normalized.find((connection) => connection.id === id),
    ).filter(Boolean);
  }

  function lifecycleSteps() {
    return list(product.lifecycle).map((step, index) => {
      if (typeof step === "string") {
        return { id: `lifecycle-${index + 1}`, label: step };
      }
      return {
        id: text(step.id, `lifecycle-${index + 1}`),
        label: text(
          step.label ?? step.name ?? step.title,
          `阶段 ${index + 1}`,
        ),
      };
    });
  }

  function encodeDestination(destination) {
    if (!destination) {
      return "";
    }
    const kind = text(destination.kind, "view");
    const target = text(destination.target, "current");
    return `${kind}:${target}`;
  }

  function primaryAction(record) {
    const action = record?.primaryAction;
    if (!action || !action.destination) {
      return null;
    }
    return {
      id: text(action.id),
      label: text(action.label),
      destination: action.destination,
      encodedDestination: encodeDestination(action.destination),
    };
  }

  function findDestinationRoute(destination) {
    const target = text(destination?.target, "");
    const kind = text(destination?.kind, "");

    if (
      ["audit", "audit-evidence", "evidence", "secondary-evidence"].includes(
        kind,
      )
    ) {
      return { drawer: "audit" };
    }
    if (["connections", "connection"].includes(kind)) {
      return { drawer: "connections" };
    }

    const directModule = moduleById(target);
    if (directModule) {
      return {
        view: directModule.id,
        surface: firstSection(directModule)?.id ?? "",
      };
    }

    for (const module of product.modules) {
      const directSection = sectionById(module, target);
      if (directSection) {
        return { view: module.id, surface: directSection.id };
      }
    }

    const tokens = target.split(/[/:#]/).filter(Boolean);
    const routedModule = tokens.map(moduleById).find(Boolean);
    if (routedModule) {
      const routedSection =
        tokens.map((token) => sectionById(routedModule, token)).find(Boolean) ??
        firstSection(routedModule);
      return {
        view: routedModule.id,
        surface: routedSection?.id ?? "",
      };
    }

    for (const module of product.modules) {
      const routedSection = tokens
        .map((token) => sectionById(module, token))
        .find(Boolean);
      if (routedSection) {
        return { view: module.id, surface: routedSection.id };
      }
    }

    return {};
  }

  function normalizeState(candidate) {
    const view = PRODUCT_VIEW_IDS.includes(candidate.view)
      ? candidate.view
      : "overview";
    const module = moduleById(view) ?? product.modules[0];
    const requestedSurface =
      view === "growth-map" && candidate.object
        ? candidate.object
        : candidate.surface;
    const section =
      sectionById(module, requestedSurface) ?? firstSection(module);
    const moduleCapabilities = capabilitiesForModule(module);
    const sectionCapabilities = capabilitiesForSection(module, section);
    const requestedCapability =
      capabilityByEntryId(candidate.entryId) ??
      capabilityById(candidate.capabilityId);
    const selectedCapability =
      requestedCapability &&
      sectionCapabilities.some(
        (capability) => capability.id === requestedCapability.id,
      )
        ? requestedCapability
        : sectionCapabilities[0] ??
          moduleCapabilities[0] ??
          capabilityById(list(module.capabilityIds)[0]) ??
          product.capabilities[0];

    return {
      view: module.id,
      surface: section?.id ?? "",
      entryId: selectedCapability ? nativeEntryId(selectedCapability) : "",
      capabilityId: selectedCapability?.id ?? "",
      deliverable: DELIVERABLE_IDS.includes(candidate.deliverable)
        ? candidate.deliverable
        : DELIVERABLE_IDS[0],
      target: text(candidate.target, ""),
      drawer: ["audit", "connections"].includes(candidate.drawer)
        ? candidate.drawer
        : "",
      auditRequirementId: requirementById(candidate.auditRequirementId)
        ? Number(candidate.auditRequirementId)
        : selectedCapability?.requirementId ?? audit.requirements[0].id,
    };
  }

  function parseHash() {
    const rawHash = global.location.hash.replace(/^#\/?/, "");
    const [rawView = "", rawQuery = ""] = rawHash.split("?");
    const params = new URLSearchParams(rawQuery);

    if (["requirements", "modules", "stages", "acceptance"].includes(rawView)) {
      const requirementId = Number(
        params.get("item") ?? audit.requirements[0].id,
      );
      const capability =
        capabilityForRequirement(requirementId) ?? product.capabilities[0];
      const module =
        moduleById(capability.primaryModule) ?? product.modules[0];
      const section =
        list(module.mainSections).find((item) =>
          list(item.capabilityIds).includes(capability.id),
        ) ?? firstSection(module);
      return normalizeState({
        view: module.id,
        surface: section?.id,
        entryId: nativeEntryId(capability),
        target: "",
        drawer: rawView === "requirements" ? "audit" : "",
        auditRequirementId: requirementId,
      });
    }

    return normalizeState({
      view: rawView || "overview",
      surface: params.get("surface") ?? "",
      object: params.get("object") ?? "",
      entryId: params.get("entry") ?? "",
      deliverable: params.get("deliverable") ?? DELIVERABLE_IDS[0],
      target: params.get("target") ?? "",
      drawer: params.get("drawer") ?? "",
      auditRequirementId: Number(params.get("audit") ?? 0),
    });
  }

  function stateHash(candidate) {
    const params = new URLSearchParams();
    params.set("surface", candidate.surface);
    if (candidate.view === "growth-map") {
      params.set("object", candidate.surface);
    }
    if (candidate.entryId) {
      params.set("entry", String(candidate.entryId));
    }
    if (
      candidate.view === "execution" &&
      DELIVERABLE_IDS.includes(candidate.deliverable)
    ) {
      params.set("deliverable", candidate.deliverable);
    }
    if (candidate.target) {
      params.set("target", candidate.target);
    }
    if (candidate.drawer) {
      params.set("drawer", candidate.drawer);
    }
    if (candidate.drawer === "audit" && candidate.auditRequirementId) {
      params.set("audit", String(candidate.auditRequirementId));
    }
    return `#/${candidate.view}?${params.toString()}`;
  }

  function commitState(patch, options = {}) {
    const nextState = normalizeState({ ...state, ...patch });
    const nextHash = stateHash(nextState);
    state = nextState;

    if (global.location.hash === nextHash) {
      render();
      return;
    }
    if (options.replace) {
      global.history.replaceState(null, "", nextHash);
      render();
      return;
    }
    global.location.hash = nextHash;
    render();
  }

    return `

        ${steps
          .map(
            (step, index) => `
              <div class="lifecycle-step">

                  index + 1,

          )
          .join("")}
      </div>
    `;
  }

  function dialogIsOpen(dialog) {
    return Boolean(dialog?.open || dialog?.hasAttribute("open"));
  }

  function focusableIn(dialog) {
    return Array.from(
      dialog.querySelectorAll(
        'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])',
      ),
    );
  }

  function openDialog(dialog) {
    if (!dialog || dialogIsOpen(dialog)) {
      return;
    }
    if (typeof dialog.showModal === "function") {
      dialog.showModal();
    } else {
      dialog.setAttribute("open", "");
    }
    const focusFirst = () => focusableIn(dialog)[0]?.focus();
    if (typeof global.requestAnimationFrame === "function") {
      global.requestAnimationFrame(focusFirst);
    } else {
      focusFirst();
    }
  }

  function closeDialogElement(dialog, restoreFocus = false) {
    if (!dialog || !dialogIsOpen(dialog)) {
      return;
    }
    if (typeof dialog.close === "function") {
      dialog.close();
    } else {
      dialog.removeAttribute("open");
    }
    if (restoreFocus && dialogInvoker?.focus) {
      dialogInvoker.focus();
      dialogInvoker = null;
    }
  }

  function syncDialogs() {
    const connectionsDialog = document.querySelector(
      "[data-connections-dialog]",
    );
    const auditDialog = document.querySelector(
      "[data-audit-evidence-dialog]",
    );

    if (state.drawer === "connections") {
      closeDialogElement(auditDialog);
      renderConnectionsDialog();
      openDialog(connectionsDialog);
      return;
    }
    if (state.drawer === "audit") {
      closeDialogElement(connectionsDialog);
      renderAuditDialog();
      openDialog(auditDialog);
      return;
    }

    const hadOpenDialog =
      dialogIsOpen(connectionsDialog) || dialogIsOpen(auditDialog);
    closeDialogElement(connectionsDialog);
    closeDialogElement(auditDialog);
    if (hadOpenDialog && dialogInvoker?.focus) {
      dialogInvoker.focus();
      dialogInvoker = null;
    }
  }

          button.setAttribute("aria-current", "page");

    renderProductView();
    syncDialogs();
    app.dataset.ready = "true";

  function handleProductAction(target) {
    const encodedDestination = text(
      target.dataset.governedDestination,
      "",
    );
    const [kind = "", ...targetParts] = encodedDestination.split(":");
    const destinationTarget = targetParts.join(":");
    const destination = { kind, target: destinationTarget };
    const route = findDestinationRoute(destination);
    const entryId = text(target.dataset.entryId ?? state.entryId, "");
    const capability = capabilityByEntryId(entryId);

    if (route.drawer === "audit") {
      dialogInvoker = target;
      commitState({
        drawer: "audit",
        auditRequirementId:
          Number(target.dataset.auditRequirement) ||
          capability?.requirementId ||
          state.auditRequirementId,
        target: encodedDestination,
      });
      return;
    }
    if (route.drawer === "connections") {
      dialogInvoker = target;
      commitState({ drawer: "connections", target: encodedDestination });
      return;
    }

    const patch = {
      ...route,
      entryId,
      target: encodedDestination,
      drawer: "",
    };
    if (route.view && route.surface) {
      const routedModule = moduleById(route.view);
      const routedSection = sectionById(routedModule, route.surface);
      const matchingCapability = capabilitiesForSection(
        routedModule,
        routedSection,
      ).find(
        (item) => item.requirementId === capability?.requirementId,
      );
      patch.entryId = matchingCapability
        ? nativeEntryId(matchingCapability)
        : nativeEntryId(firstCapability(routedModule, routedSection));
    }
    commitState(patch);
  }

  function handleClick(event) {
    const dialog = event.target.closest("dialog");
    if (dialog && event.target === dialog) {
      commitState({ drawer: "" }, { replace: true });
      return;
    }

    const target = event.target.closest("[data-action]");
    if (!target || !app.contains(target)) {
      return;
    }

    const action = target.dataset.action;
    if (action === "set-product-view") {
      const module = moduleById(target.dataset.productView);
      const section = firstSection(module);
      commitState({
        view: module.id,
        surface: section?.id ?? "",
        entryId: nativeEntryId(firstCapability(module, section)),
        target: "",
        drawer: "",
      });
      return;
    }
    if (action === "set-surface") {
      const module = moduleById(state.view);
      const section = sectionById(module, target.dataset.sectionId);
      commitState({
        surface: section.id,
        entryId: nativeEntryId(firstCapability(module, section)),
        target: "",
        drawer: "",
      });
      return;
    }
    if (action === "select-native-entry") {
      commitState({
        entryId: text(target.dataset.entryId, ""),
        target: "",
        drawer: "",
      });
      return;
    }
    if (action === "select-deliverable") {
      commitState({
        deliverable: text(target.dataset.deliverableSelect, DELIVERABLE_IDS[0]),
        target: "",
        drawer: "",
      });
      return;
    }
    if (action === "run-product-action") {
      handleProductAction(target);
      return;
    }
    if (action === "open-connections") {
      dialogInvoker = target;
      commitState({
        drawer: "connections",
        target: target.dataset.governedDestination,
      });
      return;
    }
    if (action === "open-audit-evidence") {
      const capability = capabilityByEntryId(state.entryId);
      dialogInvoker = target;
      commitState({
        drawer: "audit",
        auditRequirementId:
          Number(target.dataset.auditRequirement) ||
          capability?.requirementId ||
          state.auditRequirementId,
        target: target.dataset.governedDestination,
      });
      return;
    }
    if (action === "select-audit-requirement") {
      commitState({
        drawer: "audit",
        auditRequirementId: Number(target.dataset.auditRequirementId),
      });
      return;
    }
    if (action === "close-dialog") {
      commitState({ drawer: "" }, { replace: true });
    }
  }

  function handleKeydown(event) {
    const surfaceTab = event.target.closest?.(
      '[role="tab"][data-section-id]',
    );
    if (
      surfaceTab &&
      ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)
    ) {
      const tabs = Array.from(
        surfaceTab
          .closest('[role="tablist"]')
          ?.querySelectorAll('[role="tab"][data-section-id]') ?? [],
      );
      const currentIndex = tabs.indexOf(surfaceTab);
      if (currentIndex >= 0 && tabs.length > 0) {
        event.preventDefault();
        let nextIndex = currentIndex;
        if (event.key === "ArrowRight") {
          nextIndex = (currentIndex + 1) % tabs.length;
        } else if (event.key === "ArrowLeft") {
          nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
        } else if (event.key === "Home") {
          nextIndex = 0;
        } else if (event.key === "End") {
          nextIndex = tabs.length - 1;
        }
        const nextSectionId = tabs[nextIndex].dataset.sectionId;
        const module = moduleById(state.view);
        const nextSection = sectionById(module, nextSectionId);
        commitState({
          surface: nextSectionId,
          entryId: nativeEntryId(firstCapability(module, nextSection)),
          target: "",
          drawer: "",
        });
        global.requestAnimationFrame?.(() => {
          document
            .querySelector(
              `[role="tab"][data-section-id="${nextSectionId}"]`,
            )
            ?.focus();
        });
        return;
      }
    }

    const openDialogElement = Array.from(
      document.querySelectorAll("dialog"),
    ).find(dialogIsOpen);
    if (!openDialogElement) {
      return;
    }
    if (event.key === "Escape") {
      event.preventDefault();
      commitState({ drawer: "" }, { replace: true });
      return;
    }
    if (event.key !== "Tab") {
      return;
    }
    const focusable = focusableIn(openDialogElement);
    if (focusable.length === 0) {
      event.preventDefault();
      return;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (
      event.shiftKey &&
      (document.activeElement === first || event.target === first)
    ) {
      event.preventDefault();
      last.focus();
    } else if (
      !event.shiftKey &&
      (document.activeElement === last || event.target === last)
    ) {
      event.preventDefault();
      first.focus();
    }
  }

  function boot() {
    app = document.getElementById("app");
    audit = global.NevermoreKeywordAudit;
    product = audit?.integratedProduct;

    if (
      !app ||
      !audit ||
      !product ||
      !Array.isArray(product.modules) ||
      product.modules.length !== 4 ||
      !Array.isArray(product.capabilities)
    ) {
      if (app) {
        app.innerHTML = `
          <main class="boot-error" role="alert">
            <h1>产品数据不可用</h1>
            <p data-reading-text>
              无法读取 Nevermore 工作台数据。请重新生成正式 Artifact，
              或检查当前项目的数据文件是否完整。
            </p>
          </main>
        `;
      }
      return;
    }

    renderShell();
    state = parseHash();
    const canonicalHash = stateHash(state);
    if (global.location.hash !== canonicalHash) {
      global.history.replaceState(null, "", canonicalHash);
    }
    app.addEventListener("click", handleClick);
    document.addEventListener("keydown", handleKeydown, true);
    global.addEventListener("hashchange", () => {
      state = parseHash();
      render();
    });
    render();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})(window);

    </script>
  </body>
</html>
