    <style>
:root {
  color-scheme: light;
  --paper: #f4f0e6;
  --paper-deep: #e9e2d4;
  --sheet: #fbf8f0;
  --sheet-strong: #fffdf7;
  --forest: #113f35;
  --forest-2: #1f5f4f;
  --forest-soft: #d8e8e1;
  --ink: #17251f;
  --ink-soft: #52615b;
  --ink-faint: #48544d;
  --line: #d6cebe;
  --line-strong: #b7ad99;
  --vermilion: #d94932;
  --vermilion-deep: #8d2419;
  --vermilion-soft: #f7ddd5;
  --amber: #aa6f11;
  --amber-soft: #f4e6c5;
  --blue: #315f8f;
  --blue-soft: #dce8f3;
  --focus: #e0602f;
  --shadow: 0 22px 70px rgb(32 42 37 / 10%);
  --display-font: "Iowan Old Style", "Songti SC", "STSong", "Noto Serif CJK SC",
    Georgia, serif;
  --body-font: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--paper);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--ink);
  background:
    linear-gradient(90deg, rgb(17 63 53 / 2.4%) 1px, transparent 1px) 0 0 / 72px 72px,
    linear-gradient(rgb(17 63 53 / 2.4%) 1px, transparent 1px) 0 0 / 72px 72px,
    radial-gradient(circle at 15% 4%, rgb(255 255 255 / 85%), transparent 32rem),
    var(--paper);
  font-family: var(--body-font);
  font-size: 16px;
  line-height: 1.65;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

[data-reading-text] {
  font-size: 1rem !important;
  line-height: 1.78;
}

button,
select,
input {
  font: inherit;
}

button,
select {
  color: inherit;
}

button {
  touch-action: manipulation;
}

button:focus-visible,
select:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

.skip-link {
  position: fixed;
  z-index: 1000;
  top: 12px;
  left: 12px;
  padding: 10px 14px;
  transform: translateY(-180%);
  border: 2px solid var(--forest);
  border-radius: 4px;
  color: var(--sheet-strong);
  background: var(--forest);
  font-weight: 700;
}

.skip-link:focus {
  transform: translateY(0);
}

#app {
  min-height: 100vh;
}

.audit-shell {
  width: min(100%, 1720px);
  margin: 0 auto;
  padding: 28px clamp(18px, 3vw, 54px) 68px;
}

.audit-header {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 3px 28px 3px 3px;
  background:
    linear-gradient(128deg, rgb(255 255 255 / 70%), transparent 44%),
    var(--sheet);
  box-shadow: var(--shadow);
}

.audit-header::before {
  position: absolute;
  top: 0;
  right: 0;
  width: 12px;
  height: 100%;
  background: var(--vermilion);
  content: "";
}

.masthead {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 28px;
  align-items: start;
  padding: clamp(26px, 4vw, 58px) clamp(24px, 4.5vw, 72px) 28px;
}

.masthead__identity {
  min-width: 0;
}

.eyebrow {
  margin: 0 0 10px;
  color: var(--vermilion-deep);
  font-size: 0.82rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  line-height: 1.35;
  text-transform: uppercase;
}

.masthead h1 {
  max-width: 950px;
  margin: 0;
  font-family: var(--display-font);
  font-size: clamp(2rem, 4vw, 4.65rem);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.08;
}

.masthead__subtitle {
  max-width: 900px;
  margin: 20px 0 0;
  color: var(--ink-soft);
  font-size: clamp(1rem, 1.25vw, 1.22rem);
  line-height: 1.75;
}

.audit-seal {
  display: grid;
  width: 138px;
  aspect-ratio: 1;
  place-content: center;
  transform: rotate(3deg);
  border: 2px solid var(--vermilion);
  border-radius: 50%;
  color: var(--vermilion-deep);
  background: rgb(247 221 213 / 45%);
  text-align: center;
  box-shadow: inset 0 0 0 6px var(--sheet), inset 0 0 0 7px var(--vermilion);
}

.audit-seal strong {
  display: block;
  font-family: var(--display-font);
  font-size: 1.45rem;
  letter-spacing: 0.12em;
  line-height: 1.2;
}

.audit-seal span {
  display: block;
  margin-top: 5px;
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.scope-declaration {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(240px, 0.7fr);
  border-top: 1px solid var(--line);
  background: var(--forest);
}

.scope-declaration__copy,
.scope-declaration__meta {
  padding: 22px clamp(24px, 4.5vw, 72px);
}

.scope-declaration__copy {
  color: #f8f4e9;
  font-size: 1rem;
  line-height: 1.75;
}

.scope-declaration__copy strong {
  color: #e7b092;
}

.scope-declaration__meta {
  display: grid;
  align-content: center;
  border-left: 1px solid rgb(255 255 255 / 18%);
  color: #d6e3de;
  font-size: 0.9rem;
}

.scope-declaration__meta b {
  color: #fffaf0;
  font-size: 1rem;
}

.decision-register {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid var(--line);
}

.decision-register__item {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 13px;
  align-items: center;
  min-height: 98px;
  padding: 18px clamp(18px, 2.3vw, 34px);
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition:
    color 160ms ease,
    background-color 160ms ease;
}

.decision-register__item:last-child {
  border-right: 0;
}

.decision-register__item:hover,
.decision-register__item[aria-pressed="true"] {
  background: var(--sheet-strong);
}

.decision-register__item[aria-pressed="true"]::after {
  position: absolute;
  right: 18px;
  bottom: 0;
  left: 18px;
  height: 4px;
  background: var(--vermilion);
  content: "";
}

.decision-register__mark {
  display: grid;
  width: 38px;
  height: 38px;
  place-content: center;
  border: 1px solid currentcolor;
  border-radius: 50%;
  color: var(--forest);
  font-family: var(--display-font);
  font-weight: 700;
}

.decision-register__item[data-value="rewrite"] .decision-register__mark {
  color: var(--vermilion-deep);
}

.decision-register__item[data-value="defer"] .decision-register__mark {
  color: var(--amber);
}

.decision-register__label {
  display: block;
  font-size: 1rem;
  font-weight: 750;
}

.decision-register__hint {
  display: block;
  margin-top: 2px;
  color: var(--ink-soft);
  font-size: 0.92rem;
}

.decision-register__count {
  font-family: var(--display-font);
  font-size: 2rem;
  font-variant-numeric: tabular-nums;
}

.view-tabs {
  position: sticky;
  z-index: 20;
  top: 0;
  display: flex;
  gap: 5px;
  align-items: stretch;
  margin: 24px 0 0;
  padding: 7px;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: rgb(251 248 240 / 94%);
  box-shadow: 0 12px 30px rgb(17 63 53 / 8%);
  backdrop-filter: blur(14px);
}

.view-tabs button {
  position: relative;
  flex: 1 0 160px;
  min-height: 54px;
  padding: 12px 18px;
  border: 0;
  border-radius: 2px;
  color: var(--ink-soft);
  background: transparent;
  font-weight: 750;
  text-align: center;
  cursor: pointer;
}

.view-tabs button:hover {
  color: var(--forest);
  background: var(--forest-soft);
}

.view-tabs button[aria-current="page"] {
  color: #fffdf6;
  background: var(--forest);
}

.view-tabs__index {
  margin-right: 8px;
  font-family: var(--display-font);
  font-size: 0.82rem;
  opacity: 0.72;
}

.audit-workspace {
  display: grid;
  grid-template-columns: minmax(260px, 0.78fr) minmax(500px, 1.75fr) minmax(290px, 0.9fr);
  gap: 18px;
  align-items: start;
  margin-top: 18px;
}

.audit-panel {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--sheet);
  box-shadow: 0 14px 34px rgb(31 42 36 / 6%);
}

.register-panel,
.impact-panel {
  position: sticky;
  top: 84px;
  max-height: calc(100vh - 106px);
  overflow: auto;
  scrollbar-color: var(--line-strong) transparent;
}

.panel-heading {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--line);
}

.panel-heading h2,
.panel-heading h3 {
  margin: 0;
  font-family: var(--display-font);
  font-size: 1.35rem;
  font-weight: 650;
  line-height: 1.25;
}

.panel-heading p {
  margin: 7px 0 0;
  color: var(--ink-soft);
  font-size: 1rem;
}

.filter-stack {
  display: grid;
  gap: 12px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  background: rgb(233 226 212 / 30%);
}

.filter-field {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
}

.filter-field label {
  color: var(--forest);
  font-size: 0.92rem;
  font-weight: 750;
}

.filter-field select {
  width: 100%;
  min-height: 42px;
  padding: 7px 34px 7px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  background: var(--sheet-strong);
  cursor: pointer;
}

.filter-clear {
  justify-self: end;
  padding: 4px 0;
  border: 0;
  border-bottom: 1px solid currentcolor;
  color: var(--forest-2);
  background: transparent;
  font-weight: 750;
  cursor: pointer;
}

.requirement-list {
  display: grid;
  margin: 0;
  padding: 0;
  list-style: none;
}

.requirement-row {
  position: relative;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 12px;
  width: 100%;
  min-height: 94px;
  padding: 17px 18px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.requirement-row:hover {
  background: #f3efe5;
}

.requirement-row[aria-current="true"] {
  background: var(--forest-soft);
}

.requirement-row[aria-current="true"]::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 5px;
  background: var(--vermilion);
  content: "";
}

.requirement-row__number {
  color: var(--vermilion-deep);
  font-family: var(--display-font);
  font-size: 1.45rem;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.requirement-row__title {
  display: block;
  font-size: 0.96rem;
  font-weight: 750;
  line-height: 1.45;
}

.requirement-row__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  align-items: center;
  margin-top: 8px;
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.empty-register {
  padding: 32px 22px;
  color: var(--ink-soft);
  text-align: center;
}

.review-sheet {
  min-height: 720px;
  background:
    linear-gradient(90deg, transparent 44px, rgb(217 73 50 / 13%) 44px, rgb(217 73 50 / 13%) 45px, transparent 45px),
    repeating-linear-gradient(0deg, transparent 0, transparent 45px, rgb(17 63 53 / 4%) 45px, rgb(17 63 53 / 4%) 46px),
    var(--sheet-strong);
}

.review-sheet__inner {
  padding: clamp(24px, 3.6vw, 58px);
}

.review-sheet__topline {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

.review-sheet__id {
  color: var(--vermilion-deep);
  font-size: 0.85rem;
  font-weight: 850;
  letter-spacing: 0.12em;
}

.review-sheet h2 {
  max-width: 850px;
  margin: 0;
  font-family: var(--display-font);
  font-size: clamp(1.75rem, 2.8vw, 3.25rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.18;
}

.review-sheet__lede {
  max-width: 820px;
  margin: 18px 0 0;
  color: var(--ink-soft);
  font-family: var(--display-font);
  font-size: 1.16rem;
  line-height: 1.85;
}

.stamp {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  min-height: 32px;
  padding: 5px 10px;
  border: 1px solid currentcolor;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 800;
  line-height: 1.25;
}

.stamp::before {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentcolor;
  content: "";
}

.stamp--adopt {
  color: var(--forest-2);
  background: var(--forest-soft);
}

.stamp--rewrite {
  color: var(--vermilion-deep);
  background: var(--vermilion-soft);
}

.stamp--defer {
  color: var(--amber);
  background: var(--amber-soft);
}

.stamp--truth-current {
  color: var(--forest-2);
  background: var(--forest-soft);
}

.stamp--truth-partial {
  color: var(--blue);
  background: var(--blue-soft);
}

.stamp--truth-not-implemented {
  color: var(--vermilion-deep);
  background: var(--vermilion-soft);
}

.stamp--truth-external-dependent {
  color: var(--amber);
  background: var(--amber-soft);
}

.review-section {
  display: grid;
  grid-template-columns: minmax(130px, 0.28fr) minmax(0, 1fr);
  gap: 24px;
  padding: 29px 0;
  border-bottom: 1px solid var(--line);
}

.review-section:last-child {
  border-bottom: 0;
}

.review-section__label {
  margin: 0;
  color: var(--forest);
  font-size: 0.83rem;
  font-weight: 850;
  letter-spacing: 0.08em;
  line-height: 1.45;
}

.review-section__body {
  min-width: 0;
}

.review-section__body > :first-child {
  margin-top: 0;
}

.review-section__body > :last-child {
  margin-bottom: 0;
}

.review-section p,
.review-section li,
.module-copy,
.stage-copy,
.acceptance-copy,
[data-reading-text] {
  font-size: 1rem;
  line-height: 1.78;
}

.review-section p {
  margin: 0 0 12px;
}

.review-list {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.review-list li {
  position: relative;
  padding-left: 22px;
}

.review-list li::before {
  position: absolute;
  top: 0.72em;
  left: 0;
  width: 8px;
  height: 2px;
  background: var(--vermilion);
  content: "";
}

.review-note {
  padding: 16px 18px;
  border-left: 4px solid var(--vermilion);
  background: var(--vermilion-soft);
}

.review-note strong {
  display: block;
  margin-bottom: 5px;
}

.relation-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.relation-chip {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 6px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--sheet);
  font-size: 0.84rem;
  font-weight: 700;
}

button.relation-chip {
  color: var(--forest);
  cursor: pointer;
}

button.relation-chip:hover {
  border-color: var(--forest);
  background: var(--forest-soft);
}

.completion-flags {
  display: grid;
  gap: 10px;
}

.completion-flag {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 11px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  background: var(--sheet);
}

.completion-flag__mark {
  display: grid;
  width: 24px;
  height: 24px;
  place-content: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  color: var(--ink-faint);
  font-size: 0.78rem;
  font-weight: 850;
}

.completion-flag[data-status="complete"] .completion-flag__mark {
  border-color: var(--forest-2);
  color: var(--sheet-strong);
  background: var(--forest-2);
}

.completion-flag[data-status="pending"] .completion-flag__mark,
.completion-flag[data-status="not-started"] .completion-flag__mark {
  border-color: var(--vermilion);
  color: var(--vermilion-deep);
}

.completion-flag strong {
  display: block;
  font-size: 1rem;
}

.completion-flag p {
  margin: 3px 0 0;
  color: var(--ink-soft);
  font-size: 0.93rem;
}

.sheet-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding-top: 28px;
}

.button {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 10px 16px;
  border: 1px solid var(--forest);
  border-radius: 2px;
  color: var(--sheet-strong);
  background: var(--forest);
  font-weight: 750;
  text-decoration: none;
  cursor: pointer;
}

.button:hover {
  background: var(--forest-2);
}

.button--secondary {
  color: var(--ink);
  border-color: var(--forest-2);
  background: var(--sheet-strong);
}

.button--secondary:hover {
  color: var(--sheet-strong);
  background: var(--forest-2);
}

.impact-panel__body {
  padding: 20px;
}

.rail-section + .rail-section {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.rail-section h3 {
  margin: 0 0 13px;
  font-family: var(--display-font);
  font-size: 1.22rem;
  font-weight: 650;
}

.rail-section p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.94rem;
  line-height: 1.7;
}

.rail-facts {
  margin: 0;
}

.rail-facts div {
  display: grid;
  grid-template-columns: 94px minmax(0, 1fr);
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.rail-facts dt {
  color: var(--forest);
  font-size: 0.92rem;
  font-weight: 750;
}

.rail-facts dd {
  margin: 0;
  font-size: 0.9rem;
  font-weight: 650;
}

.rail-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.rail-list button {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  width: 100%;
  padding: 10px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.rail-list button:hover {
  color: var(--forest-2);
}

.rail-list__index {
  color: var(--vermilion-deep);
  font-family: var(--display-font);
  font-weight: 750;
}

.rail-callout {
  padding: 15px;
  border: 1px solid var(--line-strong);
  background: var(--paper);
}

.module-index,
.stage-index,
.acceptance-index {
  display: grid;
  gap: 0;
}

.module-card,
.stage-card,
.acceptance-layer {
  position: relative;
  display: grid;
  width: 100%;
  padding: 22px 24px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: left;
}

button.module-card,
button.stage-card {
  cursor: pointer;
}

button.module-card:hover,
button.stage-card:hover,
button.module-card[aria-pressed="true"],
button.stage-card[aria-pressed="true"] {
  background: var(--forest-soft);
}

button.module-card[aria-pressed="true"]::before,
button.stage-card[aria-pressed="true"]::before {

    const normalized = list(items);
    if (normalized.length === 0) {
      return '<p data-reading-text>当前没有额外条目。</p>';
    }
    return `<ul class="${escapeHtml(className)}">${normalized
      .map((item) => `<li data-reading-text>${escapeHtml(itemText(item))}</li>`)
      .join("")}</ul>`;
  }

  function getModule(moduleId) {
    return audit.modules.find((module) => module.id === moduleId) ?? null;
  }

  function getStage(stageId) {
    return audit.stages.find((stage) => stage.id === stageId) ?? null;
  }

  function getRequirement(requirementId) {
    return (
      audit.requirements.find(
        (requirement) => requirement.id === Number(requirementId),
      ) ?? audit.requirements[0]
    );
  }

  function requirementMatches(requirement, candidateState) {
    return (
      (candidateState.decision === "all" ||
        requirement.decision === candidateState.decision) &&
      (candidateState.module === "all" ||
        list(requirement.modules).includes(candidateState.module)) &&
      (candidateState.stage === "all" ||
        list(requirement.stage).includes(candidateState.stage))
    );
  }

  function filteredRequirements(candidateState = state) {
    return audit.requirements.filter((requirement) =>
      requirementMatches(requirement, candidateState),
    );
  }

  function normalizeState(candidate) {
    const moduleIds = new Set(audit.modules.map((module) => module.id));
    const stageIds = new Set(audit.stages.map((stage) => stage.id));
    const normalized = {
      view: VIEW_IDS.includes(candidate.view)
        ? candidate.view
        : DEFAULT_STATE.view,
      requirementId: audit.requirements.some(
        (requirement) => requirement.id === Number(candidate.requirementId),
      )
        ? Number(candidate.requirementId)
        : audit.requirements[0].id,
      decision: DECISION_IDS.includes(candidate.decision)
        ? candidate.decision
        : "all",
      module:
        candidate.module === "all" || moduleIds.has(candidate.module)
          ? candidate.module
          : "all",
      stage:
        candidate.stage === "all" || stageIds.has(candidate.stage)
          ? candidate.stage
          : "all",
    };

    const visible = filteredRequirements(normalized);
    if (
      visible.length > 0 &&
      !visible.some(
        (requirement) => requirement.id === normalized.requirementId,
      )
    ) {
      normalized.requirementId = visible[0].id;
    }
    return normalized;
  }

  function parseHash() {
    const rawHash = global.location.hash.replace(/^#\/?/, "");
    const [rawView = "", rawQuery = ""] = rawHash.split("?");
    const params = new URLSearchParams(rawQuery);
    return normalizeState({
      view: rawView || DEFAULT_STATE.view,
      requirementId: Number(params.get("item") ?? DEFAULT_STATE.requirementId),
      decision: params.get("decision") ?? "all",
      module: params.get("module") ?? "all",
      stage: params.get("stage") ?? "all",
    });
  }

  function stateHash(candidateState) {
    const params = new URLSearchParams({
      item: String(candidateState.requirementId),
      decision: candidateState.decision,
      module: candidateState.module,
      stage: candidateState.stage,
    });
    return `#/${candidateState.view}?${params.toString()}`;
  }

  function commitState(patch, options = {}) {
    const nextState = normalizeState({ ...state, ...patch });
    const nextHash = stateHash(nextState);
    state = nextState;

    if (global.location.hash === nextHash) {
      render();
      return;
    }

    if (options.replace) {
      global.history.replaceState(null, "", nextHash);
      render();
      return;
    }

    global.location.hash = nextHash;
  }

            role="region"
            aria-label="需求验收证据矩阵"
            tabindex="0"
          >
            <table class="acceptance-matrix">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">需求</th>
                  <th scope="col">阶段</th>
                  <th scope="col">证据条目</th>
                </tr>
              </thead>
              <tbody>
                ${audit.requirements
                  .map(
                    (requirement) => `
                      <tr>
                        <th scope="row">${String(requirement.id).padStart(
                          2,
                          "0",
                        )}</th>
                        <td>
                          <button
                            type="button"
                            data-action="open-evidence"
                            data-evidence-requirement="${requirement.id}"
                          >${escapeHtml(requirement.title)}</button>
                        </td>
                        <td>${escapeHtml(
                          list(requirement.stage)
                            .map(
                              (stageId) =>
                                getStage(stageId)?.name ?? stageId,
                            )
                            .join(" · "),
                        )}</td>
                        <td>
                          <span class="evidence-marker">${list(
                            requirement.completionEvidence,
                          ).length} 项</span>
                        </td>
                      </tr>
                    `,
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        </section>
      </div>
    `;
  }

  function renderLinkedRequirements(requirementIds) {
    const idSet = new Set(list(requirementIds).map(Number));
    const requirements = audit.requirements.filter((requirement) =>
      idSet.has(requirement.id),
    );
    if (requirements.length === 0) {
      return '<p data-reading-text>当前没有关联需求。</p>';
    }
    return `
      <div class="impact-requirements">
        ${requirements
          .map(
            (requirement) => `
              <button
                class="impact-requirement"
                type="button"
                data-action="select-linked-requirement"
                data-target-requirement-id="${requirement.id}"
              >
                <span class="impact-requirement__number">${String(
                  requirement.id,
                ).padStart(2, "0")}</span>
                <span class="impact-requirement__title">${escapeHtml(
                  requirement.title,
                )}</span>
                <span class="impact-requirement__arrow" aria-hidden="true">→</span>
              </button>
            `,
          )
          .join("")}
      </div>
    `;
  }

  function renderRequirementRail() {
    const requirement = getRequirement(state.requirementId);
    const modules = list(requirement.modules)
      .map(getModule)
      .filter(Boolean);
    const stages = list(requirement.stage).map(getStage).filter(Boolean);
    return `
      <div class="panel-heading">
        <p class="eyebrow">Impact & evidence</p>
        <h2>影响与证据</h2>
        <p>审核对象 ${String(requirement.id).padStart(2, "0")}</p>
      </div>
      <div class="impact-panel__body">
        <section class="rail-section">
          <h3>治理定位</h3>
          <dl class="rail-facts">
            <div><dt>当前状态</dt><dd>${escapeHtml(
              audit.truthLabels?.[requirement.currentTruth] ??
                TRUTH_LABELS[requirement.currentTruth],
            )}</dd></div>
            <div><dt>审核结论</dt><dd>${escapeHtml(
              audit.decisionLabels?.[requirement.decision] ??
                DECISION_LABELS[requirement.decision],
            )}</dd></div>
            <div><dt>优先级</dt><dd>${escapeHtml(
              requirement.auditedPriority,
            )}</dd></div>
            <div><dt>验收证据</dt><dd>${list(
              requirement.completionEvidence,
            ).length} 项</dd></div>
          </dl>
        </section>
        <section class="rail-section">
          <h3>影响模块</h3>
          <ul class="rail-list">
            ${modules
              .map(
                (module) => `
                  <li>
                    <button
                      type="button"
                      data-action="select-module"
                      data-target-module-id="${escapeHtml(module.id)}"
                    >
                      <span class="rail-list__index" aria-hidden="true">↳</span>
                      <span>${escapeHtml(module.name)}<br><small>${escapeHtml(
                        module.purpose,
                      )}</small></span>
                    </button>
                  </li>
                `,
              )
              .join("")}
          </ul>
        </section>
        <section class="rail-section">
          <h3>落地阶段</h3>
          <div class="rail-callout">
            <p data-reading-text>${escapeHtml(
              stages.map((stage) => stage.name).join(" → "),
            )}</p>
          </div>
          <div class="sheet-actions">
            <button
              class="button button--secondary"
              type="button"
              data-action="open-evidence"
              data-evidence-requirement="${requirement.id}"
            >打开证据台账</button>
          </div>
        </section>
      </div>
    `;
  }

  function renderContextRail() {
    const selectedModule = getModule(state.module);
    const selectedStage = getStage(state.stage);
    const visible = filteredRequirements();
    return `
      <div class="panel-heading">
        <p class="eyebrow">Audit context</p>
        <h2>${
          state.view === "modules"
            ? "模块影响摘要"
            : state.view === "stages"
              ? "阶段验收摘要"
              : "证据使用规则"
        }</h2>
      </div>
      <div class="impact-panel__body">
        <section class="rail-section">
          <h3>当前焦点</h3>
          <p data-reading-text>${escapeHtml(
            selectedModule?.purpose ??
              selectedStage?.goal ??
              "七层验收矩阵用于证明生产能力，不用界面存在代替真实写入、测试与 Provider 证据。",
          )}</p>
        </section>
        <section class="rail-section">
          <h3>关联需求</h3>
          <p data-reading-text>当前筛选关联 ${visible.length} / ${
            audit.requirements.length
          } 条需求。</p>
          ${
            visible[0]
              ? `
                <div class="sheet-actions">
                  <button
                    class="button button--secondary"
                    type="button"
                    data-action="select-linked-requirement"
                    data-target-requirement-id="${visible[0].id}"
                  >查看第一条关联审核</button>
                </div>
              `
              : ""
          }
        </section>
        <section class="rail-section">
          <h3>客户连接边界</h3>
          <p data-reading-text>${escapeHtml(
            audit.customerVisibleConnectors.join(" · "),
          )}。内部证据 Provider 只在证据旁披露，不伪装成客户连接卡。</p>
        </section>
      </div>
    `;
  }

  function renderRail() {
    const rail = document.getElementById("impact-rail");
    rail.innerHTML =
      state.view === "requirements"
        ? renderRequirementRail()
        : renderContextRail();
  }

  function render() {
    app.dataset.activeView = state.view;
    document
      .querySelectorAll('[data-action="set-view"][data-view]')
      .forEach((button) => {
        if (button.dataset.view === state.view) {
          button.setAttribute("aria-current", "page");
        } else {
          button.removeAttribute("aria-current");
        }
      });
    document
      .querySelectorAll('[data-action="set-decision"]')
      .forEach((button) =>
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.value === state.decision),
        ),
      );

    renderRegister();

    if (state.view === "requirements") {
      renderRequirementDetail();
    } else if (state.view === "modules") {
      renderModulesView();
    } else if (state.view === "stages") {
      renderStagesView();
    } else {
      renderAcceptanceView();
    }

    renderRail();
    app.dataset.ready = "true";
  }

  function getDialog() {
    return document.querySelector("dialog[data-evidence-dialog]");
  }

  function isDialogOpen(dialog = getDialog()) {
    return Boolean(dialog?.open || dialog?.hasAttribute("open"));
  }

  function dialogFocusable(dialog = getDialog()) {
    return Array.from(
      dialog.querySelectorAll(
        'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])',
      ),
    );
  }

  function openEvidence(requirementId, invoker) {
    const requirement = getRequirement(requirementId);
    const dialog = getDialog();
    const body = dialog.querySelector("[data-dialog-body]");
    dialogInvoker = invoker ?? document.activeElement;
    dialog.dataset.requirementId = String(requirement.id);
    dialog.querySelector("#evidence-dialog-title").textContent =
      `${String(requirement.id).padStart(2, "0")} · ${requirement.title}`;
    body.innerHTML = `
      <section class="dialog-section">
        <h3>当前 canonical 证据</h3>
        ${renderList(requirement.currentEvidence)}
      </section>
      <section class="dialog-section">
        <h3>上线所需证据</h3>
        ${renderList(requirement.completionEvidence)}
      </section>
      <section class="dialog-section">
        <h3>依赖</h3>
        ${renderList(requirement.dependencies)}
      </section>
      <section class="dialog-section">
        <h3>不包含边界</h3>
        ${renderList(requirement.notIncluded)}
      </section>
      ${
        list(requirement.completionFlags).length > 0
          ? `
            <section class="dialog-section">
              <h3>独立完成标记</h3>
              ${renderCompletionFlags(requirement)}
            </section>
          `
          : ""
      }
    `;

    if (typeof dialog.showModal === "function") {
      dialog.showModal();
    } else {
      dialog.setAttribute("open", "");
    }

    const focusFirst = () => dialogFocusable(dialog)[0]?.focus();
    if (typeof global.requestAnimationFrame === "function") {
      global.requestAnimationFrame(focusFirst);
    } else {
      focusFirst();
    }
  }

  function closeDialog(options = {}) {
    const dialog = getDialog();
    if (!dialog || !isDialogOpen(dialog)) {
      return;
    }
    if (typeof dialog.close === "function") {
      dialog.close();
    } else {
      dialog.removeAttribute("open");
    }
    const invoker = dialogInvoker;
    dialogInvoker = null;
    if (options.restoreFocus !== false && invoker?.focus) {
      invoker.focus();
    }
  }

  function handleClick(event) {
    const dialog = getDialog();
    if (event.target === dialog) {
      closeDialog();
      return;
    }

    const target = event.target.closest("[data-action]");
    if (!target || !app.contains(target)) {
      return;
    }

    const action = target.dataset.action;
    if (action === "set-view") {
      commitState({ view: target.dataset.view });
      return;
    }
    if (action === "set-decision") {
      const decision =
        state.decision === target.dataset.value ? "all" : target.dataset.value;
      commitState({ view: "requirements", decision });
      return;
    }
    if (action === "clear-filters") {
      commitState({ decision: "all", module: "all", stage: "all" });
      return;
    }
    if (action === "select-requirement") {
      commitState({
        view: "requirements",
        requirementId: Number(target.dataset.requirementId),
      });
      return;
    }
    if (action === "select-linked-requirement") {
      const requirementId = Number(target.dataset.targetRequirementId);
      const requirement = getRequirement(requirementId);
      commitState({
        view: "requirements",
        requirementId,
        decision: "all",
        module: "all",
        stage: "all",
      });
      if (requirement && global.innerWidth <= 860) {
        document
          .getElementById("review-detail")
          ?.scrollIntoView({ block: "start" });
      }
      return;
    }
    if (action === "select-module") {
      const moduleId =
        target.dataset.moduleId ?? target.dataset.targetModuleId;
      commitState({ view: "modules", module: moduleId, stage: "all" });
      return;
    }
    if (action === "select-stage") {
      commitState({
        view: "stages",
        stage: target.dataset.stageId,
        module: "all",
      });
      return;
    }
    if (action === "open-evidence") {
      openEvidence(
        Number(
          target.dataset.evidenceRequirement ?? state.requirementId,
        ),
        target,
      );
      return;
    }
    if (action === "close-dialog") {
      closeDialog();
      return;
    }
    if (action === "go-to-acceptance") {
      closeDialog({ restoreFocus: false });
      commitState({ view: "acceptance" });
    }
  }

  function handleChange(event) {
    const control = event.target.closest("select[data-filter]");
    if (!control || !app.contains(control)) {
      return;
    }
    const filter = control.dataset.filter;
    if (!["decision", "module", "stage"].includes(filter)) {
      return;
    }
    commitState({ [filter]: control.value });
  }

  function handleKeydown(event) {
    const dialog = getDialog();
    if (!dialog || !isDialogOpen(dialog)) {
      return;
    }
    if (event.key === "Escape") {
      event.preventDefault();
      closeDialog();
      return;
    }
    if (event.key !== "Tab") {
      return;
    }

    const focusable = dialogFocusable(dialog);
    if (focusable.length === 0) {
      event.preventDefault();
      return;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function boot() {
    app = document.getElementById("app");
    audit = global.NevermoreKeywordAudit;

    if (!app || !audit || !Array.isArray(audit.requirements)) {
      if (app) {
        app.innerHTML = `
          <main class="boot-error" role="alert">
            <h1>审计数据不可用</h1>
            <p>无法读取 Nevermore 关键词需求审计数据，请重新生成正式 Artifact。</p>
          </main>
        `;
      }
      return;
    }

    buildShell();
    state = parseHash();
    const canonicalHash = stateHash(state);
    if (global.location.hash !== canonicalHash) {
      global.history.replaceState(null, "", canonicalHash);
    }
    app.addEventListener("click", handleClick);
    app.addEventListener("change", handleChange);
    document.addEventListener("keydown", handleKeydown);
    global.addEventListener("hashchange", () => {
      state = parseHash();
      render();
    });
    render();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})(window);

    </script>
  </body>
</html>
