/* v13 · Customer-facing editorial workspace
   Restores the richer overview, Growth Map and Execution composition while
   keeping the v12 canonical data and customer action paths. */

.v13-overview-grid {
  display: grid;
  gap: 20px;
  align-items: stretch;
}

.v13-overview-grid--top {
  grid-template-columns: minmax(0, 1.55fr) minmax(330px, 0.72fr);
}

.v13-overview-grid--bottom {
  grid-template-columns: minmax(0, 1.3fr) minmax(360px, 0.7fr);
  margin-top: 20px;
}

.v13-overview-grid > .panel {
  margin: 0;
  padding: 28px;
  box-shadow: var(--shadow-soft);
}

.v13-overview-grid .panel-heading {
  min-height: 62px;
  margin-bottom: 8px;
}

.v13-overview-grid .panel-heading h2 {
  margin-top: 2px;
  font-size: clamp(25px, 2.1vw, 32px);
}

.v13-priority-list {
  display: grid;
}

.v13-priority-item {
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr) 22px;
  gap: 18px;
  align-items: center;
  width: 100%;
  padding: 20px 4px;
  text-align: left;
  background: none;
  border: 0;
  border-top: 1px solid var(--line);
  cursor: pointer;
}

}

.v13-priority-item:hover .ui-icon {
  transform: translateX(3px);
}

.v13-priority-item .ui-icon {
  width: 18px;
  color: var(--green);
  transition: transform 0.18s ease;
}

.v13-priority-number {
  display: grid;
  width: 52px;
  height: 52px;
  place-items: center;
  border-radius: 14px;
  font-family: var(--serif);
  font-size: 23px;
  font-weight: 650;
}

.v13-priority-item > span:nth-child(2) {
  min-width: 0;
}

.v13-priority-item small,
.v13-priority-item strong,
.v13-priority-item em {
  display: block;
}

.v13-priority-item small {
  color: var(--coral-ink);
  font-size: 12px;
  font-style: normal;
  font-weight: 800;
  letter-spacing: 0.055em;

}

.v13-priority-item strong {
  margin: 3px 0 2px;

  font-size: 17px;
  line-height: 1.42;
}

.v13-priority-item em {

  color: var(--muted);
  font-size: 13px;
  font-style: normal;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.v13-mix-chart {

}

.v13-mix-row {

.v13-execution-toolbar > span {

  color: var(--muted);
  font-size: 12px;
}

.v13-execution-shell {
  grid-template-columns: minmax(280px, 310px) minmax(0, 1fr);
  gap: 16px;
}

.v13-execution-shell .client-work-queue {
  padding: 0;
}

.v13-work-queue-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 18px 13px;
  border-bottom: 1px solid var(--line);
}

.v13-work-queue-header .eyebrow {
  margin: 0;
  color: var(--coral-ink);
}

.v13-work-queue-header h2 {
  margin: 2px 0 0;
  font-family: var(--serif);
  font-size: 23px;
  line-height: 1.15;
}

.v13-work-queue-header > span {
  display: grid;
  min-width: 27px;
  height: 27px;
  padding: 0 7px;
  place-items: center;
  color: var(--muted);
  background: var(--surface-3);
  border-radius: 30px;
  font-size: 11px;
}

.v13-work-item {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  padding: 12px 10px;
  margin-bottom: 3px;
}

.v13-work-item__mark {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  color: var(--green);
  background: white;
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 10px;
  font-weight: 850;
}

.v13-work-item__copy {
  min-width: 0;
}

.v13-work-item__copy > strong,
.v13-work-item__copy > small {
  display: block;
}

.v13-work-item__copy > strong {
  display: -webkit-box;
  margin-top: 3px;
  overflow: hidden;
  font-size: 13px;
  line-height: 1.4;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.v13-work-item__copy > small {
  overflow: hidden;
  margin: 4px 0 7px;
  color: var(--muted);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.v13-work-item__copy .badge {
  justify-self: start;
}

.v13-document-header {
  padding: 28px 30px 23px;
}

.v13-document-kicker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}

.v13-document-kicker .eyebrow {
  margin: 0;
  color: var(--coral-ink);
}

.v13-document-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(250px, 285px);
  align-items: start;
}

.v13-document-body {
  max-width: none;
  margin: 0;
  padding: clamp(30px, 4vw, 52px);
  border-right: 1px solid var(--line);
}

.v13-seo-title {
  padding: 13px 15px;
  margin-bottom: 20px;
  background: var(--surface-2);
  border-left: 3px solid var(--teal);
  border-radius: 0 10px 10px 0;
}

.v13-seo-title span,
.v13-seo-title strong {
  display: block;
}

.v13-seo-title span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.v13-seo-title strong {
  margin-top: 3px;
  font-size: 13px;
}

.v13-byline {
  display: flex;
  gap: 10px;
  align-items: center;
  padding-bottom: 22px;
  margin-bottom: 25px;
  border-bottom: 1px solid var(--line);
}

.v13-byline > span {
  display: grid;
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  place-items: center;
  color: white;
  background: var(--green-dark);
  border-radius: 50%;
  font-size: 11px;
  font-weight: 800;
}

.v13-byline strong,
.v13-byline small {
  display: block;
}

.v13-byline strong {
  font-size: 12px;
}

.v13-byline small {
  color: var(--muted);
  font-size: 10px;
}

.v13-quality-panel {
  position: sticky;
  top: 88px;
  max-height: calc(100vh - 108px);
  padding: 19px;
  overflow-y: auto;
  background: var(--surface-2);
}

.v13-quality-score {
  display: flex;
  gap: 4px;
  align-items: baseline;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.v13-quality-score > span {
  margin-right: auto;
  color: var(--muted);
  font-size: 11px;
}

.v13-quality-score strong {
  color: var(--green);
  font-family: var(--serif);
  font-size: 35px;
  line-height: 1;
}

.v13-quality-score small {
  color: var(--muted);
  font-size: 11px;
}

.v13-quality-panel section {
  margin-top: 18px;
}

.v13-quality-panel h3 {
  margin: 0 0 8px;
  font-size: 13px;
}

.v13-quality-gate {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 9px;
  align-items: center;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}

.v13-quality-gate > span {
  display: grid;
  width: 23px;
  height: 23px;
  place-items: center;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 850;
}

.v13-quality-gate.is-passed > span {
  color: var(--green);
  background: var(--teal-soft);
}

.v13-quality-gate.is-pending > span {
  color: #835815;
  background: var(--amber-soft);
}

.v13-quality-gate .ui-icon {
  width: 13px;
}

.v13-quality-gate small,
.v13-quality-gate strong {
  display: block;
}

.v13-quality-gate small {
  color: var(--muted);
  font-size: 10px;
  text-transform: capitalize;
}

.v13-quality-gate strong {
  font-size: 11px;
}

.v13-quality-blocker {
  padding: 11px 12px;
  margin-top: 12px;
  color: #784734;
  background: #fff0e8;
  border: 1px solid #f1cab8;
  border-radius: 9px;
}

.v13-quality-blocker strong {
  font-size: 11px;
}

.v13-quality-blocker p {
  margin: 3px 0 0;
  font-size: 10px;
  line-height: 1.5;
}

.v13-quality-link {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 14px;
  width: 100%;
  padding: 9px 0;
  text-align: left;
  border-top: 1px solid var(--line);
}

.v13-quality-link span,
.v13-quality-link strong {
  display: block;
}

.v13-quality-link span {
  color: var(--muted);
  font-size: 10px;
}

.v13-quality-link strong {
  color: var(--ink);
  font-size: 11px;
  line-height: 1.45;
}

.v13-quality-link .ui-icon {
  grid-column: 2;
  grid-row: 1 / 3;
  align-self: center;
  width: 13px;
}

.v13-quality-note {
  margin: 0;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.55;
}

.v13-planned-flow {
  padding: 0;
  margin: 0;
  list-style: none;
}

.v13-planned-flow li {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}

.v13-planned-flow li span {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  color: var(--green);
  background: var(--teal-soft);
  border-radius: 9px;
  font-family: var(--serif);
}

.v13-planned-flow li strong {
  font-size: 13px;
}

@media (max-width: 1180px) {

  }

  }

  }

    display: flex;

    max-height: none;
    overflow-x: auto;
    overflow-y: hidden;

  .v13-work-item {

    min-height: 104px;
  }

  .v13-document-body {
    border-right: 0;
  }

  .v13-quality-panel {

    grid-template-columns: repeat(2, minmax(0, 1fr));

    grid-column: 1 / -1;
  }

@media (max-width: 760px) {
  .v13-overview-grid {
    gap: 12px;
  }

  .v13-overview-grid--bottom {
    margin-top: 12px;
  }

  .v13-overview-grid > .panel {
    padding: 20px;
  }

  .v13-overview-grid .panel-heading h2 {
    font-size: 24px;
  }

  .v13-priority-item {
    grid-template-columns: 48px minmax(0, 1fr) 18px;
    gap: 12px;
    padding: 16px 0;
  }

  .v13-priority-number {
    width: 45px;
    height: 45px;
    font-size: 20px;
  }

  .v13-priority-item strong {
    font-size: 15px;
  }

  .v13-priority-item em {
    white-space: normal;
  }

  .v13-mix-row {
    grid-template-columns: 94px minmax(60px, 1fr) 22px;
    gap: 8px;
    font-size: 12px;
  }

  .v13-connection-grid {
    grid-template-columns: 1fr;
  }

  .v13-connection-item {
    min-height: 82px;
  }

  .v13-map-tabs {
    display: flex;
    overflow-x: auto;
  }

  .v13-map-tabs > button {
    flex: 0 0 170px;
  }

  .v13-dataset-summary {
    grid-template-columns: 1fr 1fr;
  }

  .v13-dataset-summary > div {
    padding: 16px;
  }

  .v13-source-strip {
    padding: 16px;
  }

  .v13-source-strip__items,
  .v13-source-strip--compact .v13-source-strip__items {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .v13-library-toolbar {
    display: grid;
    grid-template-columns: 1fr auto;
  }

  .v13-library-toolbar .client-search {
    grid-column: 1 / -1;
    max-width: none;
  }

  .v13-library-toolbar .client-select-label,
  .v13-library-toolbar > .button {
    grid-column: auto;
    width: auto;
  }

  .v13-table-card .client-table-scroll {
    overflow: visible;
  }

  .v13-table,
  .v13-table tbody,
  .v13-table tr {
    display: block;

  }

  .v13-table thead {
    display: none;
  }

  .v13-table tbody {
    padding: 9px;
  }

  .v13-table tbody tr {
    padding: 12px 42px 10px 12px;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .v13-table tbody tr.is-selected {
    background: #e3f3ef;
    border-color: #b8dfd8;

  }

  .v13-table tbody td {
    display: flex !important;
    gap: 12px;
    align-items: baseline;
    justify-content: space-between;
    padding: 5px 0;
    border: 0;
    font-size: 12px;
  }

  .v13-table tbody td::before {
    content: attr(data-label);
    flex: 0 0 92px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 750;
  }

  .v13-table tbody td:first-child {
    display: block !important;
    padding-bottom: 9px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }

  .v13-table tbody td:first-child::before,
  .v13-table tbody td:last-child::before {

  .v13-table tbody td:last-child {

  .v13-table .client-primary-cell {

  .v13-table .client-primary-cell strong,

  .v13-detail-panel {

  .v13-detail-header {

  }

  .v13-detail-header > .badge {
    justify-self: start;

  .v13-detail-metrics--four {

  }

  .v13-detail-metrics--four > div:nth-child(3) {
    border-top: 1px solid var(--line);

  }

  .v13-detail-metrics--four > div:nth-child(4) {
    border-top: 1px solid var(--line);
  }

  .v13-cluster-path {
    grid-template-columns: 1fr;
  }

  .v13-cluster-path > i {

  }

  .v13-detail-actions {
    grid-template-columns: 1fr;
  }

  .v13-execution-toolbar {
    display: block;
    padding: 8px;
  }

  .v13-execution-toolbar > div {
    padding-bottom: 4px;
  }

  .v13-execution-toolbar > span {
    display: block;
    padding: 5px 8px 2px;
  }

  .v13-work-queue-header {
    display: none;
  }

  .v13-execution-shell .client-work-list {
    padding: 8px;
  }

  .v13-work-item {
    flex-basis: 238px;
  }

  .v13-document-header {
    display: grid;
    padding: 22px 20px 18px;
  }

  .v13-document-header .client-document-actions {
    width: 100%;
  }

  .v13-document-body {
    padding: 26px 20px 34px;
  }

  .v13-quality-panel {
    grid-template-columns: 1fr;
    padding: 20px;
  }

  .v13-quality-score {
    grid-column: auto;
  }
}

@media (max-width: 480px) {
  .v13-context-panel dl > div,
  .v13-detail-facts > div,
  .v13-quality-facts > div {
    grid-template-columns: 1fr;

  .v13-source-strip__items,
  .v13-source-strip--compact .v13-source-strip__items {
    grid-template-columns: 1fr;
  }

  .v13-library-toolbar {
    grid-template-columns: 1fr;
  }

  .v13-library-toolbar .client-select-label,
  .v13-library-toolbar > .button {
    grid-column: 1;

  .v13-dataset-summary strong {

  .v13-detail-metrics {

  .v13-detail-metrics:not(.v13-detail-metrics--four) > div:nth-child(3) {

/* v16 — complete customer workflow: profile provenance, immutable versions,
   opportunity-to-artifact creation, and readable Chinese-first detail views. */
.client-profile-model-grid {
  display: grid;
  gap: 12px;
  margin: 0;
}

.client-profile-model-grid > div {
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}

.client-profile-model-grid dt {
  color: var(--ink-muted);
  font-size: 13px;
}

.client-profile-model-grid dd {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 0;
}

.client-profile-model-grid dd span,
.client-version-fields > div {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper-soft);
}

.client-profile-model-grid dd span {
  padding: 7px 9px;
  color: var(--ink);
  font-size: 13px;
  line-height: 1.45;
}

.client-version-list {
  display: grid;
  gap: 10px;
}

.client-version-list > button {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 8px 12px;
  align-items: center;
  width: 100%;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink);
  text-align: left;
}

.client-version-list > button:hover,
.client-version-list > button:focus-visible {
  border-color: var(--teal);
  background: var(--teal-soft);
}

.client-version-list > button strong,
.client-version-list > button small {
  grid-column: 2;
}

.client-version-list > button strong {
  font-size: 15px;
  line-height: 1.45;
}

.client-version-list > button small {
  color: var(--ink-muted);
  font-size: 13px;
  line-height: 1.45;
}

.client-version-list > button .ui-icon {
  grid-column: 3;
  grid-row: 1 / span 3;
}

.client-version-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.client-version-fields > div {
  display: grid;
  gap: 6px;
  padding: 12px;
}

.client-version-fields span,
.client-version-fields small {
  color: var(--ink-muted);
  font-size: 12px;
}

.client-version-fields strong {
  font-size: 14px;
  line-height: 1.5;
}

.client-revision-snapshot {
  display: grid;
  gap: 18px;
}

.client-generated-artifact {
  display: grid;
  gap: 24px;
}

.client-generated-artifact > section {
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}

.client-generated-artifact > section > span {
  color: var(--coral);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
}

.client-generated-artifact h3 {
  margin: 7px 0 10px;
  font-family: var(--font-display);
  font-size: clamp(22px, 2.2vw, 30px);
}

.client-generated-artifact p,
.client-generated-artifact li {
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 1.75;
}

.client-overlay__footer {
  flex-wrap: wrap;
}

@media (max-width: 760px) {
  .client-profile-model-grid > div,
  .client-version-list > button {
    grid-template-columns: 1fr;
  }

  .client-version-list > button strong,
  .client-version-list > button small,
  .client-version-list > button .ui-icon {
    grid-column: 1;
    grid-row: auto;
  }

  .client-version-list > button .ui-icon {
    justify-self: end;
  }

  .client-version-fields {
    grid-template-columns: 1fr;
  }
}

  border-color: var(--green);
}

.v14-topbar-pill .ui-icon {
  width: 15px;
  height: 15px;
}

.v14-topbar-pill strong {
  color: var(--green);
}

.panel.v14-map-tabs {
  min-height: 60px;
  margin-bottom: 20px;
  padding: 5px;
  background: #e7e3da;
  border-radius: 15px;
}

.v14-map-tabs > button {
  min-height: 50px;
  padding: 8px 18px;
  border-radius: 11px;
}

.v14-map-tabs > button.is-active {
  background: #fffefa;
  box-shadow: 0 3px 11px rgba(26, 46, 40, 0.07);
}

.v14-map-tabs strong {
  color: var(--ink-soft);
  font-size: 14px;
}

.v14-map-tabs span {
  color: var(--muted);
  font-size: 12px;
}

.v14-page-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  min-height: 132px;
  margin-bottom: 14px;
  overflow: hidden;
  color: #eef6f2;
  background: var(--green-dark);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 17px;
  box-shadow: var(--shadow-soft);
}

.v14-page-summary > div {
  min-width: 0;
  padding: 20px;
  border-left: 1px solid rgba(255, 255, 255, 0.12);
}

.v14-page-summary > div:first-child {
  border-left: 0;
}

.v14-page-summary span,
.v14-page-summary strong,
.v14-page-summary small {
  display: block;
}

.v14-page-summary span {
  color: #a9bcb6;
  font-size: 13px;
  font-weight: 620;
}

.v14-page-summary strong {
  margin: 8px 0 8px;
  color: #f7fbf9;
  font-family: var(--serif);
  font-size: 29px;
  font-weight: 540;
  line-height: 1;
}

.v14-page-summary small {
  overflow: hidden;
  color: #9eb2ac;
  font-size: 12px;
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.v14-page-toolbar {
  display: grid;
  grid-template-columns: minmax(340px, 1fr) auto auto;
  gap: 22px;
  align-items: center;
  min-height: 72px;
  padding: 11px 13px;
  margin-bottom: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: 0 5px 18px rgba(30, 49, 43, 0.035);
}

.v14-page-search {
  display: flex;
  min-width: 0;
}

.v14-page-search label {
  display: flex;
  flex: 1;
  gap: 9px;
  align-items: center;
  min-width: 0;
  min-height: 44px;
  padding: 0 13px;
  background: #fffefa;
  border: 1px solid var(--line-strong);
  border-right: 0;
  border-radius: 10px 0 0 10px;
}

.v14-page-search label .ui-icon {
  width: 17px;
  color: var(--muted);
}

.v14-page-search input {
  width: 100%;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  font-size: 14px;
}

.v14-page-search > button {
  min-width: 58px;
  padding: 0 15px;
  color: white;
  background: var(--green);
  border: 1px solid var(--green);
  border-radius: 0 10px 10px 0;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
}

.v14-page-search > button:hover {
  background: var(--green-dark);
}

.v14-page-type,
.v14-page-views {
  display: flex;
  gap: 9px;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.v14-page-type select {
  min-width: 124px;
  min-height: 42px;
  padding: 0 34px 0 12px;
  color: var(--ink-soft);
  background: #fffefa;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 620;
}

.v14-page-views > div {
  display: flex;
  gap: 3px;
  align-items: center;
}

.v14-page-views button {
  min-height: 36px;
  padding: 0 11px;
  color: var(--ink-soft);
  background: transparent;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
}

.v14-page-views button:hover {
  background: var(--surface-2);
}

.v14-page-views button.is-active {
  color: white;
  background: var(--green);
}

.v14-page-layout {
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 14px;
}

.panel.v14-page-table-card {
  border-radius: 16px;
}

.client-table.v14-page-table {
  min-width: 860px;
  table-layout: fixed;
}

.v14-page-table th,
.v14-page-table td {
  padding-right: 14px;
  padding-left: 14px;
}

.v14-page-table th {
  height: 50px;
  padding-top: 13px;
  padding-bottom: 13px;
  color: #6e7b76;
  background: #f9f6ef;
  font-size: 12px;
  letter-spacing: 0.02em;
  text-transform: none;
}

.v14-page-table td {
  height: 80px;
  padding-top: 14px;
  padding-bottom: 14px;
  font-size: 13px;
}

.v14-page-table th:nth-child(1),
.v14-page-table td:nth-child(1) { width: 39%; }
.v14-page-table th:nth-child(2),
.v14-page-table td:nth-child(2) { width: 10%; }
.v14-page-table th:nth-child(3),
.v14-page-table td:nth-child(3) { width: 21%; }
.v14-page-table th:nth-child(4),
.v14-page-table td:nth-child(4) { width: 10%; }
.v14-page-table th:nth-child(5),
.v14-page-table td:nth-child(5) { width: 10%; }
.v14-page-table th:nth-child(6),
.v14-page-table td:nth-child(6) { width: 10%; }

.v14-page-table .client-primary-cell strong {
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
}

.v14-page-table .client-primary-cell small,
.v14-page-table td > small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.v14-page-table tbody tr.is-selected {
  background: #d9f0ec;
  box-shadow: inset 3px 0 0 var(--teal);
}

.v14-page-table tbody tr.is-selected:hover {
  background: #d2ebe6;
}

.v14-signal-badges {
  display: flex;
  gap: 4px;
  align-items: center;
  white-space: nowrap;
}

.v14-signal-badges span {
  display: inline-flex;
  min-width: 29px;
  min-height: 24px;
  align-items: center;
  justify-content: center;
  padding: 2px 5px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 720;
}

.v14-signal-badges .is-technical { color: #9d533f; background: var(--coral-soft); }
.v14-signal-badges .is-search { color: #3f6598; background: var(--blue-soft); }
.v14-signal-badges .is-generative { color: #66558f; background: var(--violet-soft); }
.v14-signal-badges .is-content { color: #2b7167; background: var(--teal-soft); }

.panel.v14-url-detail {
  top: 86px;
  max-height: calc(100vh - 106px);
  padding: 21px;
  border-radius: 16px;
}

.v14-detail-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

.v14-detail-header > div {
  min-width: 0;
}

.v14-detail-header .eyebrow {
  margin-bottom: 7px;
  color: var(--coral-ink);
  font-size: 11px;
}

.v14-detail-header h2 {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.16;
}

.v14-detail-header p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.v14-external-button {
  display: grid;
  width: 38px;
  height: 38px;
  padding: 0;
  place-items: center;
  color: var(--green);
  background: #fffefa;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}

.v14-external-button:hover {
  border-color: var(--green);
}

.v14-external-button .ui-icon {
  width: 17px;
}

.v14-detail-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin: 16px 0 18px;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 11px;
}

.v14-detail-metrics > div {
  min-width: 0;
  padding: 11px;
  border-left: 1px solid var(--line);
}

.v14-detail-metrics > div:first-child {
  border-left: 0;
}

.v14-detail-metrics span,
.v14-detail-metrics strong {
  display: block;
}

.v14-detail-metrics span {
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

.v14-detail-metrics strong {
  margin-top: 3px;
  overflow: hidden;
  color: var(--ink-soft);
  font-size: 13px;
  font-weight: 750;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.v14-detail-section {
  margin-top: 18px;
}

.v14-detail-section > div:first-child:not(.v14-object-list) {
  display: flex;
  gap: 10px;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 9px;
}

.v14-detail-section h3 {
  margin: 0;
  color: var(--ink-soft);
  font-size: 14px;
}

.v14-detail-section > div:first-child > span {
  color: var(--muted);
  font-size: 11px;
}

.v14-opportunity-card,
.v14-no-opportunity,
.v14-output-card {
  padding: 14px;
  background: #fbf8f1;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.v14-opportunity-list {
  display: grid;
  gap: 10px;
}

.v14-opportunity-tags {
  display: flex;
  gap: 5px;
  align-items: center;
}

.v14-opportunity-tags .badge {
  min-height: 23px;
  padding: 2px 8px;
  font-size: 10px;
}

.v14-opportunity-card h4,
.v14-no-opportunity strong {
  margin: 9px 0 0;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
}

.v14-opportunity-card p,
.v14-no-opportunity p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.v14-opportunity-card footer {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding-top: 10px;
  margin-top: 10px;
  border-top: 1px solid var(--line);
}

.v14-opportunity-card footer > span {
  color: var(--muted);
  font-size: 10px;
}

.v14-opportunity-card footer > span strong {
  color: var(--ink-soft);
}

.v14-opportunity-card footer button {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 0;
  color: var(--green);
  background: none;
  border: 0;
  cursor: pointer;
  font-size: 11px;
  font-weight: 750;
  white-space: nowrap;
}

.v14-opportunity-card footer .ui-icon {
  width: 13px;
}

.v14-detail-primary {
  padding-top: 14px;
}

.v14-detail-primary .button {
  min-height: 44px;
  font-size: 12px;
}

.v14-detail-primary .ui-icon {
  width: 15px;
}

.v14-object-list {
  display: grid;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 11px;
}

.v14-object-list button {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  padding: 10px 11px;
  text-align: left;
  background: #fffefa;
  border: 0;
  border-top: 1px solid var(--line);
  cursor: pointer;
}

.v14-object-list button:first-child {
  border-top: 0;
}

.v14-object-list button:hover {
  background: var(--surface-2);
}

.v14-object-list strong,
.v14-object-list small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.v14-object-list strong {
  color: var(--ink-soft);
  font-size: 11px;
}

.v14-object-list small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
}

.v14-object-list .ui-icon {
  width: 14px;
  color: var(--green);
}

.v14-output-card span,
.v14-output-card strong,
.v14-output-card small {
  display: block;
}

.v14-output-card span {
  color: var(--coral);
  font-size: 10px;
  font-weight: 780;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.v14-output-card strong {
  margin-top: 5px;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.45;
}

.v14-output-card small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
}

@media (max-width: 1280px) {
  .v14-page-toolbar {
    grid-template-columns: minmax(300px, 1fr) auto;
    gap: 12px 18px;
  }

  .v14-page-views {
    grid-column: 1 / -1;
    justify-content: flex-end;
  }

  .v14-page-layout {
    grid-template-columns: minmax(0, 1fr) 330px;
  }
}

@media (max-width: 1024px) {
  .v14-page-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .v14-page-summary > div:nth-child(3) {
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    border-left: 0;
  }

  .v14-page-summary > div:nth-child(4) {
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }

  .v14-page-layout {
    grid-template-columns: 1fr;
  }

  .panel.v14-url-detail {
    position: static;
    order: -1;
    max-height: none;
  }
}

@media (max-width: 760px) {
  .client-shell {
    --sidebar: 254px;
  }

  .v14-topbar-pill {
    display: none !important;
  }

  .panel.v14-map-tabs {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    min-width: 0;
    overflow: hidden;
  }

  .v14-map-tabs > button {
    display: grid;
    gap: 1px;
    min-width: 0;
  }

  .v14-map-tabs > button strong,
  .v14-map-tabs > button span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .v14-page-summary {
    min-height: 0;
  }

  .v14-page-summary > div {
    padding: 16px;
  }

  .v14-page-summary strong {
    font-size: 25px;
  }

  .v14-page-toolbar {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .v14-page-search,
  .v14-page-type,
  .v14-page-views {
    grid-column: 1;
  }

  .v14-page-type {
    justify-content: space-between;
  }

  .v14-page-type select {
    flex: 1;
  }

  .v14-page-views {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
  }

  .v14-page-views > div {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .v14-page-views button {
    padding: 0 7px;
  }

  .v14-page-table-card .client-table-scroll {
    overflow-x: auto;
  }

  .client-table.v14-page-table {
    display: table;
    width: 100%;
    min-width: 820px;
    table-layout: fixed;
  }

  .client-table.v14-page-table thead {
    display: table-header-group;
  }

  .client-table.v14-page-table tbody {
    display: table-row-group;
    padding: 0;
  }

  .client-table.v14-page-table tr {
    display: table-row;
    width: auto;
    padding: 0;
    margin: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
  }

  .client-table.v14-page-table tbody td,
  .client-table.v14-page-table tbody td:first-child,
  .client-table.v14-page-table tbody td:last-child {
    position: static;
    display: table-cell !important;
    width: auto;
    padding: 13px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  .client-table.v14-page-table tbody td::before {
    content: none;
  }

  .panel.v14-url-detail {
    padding: 18px;
  }
}

@media (max-width: 480px) {
  .v14-page-summary small {
    white-space: normal;
  }

  .v14-page-views {
    grid-template-columns: 1fr;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
  color: var(--ink);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 90% 0%, rgba(66, 169, 156, 0.1), transparent 28rem),
    var(--bg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
a:focus-visible {
  outline: 3px solid rgba(66, 169, 156, 0.36);
  outline-offset: 2px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: fixed;
  z-index: 200;
  top: 12px;
  left: 12px;
  padding: 10px 14px;
  color: white;
  background: var(--green-dark);
  border-radius: 8px;
  transform: translateY(-150%);
  transition: transform 0.2s ease;
}

.skip-link:focus {
  transform: translateY(0);
}

.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  z-index: 40;
  top: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: 24px 18px 18px;
  color: #edf5f1;
  background:
    radial-gradient(circle at 12% 6%, rgba(200, 239, 112, 0.18), transparent 11rem),
    radial-gradient(circle at 100% 76%, rgba(66, 169, 156, 0.12), transparent 16rem),
    var(--green-deep);
  border-right: 1px solid rgba(255, 255, 255, 0.07);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 6px 22px;
}

.brand__mark {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  color: var(--green-deep);
  background: var(--lime);
  border-radius: 14px 14px 14px 5px;
  box-shadow: inset 0 0 0 1px rgba(10, 45, 37, 0.18);
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 700;
}

.brand strong,
.brand small {
  display: block;
}

.brand strong {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.05;
}

.brand small {
  margin-top: 4px;
  color: #9eb4ac;
  font-size: 13px;
  letter-spacing: 0.03em;
}

.project-switcher {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
  width: 100%;
  padding: 13px 12px;
  color: inherit;
  text-align: left;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  cursor: pointer;
}

.project-switcher:hover {
  background: rgba(255, 255, 255, 0.1);
}

.project-switcher__avatar {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  color: var(--green-deep);
  background: #7fd8cc;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 700;
}

.project-switcher strong,
.project-switcher small {
  display: block;
}

.project-switcher strong {
  font-size: 15px;
}

.project-switcher small {
  margin-top: 1px;
  color: #94aaa3;
  font-size: 13px;
}

.primary-nav {
  display: grid;
  gap: 7px;
  margin-top: 26px;
}

.nav-item {
  position: relative;
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 10px;
  align-items: center;
  width: 100%;
  padding: 10px;
  color: #a8bbb5;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 13px;
  cursor: pointer;
  transition: 0.16s ease;
}

.nav-item::before {
  position: absolute;
  left: -19px;
  width: 4px;
  height: 28px;
  background: var(--lime);
  border-radius: 0 4px 4px 0;
  content: "";
  opacity: 0;
}

.nav-item:hover {
  color: white;
  background: rgba(255, 255, 255, 0.055);
}

.nav-item.is-active {
  color: white;
  background: rgba(255, 255, 255, 0.1);

.demo-label {

}

.workspace {

.topbar {

.topbar__actions {

.market-label,

}

.context-button {

.context-button:hover {

.context-button strong {

.avatar {

.button,

.button {

}

.button--secondary {

}

  height: 36px;

.metric-card > span:not(.metric-card__icon) {

.metric-card strong {

.dashboard-grid {

}

.dashboard-grid--bottom {

}

.panel {

}

.tone-coral { color: #9d402e !important; background-color: var(--coral-soft) !important; }

.tone-amber { color: #875c1d !important; background-color: var(--amber-soft) !important; }
.tone-violet { color: #584c87 !important; background-color: var(--violet-soft) !important; }
.tone-blue { color: #3b619b !important; background-color: var(--blue-soft) !important; }
.tone-green { color: #275f43 !important; background-color: #dcefdc !important; }

.priority-item__copy strong,
.priority-item__copy span {

}

}

.mix-row i.tone-blue { background: var(--blue) !important; }

.section-tab span {

.dataset-summary {

.dataset-summary span {

.group-control button,

.dataset-table-card {

.detail-overview span,
.keyword-metrics span {

.detail-overview strong,

.keyword-metrics {

.detail-section-heading {

.detail-section-heading h3 {

.detail-section-heading span {

.cluster-row__index {

.cluster-row strong,
.cluster-row small {

}

.cluster-row small {

}

.opportunity-table-list {

.opportunity-table-row {

.opportunity-table-row__rank {

}

.opportunity-table-row strong,
.opportunity-table-row small {

}

.opportunity-table-row small {

}

.source-strip {

.source-strip__intro strong {

.source-strip__intro p {

.source-dot.tone-coral { background: var(--coral) !important; }

.source-dot.tone-gray { background: #a0aaa6 !important; }

.source-chip strong,
.source-chip small {

.source-chip small {

.provenance-card strong,
.provenance-card small {

.provenance-card span,

.competitor-source-grid p {

}

.dataset-count strong {

.dataset-count span {

}

.dataset-count i {

.why-card {

}

.why-card span {
  color: #7a541b;

}

.why-card p {

.execution-toolbar {

.utm-plan-list span {
  color: var(--muted);
}

.publish-verification {
  grid-column: 1 / -1;
}

.publish-verification h3 {
  margin: 0 0 6px;
  font-family: var(--serif);
  font-size: 21px;
}

.publish-verification .acceptance-item {
  display: inline-flex;
  width: calc(50% - 8px);
  margin-right: 8px;
  vertical-align: top;
}

.metadata-document {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) 34px minmax(240px, 1fr) 280px;
  gap: 14px;
  align-items: stretch;
  margin-top: 22px;
}

.metadata-document > section,
.metadata-document > aside {
  padding: 20px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 13px;
}

.metadata-document > section h3 {
  margin: 14px 0 7px;
  font-family: var(--serif);
  font-size: 25px;
  line-height: 1.25;
}

.metadata-document > section p,
.metadata-document > aside p {
  color: var(--ink-soft);
  font-size: 14px;
}

.metadata-document > section small {
  color: var(--muted);
  font-size: 13px;
}

.metadata-proposed {
  background: var(--teal-soft) !important;
  border-color: #b8dfd8 !important;
}

.metadata-arrow {
  display: grid;
  place-items: center;
  color: var(--green);
}

.measurement-window {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr) minmax(210px, 0.8fr);
  gap: 16px;
  align-items: center;
  padding: 17px 20px;
  margin-bottom: 14px;
  color: white;
  background: var(--green-dark);
  border-radius: var(--radius);
}

.measurement-window span,
.measurement-window strong {
  display: block;
}

.measurement-window__label {
  color: #acbeb8;
  font-size: 13px;
  font-weight: 600;
}

.measurement-window__label--current {
  color: var(--lime);
}

.measurement-window strong {
  margin-top: 2px;
  font-size: 15px;
}

.measurement-window__arrow {
  color: var(--lime);
}

.measurement-window__note {
  padding-left: 16px;
  color: #aebfba;
  border-left: 1px solid rgba(255, 255, 255, 0.13);
  font-size: 13px;
}

.target-state-label {
  display: inline-block;
  padding: 3px 7px;
  margin-bottom: 5px;
  color: #604515;
  background: var(--amber);
  border-radius: 999px;
  font-size: 10px;
  letter-spacing: 0.055em;
}

.result-metrics {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.result-metrics article {
  min-width: 0;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 13px;
}

.result-metrics article > span,
.result-metrics p {
  display: block;
  color: var(--muted);
  font-size: 13px;
}

.result-metrics article > div {
  display: flex;
  gap: 4px;
  align-items: center;
  margin: 8px 0 2px;
}

.result-metrics article > div small {
  color: var(--muted);
  font-size: 13px;
  text-decoration: line-through;
}

.result-metrics article > div strong {
  font-family: var(--serif);
  font-size: 25px;
}

.result-metrics article b {
  color: var(--green);
  font-size: 13px;
}

.result-metrics p {
  margin: 4px 0 0;
  line-height: 1.4;
}

.result-tabs {
  display: flex;
  gap: 4px;
  width: max-content;
  max-width: 100%;
  padding: 4px;
  margin-bottom: 14px;
  background: #e2ded5;
  border-radius: 11px;
}

.result-tabs button {
  min-width: 110px;
}

.results-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(330px, 0.75fr);
  gap: 14px;
}

.chart-legend {
  display: flex;
  gap: 12px;
}

.chart-legend span {
  display: flex;
  gap: 5px;
  align-items: center;
  color: var(--muted);
  font-size: 13px;
}

.chart-legend i {
  width: 9px;
  height: 9px;
  border-radius: 3px;
}

.legend-before { background: #c9c4b9; }
.legend-after { background: var(--teal); }

.bar-chart {
  display: grid;
  gap: 18px;
  padding: 8px 0;
}

.bar-chart__row {
  display: grid;
  grid-template-columns: 105px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  font-size: 13px;
}

.bar-pair {
  display: grid;
  gap: 5px;
}

.bar-pair i {
  position: relative;
  display: block;
  min-width: 36px;
  height: 18px;
  border-radius: 4px;
  font-style: normal;
}

.bar-pair i b {
  position: absolute;
  left: calc(100% + 6px);
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  line-height: 18px;
}

.bar-before { background: #d3cfc5; }
.bar-after { background: var(--teal); }

.result-timeline ol {
  padding: 0;
  margin: 0;
  list-style: none;
}

.result-timeline li {
  position: relative;
  display: grid;
  grid-template-columns: 66px 1fr;
  gap: 12px;
  padding: 2px 0 19px 25px;
  border-left: 2px solid var(--line);
}

.result-timeline li::before {
  position: absolute;
  top: 3px;
  left: -7px;
  width: 12px;
  height: 12px;
  background: var(--surface);
  border: 3px solid var(--line-strong);
  border-radius: 50%;
  content: "";
}

.result-timeline li.is-done::before {
  border-color: var(--teal);
  background: var(--teal);
}

.result-timeline li.is-current::before {
  border-color: var(--lime);
  background: var(--green-dark);
  box-shadow: 0 0 0 4px var(--lime-soft);
}

.result-timeline li > span {
  color: var(--muted);
  font-size: 13px;
}

.result-timeline strong,
.result-timeline p {
  display: block;
  margin: 0;
}

.result-timeline strong {
  font-size: 14px;
}

.result-timeline p {
  color: var(--muted);
  font-size: 13px;
}

.measurement-note {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 17px;
  margin-top: 14px;
  color: #285f56;
  background: var(--teal-soft);
  border: 1px solid #bee0da;
  border-radius: 12px;
}

.measurement-note svg {
  flex: 0 0 auto;
  margin-top: 2px;
}

.measurement-note strong {
  font-size: 14px;
}

.measurement-note p {
  margin: 2px 0 0;
  color: #55746d;
  font-size: 13px;
}

.result-table-panel {
  padding: 0;
  overflow: hidden;
}

.result-table-panel .panel-heading {
  padding: 22px 22px 0;
}

.metric-compare {
  display: flex;
  gap: 5px;
  align-items: center;
  white-space: nowrap;
}

.metric-compare span {
  color: var(--muted);
  text-decoration: line-through;
}

.metric-compare strong {
  color: var(--green);
}

.utm-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  margin: 0 22px 18px;
  overflow: hidden;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 11px;
}

.utm-summary > div {
  padding: 14px;
  background: var(--surface-2);
}

.utm-summary span,
.utm-summary strong,
.utm-summary small {
  display: block;
}

.utm-summary span,
.utm-summary small {
  color: var(--muted);
  font-size: 13px;
}

.utm-summary strong {
  margin: 3px 0;
  font-family: var(--serif);
  font-size: 25px;
}

.attribution-footnote {
  display: flex;
  gap: 18px;
  padding: 15px 20px;
  background: var(--amber-soft);
  border-top: 1px solid #ead7aa;
}

.attribution-footnote strong {
  flex: 0 0 auto;
  font-size: 13px;
}

.attribution-footnote p {
  margin: 0;
  color: #6e5b3d;
  font-size: 13px;
}

.modal-backdrop {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: grid;
  padding: 24px;
  overflow-y: auto;
  place-items: center;
  background: rgba(9, 25, 21, 0.6);
  backdrop-filter: blur(9px);
}

.context-dialog,
.small-dialog {
  width: min(1120px, 100%);
  max-height: calc(100vh - 48px);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 22px;
  box-shadow: 0 26px 80px rgba(7, 24, 19, 0.28);
}

.context-dialog {
  display: grid;
  height: min(900px, calc(100vh - 48px));
  grid-template-rows: auto auto minmax(0, 1fr) auto;
}

.context-dialog > header,
.small-dialog > header {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  justify-content: space-between;
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--line);
}

.context-dialog > header h2,
.small-dialog > header h2 {
  margin: 4px 0 2px;
  font-family: var(--serif);
  font-size: 29px;
}

.context-dialog > header p,
.small-dialog > header p {
  max-width: 820px;
  margin: 0;
  color: var(--muted);
  font-size: 15px;
}

.context-progress {
  height: 5px;
  background: var(--surface-3);
}

.context-progress > div {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--teal));
}

.context-dialog__body {
  display: grid;
  grid-template-columns: 225px minmax(0, 1fr);
  min-height: 0;
}

.context-dialog__body > nav {
  padding: 18px;
  background: var(--green-dark);
}

.context-dialog__body > nav button {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 9px;
  align-items: flex-start;
  width: 100%;
  padding: 14px 10px;
  color: #99ada7;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}

.context-dialog__body > nav button > span:first-child {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  font-size: 13px;
}

.context-dialog__body > nav button strong,
.context-dialog__body > nav button small {
  display: block;
}

.context-dialog__body > nav button strong {
  color: inherit;
  font-size: 14.5px;
}

.context-dialog__body > nav button small {
  color: inherit;
  font-size: 13.5px;
}

.context-dialog__body > nav button:disabled {
  cursor: default;
  opacity: 0.46;
}

.context-dialog__body > nav button.is-active {
  color: white;
  background: rgba(255, 255, 255, 0.1);
}

.context-dialog__body > nav button.is-active > span:first-child {
  color: var(--green-deep);
  background: var(--lime);
  border-color: var(--lime);
}

.context-dialog__body > nav button.is-complete > span:first-child {
  color: var(--green-deep);
  background: #80d5c8;
  border-color: #80d5c8;
}

.context-dialog__body > nav button.is-active > span:first-child {
  color: var(--green-deep);
  background: var(--lime);
  border-color: var(--lime);
}

.context-step-content {
  padding: 25px 28px 34px;
  overflow-y: auto;
}

.context-step-heading {
  margin-bottom: 17px;
}

.context-step-heading > span {
  color: var(--coral);
  font-size: 13.5px;
  font-weight: 700;
}

.context-step-heading h3 {
  margin: 2px 0 3px;
  font-family: var(--serif);
  font-size: 27px;
}

.context-step-heading p {
  margin: 0;
  color: var(--muted);
  font-size: 15px;
}

.context-step-title {
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
}

.context-step-title > strong {
  flex: 0 0 auto;
  padding: 5px 9px;
  color: var(--green);
  background: var(--lime-soft);
  border-radius: 999px;
  font-size: 13.5px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.form-field,
.small-dialog form > label,
.small-dialog form .form-grid label {
  display: block;
  color: var(--ink-soft);
  font-size: 14.5px;
  font-weight: 600;
}

.form-field--full {
  grid-column: 1 / -1;
}

.form-field > span {
  display: flex;
  gap: 7px;
  align-items: center;
  margin-bottom: 5px;
}

.form-field em {
  padding: 2px 6px;
  color: #4e4e8f;
  background: var(--violet-soft);
  border-radius: 4px;
  font-size: 12.5px;
  font-style: normal;
  font-weight: 700;
}

.form-field input,
.form-field textarea,
.form-field select,
.small-dialog input,
.small-dialog textarea,
.small-dialog select {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  color: var(--ink);
  background: white;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  font-size: 15px;
  font-weight: 400;
}

.form-field select {
  cursor: pointer;
}

.form-field textarea,
.small-dialog textarea {
  resize: vertical;
  line-height: 1.5;
}

.form-field small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 400;
}

.field-provenance {
  display: flex;
  gap: 7px 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 7px 9px;
  margin-top: 7px;
  color: var(--muted);
  background: var(--surface-2);
  border-left: 3px solid var(--line-strong);
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.45;
}

.field-provenance strong {
  color: var(--ink-soft);
  font-size: 12px;
  letter-spacing: 0.035em;
}

.field-provenance > span {
  flex: 1 1 280px;
}

.field-provenance--observed { border-left-color: var(--teal); background: var(--teal-soft); }
.field-provenance--computed { border-left-color: #6e92c4; background: var(--blue-soft); }
.field-provenance--inferred { border-left-color: #8b83bf; background: var(--violet-soft); }
.field-provenance--missing { border-left-color: #d2a352; background: var(--amber-soft); }
.field-provenance--contradicted { border-left-color: #d66c5b; background: #fff0ec; }

.auto-note {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 13px;
  margin-top: 15px;
  color: #4f4a7b;
  background: var(--violet-soft);
  border-radius: 10px;
  font-size: 13px;
}

.auto-note svg {
  flex: 0 0 auto;
  margin-top: 2px;
}

.intake-principle,
.discovery-safety {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  margin-bottom: 18px;
  color: #4f4a7b;
  background: var(--violet-soft);
  border: 1px solid rgba(128, 110, 177, 0.18);
  border-radius: 12px;
}

.intake-principle > span,
.discovery-safety > svg {
  flex: 0 0 auto;
  margin-top: 2px;
}

.intake-principle strong,
.intake-principle p {
  display: block;
}

.intake-principle strong {
  font-size: 15px;
}

.intake-principle p {
  margin: 2px 0 0;
  font-size: 14px;
  line-height: 1.55;
}

.context-form-section {
  padding: 17px;
  margin-top: 14px;
  background: rgba(255, 255, 255, 0.54);
  border: 1px solid var(--line);
  border-radius: 14px;
}

.context-form-section > header {
  display: flex;
  gap: 12px;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}

.context-form-section > header span {
  color: var(--ink);
  font-size: 16px;
  font-weight: 700;
}

.context-form-section > header small {
  color: var(--muted);
  font-size: 13px;
}

.multi-picker {
  position: relative;
}

.multi-picker > summary {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  min-height: 46px;
  padding: 8px 11px;
  list-style: none;
  color: var(--ink);
  background: white;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  cursor: pointer;
}

.multi-picker > summary::-webkit-details-marker,
.optional-context > summary::-webkit-details-marker,
.review-card > summary::-webkit-details-marker {
  display: none;
}

.multi-picker[open] > summary {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(66, 169, 156, 0.16);
}

.multi-picker > summary > svg,
.optional-context > summary > svg {
  flex: 0 0 auto;
  transition: transform 0.18s ease;
}

.multi-picker[open] > summary > svg,
.optional-context[open] > summary > svg {
  transform: rotate(90deg);
}

.multi-picker__summary {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.choice-chip {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 3px 8px;
  color: var(--green-dark);
  background: var(--teal-soft);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
}

.choice-chip small,
.form-field .choice-chip small {
  display: inline;
  padding: 1px 5px;
  margin: 0;
  color: #4f6963;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 800;
}

.choice-placeholder {
  color: var(--muted);
  font-weight: 400;
}

.multi-picker__menu {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  padding: 10px;
  margin-top: 6px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow-soft);
}

.multi-picker__option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 40px;
  padding: 3px;
  background: var(--surface-2);
  border-radius: 8px;
}

.multi-picker__include {
  display: flex;
  gap: 8px;
  align-items: center;
  flex: 1;
  min-width: 0;
  min-height: 36px;
  padding: 5px 6px;
  color: var(--ink-soft);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}

.market-primary {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  padding: 5px 7px;
  color: var(--muted);
  background: white;
  border: 1px solid var(--line);
  border-radius: 999px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
}

.market-primary:has(input:checked) {
  color: var(--green);
  background: var(--lime-soft);
  border-color: #b7d971;
}

.market-primary:has(input:disabled) {
  cursor: not-allowed;
  opacity: 0.45;
}

.market-primary input {
  width: 13px;
  height: 13px;
  min-height: 0;
}

.multi-picker__menu input,
.url-candidate input,
.competitor-candidate-grid input {
  width: 17px;
  height: 17px;
  min-height: 0;
  accent-color: var(--green);
}

.optional-context {
  margin-top: 14px;
  border-top: 1px dashed var(--line);
}

.optional-context > summary {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 2px 2px;
  list-style: none;
  color: var(--green);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}

.optional-context > .form-field {
  margin-top: 12px;
}

.detected-defaults {
  margin-top: 13px;
  overflow: hidden;
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
}

.detected-defaults > summary {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 70px;
  padding: 11px 14px;
  list-style: none;
  cursor: pointer;
}

.detected-defaults > summary::-webkit-details-marker {
  display: none;
}

.detected-defaults__icon {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  color: var(--green);
  background: var(--teal-soft);
  border-radius: 9px;
}

.detected-defaults > summary strong,
.detected-defaults > summary small {
  display: block;
}

.detected-defaults > summary strong {
  font-size: 14.5px;
}

.detected-defaults > summary small {
  color: var(--muted);
  font-size: 13px;
  font-weight: 400;
}

.detected-defaults > summary em {
  padding: 4px 8px;
  color: #4f4a7b;
  background: var(--violet-soft);
  border-radius: 999px;
  font-size: 12.5px;
  font-style: normal;
  font-weight: 700;
}

.detected-defaults__body {
  padding: 14px;
  border-top: 1px solid var(--line);
}

.detected-defaults__body > p {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 13.5px;
}

.discovery-progress {
  height: 9px;
  margin: 20px 0 18px;
  overflow: hidden;
  background: var(--surface-3);
  border-radius: 999px;
}

.discovery-progress > div {
  height: 100%;
  background: linear-gradient(90deg, var(--teal), var(--lime));
  border-radius: inherit;
  transition: width 0.35s ease;
}

.discovery-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.discovery-phase {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr);
  gap: 11px;
  min-height: 126px;
  padding: 15px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 13px;
}

.discovery-phase--active {
  background: var(--violet-soft);
  border-color: rgba(128, 110, 177, 0.45);
  box-shadow: 0 0 0 3px rgba(128, 110, 177, 0.08);
}

.discovery-phase--done {
  background: #f1f8e2;
  border-color: #b9d977;
}

.discovery-phase--queued {
  opacity: 0.65;
}

.discovery-phase__icon {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  color: var(--green);
  background: white;
  border: 1px solid var(--line);
  border-radius: 50%;
}

.discovery-phase__title {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  justify-content: space-between;
}

.discovery-phase__title strong {
  font-size: 15px;
}

.discovery-phase__title em {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 12px;
  font-style: normal;
  font-weight: 700;
}

.discovery-phase p {
  margin: 3px 0 8px;
  color: var(--ink-soft);
  font-size: 13.5px;
  line-height: 1.5;
}

.discovery-phase small {
  color: var(--muted);
  font-size: 12.5px;
}

.discovery-safety {
  margin: 16px 0 0;
  font-size: 13.5px;
}

.discovery-result {
  margin-top: 17px;
  overflow: hidden;
  background: var(--green-dark);
  border-radius: 14px;
}

.discovery-result > header {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  color: white;
  border-bottom: 1px solid rgba(255, 255, 255, 0.13);
}

.discovery-result > header > div {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.discovery-result > header svg {
  flex: 0 0 auto;
  margin-top: 2px;
  color: var(--lime);
}

.discovery-result > header strong,
.discovery-result > header p {
  display: block;
}

.discovery-result > header strong {
  font-size: 15px;
}

.discovery-result > header p {
  margin: 2px 0 0;
  color: #b9cbc5;
  font-size: 13px;
}

.discovery-result > header em {
  flex: 0 0 auto;
  padding: 4px 8px;
  color: var(--green-deep);
  background: var(--lime);
  border-radius: 999px;
  font-size: 12px;
  font-style: normal;
  font-weight: 800;
}

.discovery-result > div {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
}

.discovery-result > div > span {
  padding: 14px 10px;
  color: white;
  text-align: center;
  border-left: 1px solid rgba(255, 255, 255, 0.1);
}

.discovery-result > div > span:first-child {
  border-left: 0;
}

.discovery-result > div strong,
.discovery-result > div small {
  display: block;
}

.discovery-result > div strong {
  font-family: var(--serif);
  font-size: 23px;
}

.discovery-result > div small {
  color: #b9cbc5;
  font-size: 12px;
}

.review-overview {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  padding: 10px;
  margin-bottom: 13px;
  background: var(--teal-soft);
  border-radius: 11px;
}

.review-overview span {
  color: #45635d;
  text-align: center;
  font-size: 13.5px;
}

.review-overview strong {
  color: var(--green-deep);
  font-size: 16px;
}

.review-stack {
  display: grid;
  gap: 10px;
}

.review-card {
  overflow: hidden;
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
}

.review-card[open] {
  border-color: rgba(66, 169, 156, 0.62);
  box-shadow: 0 8px 22px rgba(30, 49, 43, 0.07);
}

.review-card > summary {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  gap: 11px;
  align-items: center;
  min-height: 72px;
  padding: 12px 15px;
  list-style: none;
  cursor: pointer;
}

.review-card > summary::after {
  content: "";
  grid-column: 1 / -1;
  height: 0;
}

.review-card__icon {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  color: var(--green);
  background: var(--teal-soft);
  border-radius: 10px;
}

.review-card > summary strong,
.review-card > summary small {
  display: block;
}

.review-card > summary strong {
  color: var(--ink);
  font-size: 15.5px;
}

.review-card > summary small {
  margin-top: 1px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 400;
}

.review-card > summary > em {
  padding: 4px 8px;
  color: #52645f;
  background: var(--surface-2);
  border-radius: 999px;
  font-size: 12.5px;
  font-style: normal;
  font-weight: 700;
}

.review-card--optional > summary > em {
  color: #795d28;
  background: var(--amber-soft);
}

.review-card__body {
  padding: 15px;
  border-top: 1px solid var(--line);
}

.review-card__notice,
.review-source-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.review-card__notice span,
.review-source-row span {
  padding: 3px 7px;
  color: #4f4a7b;
  background: var(--violet-soft);
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
}

.review-card__notice strong {
  color: var(--green);
  font-size: 13px;
}

.context-module-notice code {
  color: inherit;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.context-module-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}

.context-module {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  gap: 7px 9px;
  align-items: start;
  min-height: 112px;
  padding: 11px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}

.context-module.is-selected {
  background: var(--lime-soft);
  border-color: #b7d971;
}

.context-module.is-required {
  background: var(--teal-soft);
  border-color: rgba(66, 169, 156, 0.45);
  cursor: default;
}

.context-module > input {
  width: 17px;
  height: 17px;
  margin-top: 2px;
  accent-color: var(--green);
}

.context-module > span strong,
.context-module > span small,
.context-module > span em {
  display: block;
}

.context-module > span strong {
  color: var(--ink);
  font-size: 14px;
}

.context-module > span small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.45;
}

.context-module > span em {
  margin-top: 6px;
  color: var(--green);
  font-size: 12.5px;
  font-style: normal;
  font-weight: 700;
}

.context-module > b {
  grid-column: 2;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.context-module-divider {
  display: flex;
  gap: 8px 14px;
  align-items: baseline;
  justify-content: space-between;
  padding-top: 13px;
  margin-bottom: 9px;
  border-top: 1px solid var(--line);
}

.context-module-divider span {
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
}

.context-module-divider small {
  color: var(--muted);
  font-size: 13px;
}

.context-attribute-list {
  display: grid;
  gap: 1px;
  overflow: hidden;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.context-attribute {
  display: grid;
  grid-template-columns: minmax(155px, 0.9fr) minmax(220px, 1.25fr) auto 138px;
  gap: 9px;
  align-items: center;
  min-height: 64px;
  padding: 9px 10px;
  background: white;
}

.context-attribute__name strong,
.context-attribute__name small,
.context-attribute__value strong,
.context-attribute__value small {
  display: block;
}

.context-attribute__name strong,
.context-attribute__value strong {
  color: var(--ink-soft);
  font-size: 13.5px;
}

.context-attribute__name small,
.context-attribute__value small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.4;
}

.context-attribute__name code {
  color: #4f4a7b;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.95em;
}

.context-attribute__derivation {
  padding: 3px 7px;
  border-radius: 5px;
  font-size: 12px;
  font-style: normal;
  font-weight: 800;
  white-space: nowrap;
}

.context-attribute__derivation--observed { color: #1e625a; background: var(--teal-soft); }
.context-attribute__derivation--missing { color: #795d28; background: var(--amber-soft); }
.context-attribute__derivation--declared { color: #2f5a1d; background: var(--lime-soft); }

.context-attribute select,
.context-attribute-add input,
.context-attribute-add select {
  width: 100%;
  min-height: 40px;
  padding: 7px 9px;
  color: var(--ink);
  background: white;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  font-size: 14px;
}

.context-attribute-add {
  display: grid;
  grid-template-columns: 1.1fr 1fr 0.7fr 1fr auto;
  gap: 8px;
  align-items: end;
  padding: 12px;
  margin-top: 10px;
  background: var(--surface-2);
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
}

.context-attribute-add label > span {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.context-module-footnote {
  margin: 8px 2px 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.icp-candidate-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
  margin-bottom: 16px;
}

.icp-candidate {
  min-height: 136px;
  padding: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.icp-candidate.is-primary {
  background: var(--lime-soft);
  border-color: #b7d971;
}

.icp-candidate.is-excluded {
  background: #f7f4ef;
  opacity: 0.72;
}

.icp-candidate > header,
.icp-candidate > footer {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}

.icp-candidate > header span {
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.icp-candidate > header strong {
  font-family: var(--serif);
  font-size: 22px;
}

.icp-candidate h4 {
  margin: 7px 0 3px;
  font-size: 13.5px;
  line-height: 1.35;
}

.icp-candidate p {
  min-height: 38px;
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.icp-candidate > footer {
  padding-top: 7px;
  color: var(--muted);
  border-top: 1px solid rgba(107, 119, 114, 0.16);
  font-size: 10.5px;
}

.text-button {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 5px 0;
  color: var(--green);
  background: transparent;
  border: 0;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 700;
}

.url-candidate-list {
  display: grid;
  gap: 1px;
  margin-bottom: 8px;
  overflow: hidden;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.url-candidate {
  display: grid;
  grid-template-columns: 20px minmax(150px, 0.8fr) minmax(220px, 1.4fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 58px;
  padding: 9px 11px;
  background: white;
  cursor: pointer;
}

.url-candidate__path strong,
.url-candidate__path small {
  display: block;
}

.url-candidate__path strong {
  overflow: hidden;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.url-candidate__path small,
.url-candidate__reason {
  color: var(--muted);
  font-size: 12.5px;
}

.url-candidate > em {
  padding: 3px 6px;
  color: #4f4a7b;
  background: var(--violet-soft);
  border-radius: 5px;
  font-size: 11.5px;
  font-style: normal;
  font-weight: 700;
  white-space: nowrap;
}

.url-inventory-panel {
  padding: 14px;
  margin-top: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 11px;
}

.url-inventory-panel > header {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}

.url-inventory-panel > header strong,
.url-inventory-panel > header small {
  display: block;
}

.url-inventory-panel > header strong {
  color: var(--ink);
  font-size: 14.5px;
}

.url-inventory-panel > header small,
.url-inventory-panel > header > span {
  color: var(--muted);
  font-size: 12.5px;
}

.url-inventory-search,
.url-inventory-add {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: end;
}

.url-inventory-search input,
.url-inventory-add input {
  width: 100%;
  min-height: 42px;
  padding: 8px 11px;
  color: var(--ink);
  background: white;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  font-size: 14px;
}

.url-inventory-list {
  display: grid;
  gap: 1px;
  max-height: 260px;
  margin: 10px 0;
  overflow: auto;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 9px;
}

.url-inventory-row {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) auto;
  gap: 9px;
  align-items: center;
  min-height: 54px;
  padding: 8px 10px;
  background: white;
  cursor: pointer;
}

.url-inventory-row input {
  width: 17px;
  height: 17px;
  accent-color: var(--green);
}

.url-inventory-row strong,
.url-inventory-row small,
.url-inventory-add label > span {
  display: block;
}

.url-inventory-row strong {
  overflow: hidden;
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.url-inventory-row small,
.url-inventory-row em,
.url-inventory-empty,
.url-inventory-add label > span {
  color: var(--muted);
  font-size: 12px;
}

.url-inventory-row em {
  padding: 3px 6px;
  background: var(--violet-soft);
  border-radius: 5px;
  font-style: normal;
  font-weight: 700;
  white-space: nowrap;
}

.url-inventory-empty {
  padding: 18px;
  margin: 0;
  background: white;
  text-align: center;
}

.url-inventory-add label > span {
  margin-bottom: 4px;
  font-weight: 700;
}

.review-subheading {
  margin: 4px 0 8px;
  font-size: 14px;
}

.generated-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 16px;
}

.generated-chips > span {
  padding: 7px 9px;
  color: var(--ink-soft);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 13px;
}

.generated-chips small {
  display: block;
  color: var(--muted);
  font-size: 11px;
}

.competitor-candidate-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.competitor-candidate-grid label {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  min-height: 60px;
  padding: 9px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  cursor: pointer;
}

.competitor-candidate-grid strong,
.competitor-candidate-grid small {
  display: block;
}

.competitor-candidate-grid strong {
  font-size: 13.5px;
}

.competitor-candidate-grid small {
  color: var(--muted);
  font-size: 12px;
}

.competitor-candidate-grid em {
  color: #4f4a7b;
  font-size: 11.5px;
  font-style: normal;
}

.launch-readiness {
  display: flex;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
  padding: 17px 18px;
  color: white;
  background: var(--green-dark);
  border-radius: 13px;
}

.launch-readiness > div {
  display: flex;
  gap: 11px;
  align-items: flex-start;
}

.launch-readiness svg {
  flex: 0 0 auto;
  margin-top: 2px;
  color: var(--lime);
}

.launch-readiness strong,
.launch-readiness p {
  display: block;
}

.launch-readiness strong {
  font-size: 16px;
}

.launch-readiness p {
  margin: 2px 0 0;
  color: #b9cbc5;
  font-size: 13.5px;
}

.launch-readiness em {
  padding: 5px 9px;
  color: var(--green-deep);
  background: var(--lime);
  border-radius: 999px;
  font-size: 12px;
  font-style: normal;
  font-weight: 800;
}

.confirm-stat-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 13px;
}

.confirm-stat-grid article {
  min-height: 112px;
  padding: 13px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 11px;
}

.confirm-stat-grid span,
.confirm-stat-grid strong,
.confirm-stat-grid small {
  display: block;
}

.confirm-stat-grid span {
  color: var(--muted);
  font-size: 12.5px;
}

.confirm-stat-grid strong {
  margin: 2px 0;
  font-family: var(--serif);
  font-size: 21px;
}

.confirm-stat-grid small {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.source-ledger {
  margin-top: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 11px;
}

.source-ledger > header,
.source-ledger > div {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 47px;
  padding: 8px 12px;
  border-top: 1px solid var(--line);
}

.source-ledger > header {
  display: flex;
  justify-content: space-between;
  min-height: 48px;
  background: var(--surface-2);
  border-top: 0;
}

.source-ledger h4,
.source-ledger p {
  margin: 0;
}

.source-ledger h4 {
  font-size: 14.5px;
}

.source-ledger > header span,
.source-ledger p,
.source-ledger > div > strong {
  color: var(--muted);
  font-size: 12.5px;
}

.source-ledger__tone {
  padding: 3px 7px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 800;
  text-align: center;
}

.source-ledger__tone--user { color: #2f5a1d; background: var(--lime-soft); }
.source-ledger__tone--public { color: #1e625a; background: var(--teal-soft); }
.source-ledger__tone--provider { color: #315b93; background: var(--blue-soft); }
.source-ledger__tone--ai { color: #4f4a7b; background: var(--violet-soft); }
.source-ledger__tone--missing { color: #795d28; background: var(--amber-soft); }
.source-ledger__tone--conflict { color: #934638; background: #fff0ec; }

.launch-pack-summary {
  padding: 14px;
  margin-top: 14px;
  background: var(--teal-soft);
  border: 1px solid rgba(66, 169, 156, 0.38);
  border-radius: 11px;
}

.launch-pack-summary > header {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  justify-content: space-between;
}

.launch-pack-summary > header span,
.launch-pack-summary > header strong {
  display: block;
}

.launch-pack-summary > header span {
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.06em;
}

.launch-pack-summary > header strong {
  margin-top: 2px;
  color: var(--ink);
  font-size: 15px;
}

.launch-pack-summary > header em {
  padding: 4px 8px;
  color: #4f4a7b;
  background: var(--violet-soft);
  border-radius: 999px;
  font-size: 12.5px;
  font-style: normal;
  font-weight: 700;
}

.launch-pack-summary > div {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 11px;
}

.launch-pack-summary > div > span {
  padding: 7px 9px;
  color: var(--ink-soft);
  background: white;

.profile-auto-list > header {

.profile-generation-status > div > div {

.profile-generation-status i {

.profile-generation-status > em {

.profile-review-stack {

.product-profile-card,

.product-profile-identity p {

.product-value-proposition span,

.product-value-proposition p {

.product-profile-meta {

  border: 1px solid var(--line);

.product-profile-meta > div {

.product-profile-meta > div:last-child {

.product-profile-meta dd,

.profile-tag-list em {

.product-profile-columns ul {

.product-profile-columns li {
  display: flex;
  gap: 6px;
  align-items: center;

.product-profile-columns li svg {
  color: var(--teal);

.product-profile-card--editing .form-grid,
.profile-review-section--editing .form-grid {
  margin-top: 18px;
}

.audience-profile__hero {
  display: flex;
  gap: 20px;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0;
}

.audience-profile__hero span {
  color: var(--coral);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;

.audience-profile__hero h5 {

}

.audience-profile__hero p {

}

.audience-profile__hero > strong {

.audience-profile__hero > strong small {

.audience-fact-grid > div {

.audience-problem-grid > div {

.audience-problem-grid p {

.competitor-pool-summary {

.competitor-pool-summary span {

  background: var(--surface-2);
  border-radius: 999px;
  font-size: 13px;

.competitor-pool-summary strong {
  color: var(--green);

.profile-competitor-columns {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.profile-competitor-group {

}

.profile-competitor-group__title {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
}

.profile-competitor-group__title strong {
  font-size: 14px;
}

.profile-competitor-group__title span {
  color: var(--muted);
  font-size: 12.5px;
}

.profile-competitor-group > div:last-child {
  display: grid;
  gap: 7px;
}

.profile-competitor {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  gap: 9px;
  align-items: center;
  min-height: 62px;

  border: 1px solid var(--line);

.profile-competitor.is-selected {

.profile-competitor input {

.profile-competitor > span {

.profile-competitor > span strong,
.profile-competitor > span small,
.profile-competitor > em small {

}

.profile-competitor > span strong {
  font-size: 14px;
}

.profile-competitor > span small {

.profile-competitor > em {

.profile-competitor > em small {

.profile-competitor-add {

  background: var(--surface-2);
  border-radius: 10px;

.profile-competitor-add label > span {
  display: block;
  margin-bottom: 4px;

  font-size: 12px;
  font-weight: 700;

.profile-competitor-add input,
.profile-competitor-add select {
  width: 100%;
  min-height: 42px;
  padding: 8px 10px;
  color: var(--ink);
  background: white;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  font-size: 14px;
}

.toast-region {
  position: fixed;
  z-index: 160;
  right: 24px;
  bottom: 24px;
  pointer-events: none;
}

.toast {
  display: flex;
  gap: 9px;
  align-items: center;
  max-width: 420px;
  padding: 13px 16px;
  color: white;
  background: var(--green-dark);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  box-shadow: var(--shadow);
  font-size: 13.5px;
  animation: toast-in 0.22s ease-out both;

@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* v11 · Four capability lenses, one GenGrowth execution chain */
.data-table td { font-size: 15px; }
.opportunity-card p,
.quality-gate p,
.landing-change-grid p,
.observation-status p { font-size: 14px; }

.capability-system {
  padding: 24px;

    radial-gradient(circle at 90% 10%, rgba(200, 239, 112, 0.13), transparent 22rem),

  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);

.capability-system__heading {
  display: grid;

  gap: 28px;

.capability-system__heading h2 {

.capability-system__heading p {
  margin: 0;
  color: #b8c8c3;
  font-size: 15px;
}

.capability-lens-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 22px;
}

.capability-lens-card {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 11px;
  min-width: 0;
  padding: 16px;
  color: white;
  text-align: left;
  background: rgba(255, 255, 255, 0.065);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-top-width: 3px;
  border-radius: 14px;

  transition: transform 0.18s ease, background 0.18s ease;

.capability-lens-card:hover {

.tone-border-amber { border-top-color: var(--amber); }

.cluster-mapping {

.landing-document {

}

.landing-baseline { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 14px; color: white; background: var(--green-dark); border-radius: 12px; }

.landing-copy-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.landing-copy-compare article { padding: 18px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 13px; }

.landing-change-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 10px; }

  .context-dialog__body > nav button {

  .context-step-title {

  .form-grid {

  .discovery-phase {

  }

  .discovery-result > header {

  }

  .discovery-result > div {

    padding: 7px;
  }

  }

  .review-card > summary {

  }

  .detected-defaults > summary {
    grid-template-columns: 36px minmax(0, 1fr);
  }

  .detected-defaults > summary em {
    grid-column: 2;
    justify-self: start;
  }

  .review-card > summary > em {
    grid-column: 2;
    justify-self: start;
  }

  .url-candidate {
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 5px 9px;
    padding: 10px;
  }

  .url-candidate__reason,
  .url-candidate > em {
    grid-column: 2;
  }

  .url-candidate > em {
    justify-self: start;
  }

  .url-inventory-search,
  .url-inventory-add {
    grid-template-columns: 1fr;
  }

  .url-inventory-row {
    grid-template-columns: 20px minmax(0, 1fr);
  }

  .url-inventory-row > em {
    grid-column: 2;
    justify-self: start;
  }

  .context-module-grid,
  .context-attribute-add {
    grid-template-columns: 1fr;
  }

  .context-module {
    min-height: auto;
  }

  .context-module-divider {
    align-items: flex-start;
    flex-direction: column;
  }

  .context-attribute {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .context-attribute__value {
