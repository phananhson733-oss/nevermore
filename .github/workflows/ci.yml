name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  contracts-and-unit:
    name: Contracts, static checks, and unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          package-manager-cache: false

      - name: Enable pinned Corepack and pnpm
        run: |
          npm install --global corepack@0.34.5
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the pinned frozen specification contract
        run: pnpm verify:spec

      # The three verifiers behind `verify:spec` have their own `node --test`
      # suites, which vitest cannot collect (it takes `.ts` only) and which
      # nothing ran until now. Two of them had drifted red and stayed red for a
      # whole slice, unnoticed, while still looking like a guard. A gate nobody
      # runs is worse than no gate, so they run here, next to the gate they test.
      - name: Test the specification gate's own verifiers
        run: pnpm verify:spec:test

      - name: Verify implementation constants and provenance
        run: pnpm implementation:check

      - name: Test backup and restore drill safety gates
        run: pnpm restore:drill:test

      - name: Verify generated OpenAPI contracts are current
        run: pnpm contracts:check

      - name: Lint the clone-local OpenAPI contract
        run: pnpm openapi:lint

      - name: Scan committed secrets and verify runtime redaction boundaries
        run: pnpm secrets:scan

      - name: Audit moderate, high, and critical dependency vulnerabilities
        run: pnpm audit --audit-level moderate

      - name: Verify deployment configuration
        run: pnpm deploy:check

      - name: Lint workspaces
        run: pnpm lint

      - name: Typecheck workspaces
        run: pnpm typecheck

      # The 80% coverage gate moved to the `database` job, where it can be
      # measured over unit AND integration together (see vitest.config.ts).
      # This job still runs the unit project, and still reports — without any
      # threshold — which files no unit test reaches at all, so the merged
      # gate cannot quietly bury that fact. A failing unit test still fails
      # this step; a low coverage number does not.
      - name: Run unit tests and report files no unit test reaches
        run: pnpm coverage:unit-gaps

  database:
    name: PostgreSQL 16 contract and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: signalframe_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalframe_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalframe_ci
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalframe_e2e_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          package-manager-cache: false

      - name: Enable pinned Corepack and pnpm
        run: |
          npm install --global corepack@0.34.5
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Replay migrations to prove idempotency
        run: pnpm db:migrate

      - name: Check database contract drift
        run: pnpm db:migrate:check

      - name: Run transactional schema smoke test
        run: pnpm db:smoke

      # Both projects in one process, so coverage is reported over the union.
      # This job already has Postgres and already ran the integration project,
      # so the marginal cost is the unit project (~17s) plus instrumentation.
      # The 80% thresholds in vitest.config.ts gate here.
      - name: Run unit and PostgreSQL integration tests with 80% coverage thresholds
        run: pnpm test:coverage

      - name: Run PostgreSQL backup and restore recovery drill
        env:
          RESTORE_DRILL_REPORT_DIR: ${{ runner.temp }}/restore-drill-evidence
        run: pnpm restore:drill

      - name: Preserve redacted restore drill evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill-evidence
          path: |
            ${{ runner.temp }}/restore-drill-evidence/*.json
            ${{ runner.temp }}/restore-drill-evidence/*.md
          if-no-files-found: error
          retention-days: 14

      - name: Install Chromium for real responsive and a11y E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare isolated database for real browser E2E
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres signalframe_e2e_ci
          pnpm db:migrate

      - name: Run database-backed responsive and a11y E2E
        run: pnpm test:e2e:real

      - name: Preserve failed real browser visual comparisons
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-real-e2e-visuals-${{ github.run_id }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Drop isolated real browser E2E database
        if: ${{ always() }}
        env:
          PGPASSWORD: postgres
        run: >-
          dropdb --if-exists --force --host 127.0.0.1 --port 5432
          --username postgres signalframe_e2e_ci

  build-and-mock-e2e:
    name: Production build, worker image, and isolated mock E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: signalframe_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalframe_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_BUILD_SHA: ${{ github.sha }}
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalframe_ci
      SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_ANON_KEY: ci-local-only
      SUPABASE_SERVICE_ROLE_KEY: ci-local-only
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GOOGLE_OAUTH_CLIENT_ID: ci-local-only
      GOOGLE_OAUTH_CLIENT_SECRET: ci-local-only
      DATAFORSEO_ENABLED: "false"
      RAW_IMPORT_BUCKET: ci-local-only
      EXPORT_BUCKET: ci-local-only
      SF_BLOB_BACKEND: local
      SF_BLOB_DIR: /tmp/signalframe-ci-build-blobs
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ci-local-only
      OPENAI_MODEL: gpt-4o-mini
      LOG_LEVEL: warn
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          package-manager-cache: false

      - name: Enable pinned Corepack and pnpm
        run: |
          npm install --global corepack@0.34.5
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm build

      - name: Build the production worker image
        run: docker build --pull=false --file Dockerfile.worker --tag signalframe-worker:verify .

      - name: Smoke the production worker image entrypoint
        shell: bash
        run: |
          set -euo pipefail
          assert_safe_boot_failure() {
            set +e
            output="$(docker run --rm "$@" 2>&1)"
            status=$?
            set -e
            test "$status" -ne 0
            printf '%s\n' "$output" | grep --extended-regexp --quiet '^\{"event":"worker_boot_failed","code":"WORKER_BOOT_FAILED","type":"(internal|unknown)"\}$'
          }
          assert_safe_boot_failure signalframe-worker:verify

      - name: Install Chromium for mock E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Rebuild repository-owned customer deliverables
        run: pnpm artifact:regen

      - name: Require deterministic committed customer deliverables
        run: >-
          git diff --exit-code --
          docs/artifacts/GenGrowth-Interactive-Artifact.html
          docs/artifacts/GenGrowth-Product-Manual.html

      - name: Verify the complete customer Artifact and manual
        run: pnpm artifact:verify

      - name: Run complete customer Artifact browser acceptance
        run: pnpm test:e2e:artifact

      - name: Run database-free critical-flow mock E2E
        run: pnpm test:e2e:mock
